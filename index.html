<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>소통 · 기구개발팀 Team Town Hall</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* Rolex Deepsea D-Blue inspired: rich deep ocean blue fading to black */
    --navy:#01060F; --deep-blue:#0E448C; --bright-blue:#1E6FD0;
    --white:#FFFFFF; --accent-glow:rgba(30,111,208,0.45);
    --accent-soft:#7fbfff;
  }

  html, body { height:100%; }
  /* Buttons/links don't inherit type by default - make them follow the body */
  button, a, input, textarea, select { font-family: inherit; }

  body {
    font-family:"SamsungOneKoreanOTF","SamsungOneKorean","SamsungOne",
                -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",
                "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    color: var(--white);
    background: var(--navy);
    overflow: hidden;              /* carousel: page itself never scrolls */
  }

  /* ===== Fixed backdrop (shared across every slide) ===== */
  .backdrop {
    position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    background: linear-gradient(
      to bottom,
      #0E448C 0%, #0A356F 24%, #06234E 48%, #04162F 70%, #020C1B 88%, #01060F 100%
    );
    animation: kenburns 30s ease-in-out infinite alternate;
  }
  @keyframes kenburns { from { transform:scale(1); } to { transform:scale(1.07); } }

  /* Cinematic vignette: darkens the frame edges like a film print */
  .vignette { position:fixed; inset:0; z-index:2; pointer-events:none;
    background: radial-gradient(ellipse at center,
      transparent 52%, rgba(0,3,10,.30) 78%, rgba(0,3,10,.62) 100%); }
  .ambient { position:absolute; border-radius:50%; filter:blur(90px); }
  .ambient--1 { width:46vw; height:46vw; top:-12vw; left:-8vw;
    background:radial-gradient(circle,rgba(22,92,180,0.30),transparent 70%);
    animation:drift 18s ease-in-out infinite alternate; }
  .ambient--2 { width:40vw; height:40vw; top:8vh; right:-10vw;
    background:radial-gradient(circle,rgba(8,52,110,0.5),transparent 70%);
    animation:drift 22s ease-in-out infinite alternate-reverse; }
  .ambient--3 { width:70vw; height:38vw; bottom:-14vw; left:15vw;
    background:radial-gradient(circle,rgba(16,74,150,0.32),transparent 72%);
    animation:pulseGlow 9s ease-in-out infinite; }
  @keyframes drift { 0%{transform:translate3d(0,0,0) scale(1);}
    100%{transform:translate3d(3vw,2vh,0) scale(1.08);} }
  @keyframes pulseGlow { 0%,100%{opacity:.55;transform:scale(1);}
    50%{opacity:.9;transform:scale(1.06);} }

  .network { position:absolute; inset:0; width:100%; height:100%; opacity:.16; }
  .network line { stroke:var(--bright-blue); stroke-width:1; }
  .network circle { fill:var(--bright-blue); }
  .network .twinkle { animation:nodeTwinkle 4s ease-in-out infinite; }
  @keyframes nodeTwinkle { 0%,100%{opacity:.3;} 50%{opacity:1;} }

  .particles { position:absolute; inset:0; }
  .particle { position:absolute; width:3px; height:3px; border-radius:50%;
    background:rgba(255,255,255,1); box-shadow:0 0 12px 2px rgba(140,195,255,.85);
    opacity:0; animation-name:floatUp,twinkle;
    animation-timing-function:linear,ease-in-out;
    animation-iteration-count:infinite,infinite; }
  @keyframes floatUp { 0%{transform:translateY(0);} 100%{transform:translateY(-110vh);} }
  @keyframes twinkle { 0%,100%{opacity:0;} 12%,88%{opacity:1;} 50%{opacity:.45;} }

  .horizon { position:absolute; left:0; bottom:11vh; width:100%; height:1px;
    background:linear-gradient(to right,transparent 0%,rgba(255,255,255,.15) 15%,
      rgba(255,255,255,.95) 50%,rgba(255,255,255,.15) 85%,transparent 100%);
    box-shadow:0 0 24px 4px rgba(30,136,255,.6); }
  .horizon-glow { position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    width:90vw; height:28vh;
    background:radial-gradient(ellipse at center bottom,rgba(60,140,225,.45) 0%,
      rgba(20,90,170,.28) 28%,transparent 70%);
    filter:blur(10px); animation:horizonBreathe 7s ease-in-out infinite; }
  @keyframes horizonBreathe { 0%,100%{opacity:.7;} 50%{opacity:1;} }

  /* ===== Carousel deck ===== */
  .deck { position:fixed; inset:0; z-index:1; overflow:hidden; perspective:1800px; }
  .track { display:flex; height:100%; width:100%; transform-style:preserve-3d;
    transition: transform .6s cubic-bezier(.76,0,.24,1); will-change: transform; }
  .slide {
    flex: 0 0 100%; width:100%; height:100%;
    position: relative; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 7vh 6vw;
    transform-origin: center center; backface-visibility: hidden;
    will-change: transform, opacity, filter;
    transition: transform .6s cubic-bezier(.76,0,.24,1),
                opacity .45s ease, filter .45s ease;
  }

  /* ===== Scroll-reveal primitives ===== */
  .reveal { opacity: 0; transform: translateY(30px) scale(.98);
    transition: opacity .7s ease, transform .7s cubic-bezier(.22,1,.36,1);
    transition-delay: var(--d, 0s); }
  .slide.in-view .reveal { opacity: 1; transform: none; }

  /* ===== Shared typography ===== */
  .eyebrow, .kicker { font-size:clamp(11px,1.05vw,16px); letter-spacing:.5em;
    text-transform:uppercase; font-weight:600; color:rgba(180,215,255,.9);
    padding-left:.5em; }
  .kicker { margin-bottom:2.6vh; }
  .headline { font-size:clamp(38px,5.6vw,96px); font-weight:800; letter-spacing:.02em;
    line-height:1.06; color:var(--white);
    text-shadow:0 0 34px rgba(30,136,255,.5),0 0 70px rgba(30,136,255,.22); }
  .subhead { margin-top:2.4vh; font-size:clamp(15px,1.6vw,24px); font-weight:400;
    letter-spacing:.02em; color:rgba(214,232,255,.82); max-width:900px; }
  .rule { width:0; height:2px; margin:3.4vh auto 0;
    background:linear-gradient(to right,transparent,var(--bright-blue),transparent);
    box-shadow:0 0 14px 2px var(--accent-glow);
    transition:width 1.1s ease; transition-delay:var(--d,.6s); }
  .slide.in-view .rule { width:clamp(200px,26vw,460px); }

  /* ===== Intro slide ===== */
  .title { font-size:clamp(46px,5.4vw,88px); font-weight:800; letter-spacing:.10em;
    line-height:1.02; color:var(--white);
    text-shadow:0 0 30px rgba(30,136,255,.5),0 0 60px rgba(30,136,255,.22); }
  .at { font-size:clamp(26px,2.8vw,44px); font-weight:300;
    color:rgba(255,255,255,.7); margin:1.2vh 0 .5vh; }
  .team { font-size:clamp(22px,2.4vw,40px); font-weight:500; letter-spacing:.12em;
    color:var(--white); text-shadow:0 0 22px rgba(30,136,255,.4); }
  .title-rule { width:0; height:2px; margin-top:2.2vh;
    background:linear-gradient(to right,transparent,var(--bright-blue),transparent);
    box-shadow:0 0 14px 2px var(--accent-glow); transition:width 1.2s ease .8s; }
  .slide.in-view .title-rule { width:clamp(160px,18vw,320px); }

  /* ===== Video placeholder ===== */
  .video-frame { margin-top:3.6vh; width:min(60vw,720px); aspect-ratio:16/9;
    border-radius:18px; border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.04);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    overflow:hidden;
    box-shadow:0 12px 44px rgba(3,11,26,.45), inset 0 0 70px rgba(30,111,208,.08); }
  .video-frame[data-yt] { cursor:pointer;
    transition:border-color .3s ease, box-shadow .3s ease, transform .3s ease; }
  .video-frame[data-yt]:hover { border-color:rgba(30,111,208,.6); transform:translateY(-2px);
    box-shadow:0 16px 50px rgba(3,11,26,.5), 0 0 32px 3px var(--accent-glow); }
  .video-frame[data-yt]:hover .play { box-shadow:0 0 30px 5px rgba(30,111,208,.85);
    background:rgba(30,111,208,.32); }
  .video-frame iframe { width:100%; height:100%; border:0; display:block; }
  .video-frame:fullscreen, .video-frame:-webkit-full-screen {
    width:100vw; height:100vh; max-width:none; aspect-ratio:auto;
    margin:0; border:0; border-radius:0; background:#000; box-shadow:none; }
  .play { width:62px; height:62px; border-radius:50%;
    border:1px solid rgba(255,255,255,.3); display:flex; align-items:center;
    justify-content:center; background:rgba(30,111,208,.2);
    box-shadow:0 0 22px 2px var(--accent-glow); }
  .play::before { content:""; border-left:18px solid rgba(255,255,255,.92);
    border-top:11px solid transparent; border-bottom:11px solid transparent;
    margin-left:5px; }
  .video-note { font-size:clamp(12px,1vw,15px); letter-spacing:.06em;
    color:rgba(200,225,255,.7); }

  /* ===== Content panel (내용 페이지) ===== */
  .content-panel { width:min(88vw,1120px); min-height:46vh; margin-top:1vh;
    border-radius:20px; background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    box-shadow:0 10px 40px rgba(3,11,26,.4);
    display:flex; align-items:center; justify-content:center; padding:4vh 4vw; }
  .placeholder-note { font-size:clamp(13px,1.15vw,17px);
    color:rgba(190,215,255,.42); letter-spacing:.06em; }

  /* ===== Embedded page (사내 깃헙 페이지 임베드) ===== */
  /* Full-bleed: the embedded page fills the whole browser window */
  .slide--embed { padding:0; }
  .embed-wrap { width:100%; height:100%; margin:0; border:0; border-radius:0;
    overflow:hidden; box-shadow:none; background:#fff; }
  .embed-wrap iframe { width:100%; height:100%; border:0; display:block; }
  /* small, unobtrusive escape hatch pinned to the corner */
  .embed-open { position:absolute; top:14px; right:14px; z-index:5;
    padding:7px 15px; border-radius:999px; text-decoration:none;
    font-size:12px; font-weight:600; color:#fff;
    background:rgba(4,20,46,.6); border:1px solid rgba(255,255,255,.22);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    opacity:.3; transition:opacity .3s ease, background .3s ease; }
  .embed-open:hover { opacity:1; background:rgba(30,111,208,.55); }
  /* drop the cinematic vignette while a full-bleed page is on screen */
  .vignette { transition:opacity .45s ease; }
  body.embed-mode .vignette { opacity:0; }

  /* ===== Link button (사내 깃헙 연결) ===== */
  .link-btn { display:inline-flex; align-items:center; gap:12px; margin-top:4vh;
    padding:15px 32px; border-radius:999px; text-decoration:none;
    font-size:clamp(14px,1.35vw,20px); font-weight:600; color:#fff;
    background:rgba(30,111,208,.22); border:1px solid rgba(30,111,208,.55);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    box-shadow:0 6px 26px rgba(3,11,26,.4), 0 0 22px 1px var(--accent-glow);
    transition:transform .3s ease, background .3s ease, box-shadow .3s ease; }
  .link-btn:hover { transform:translateY(-3px); background:rgba(30,111,208,.36);
    box-shadow:0 10px 34px rgba(30,111,208,.45); }
  .link-btn .ext { font-size:1.1em; color:var(--accent-soft); }
  .link-btn--sm { margin-top:2vh; padding:10px 22px;
    font-size:clamp(12px,1.05vw,15px); }
  .link-note { margin-top:1.8vh; font-size:clamp(11px,.95vw,14px);
    color:rgba(190,215,255,.55); letter-spacing:.04em; }

  /* ===== Scroll hint (intro only) ===== */
  .scroll-hint { position:absolute; bottom:8vh; left:50%; transform:translateX(-50%);
    font-size:clamp(10px,.85vw,13px); letter-spacing:.3em; text-transform:uppercase;
    color:rgba(200,225,255,.7); display:flex; flex-direction:row; align-items:center;
    gap:12px; }
  .scroll-hint .chev { width:12px; height:12px;
    border-right:2px solid rgba(200,225,255,.7);
    border-bottom:2px solid rgba(200,225,255,.7); transform:rotate(-45deg);
    animation:bob 1.8s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:rotate(-45deg) translate(0,0); opacity:.5;}
    50%{transform:rotate(-45deg) translate(3px,3px); opacity:1;} }

  /* ===== Progress bar ===== */
  .progress { position:fixed; top:0; left:0; height:3px; width:0%; z-index:200;
    background:linear-gradient(90deg,var(--deep-blue),var(--bright-blue));
    box-shadow:0 0 12px 1px var(--accent-glow); transition:width .5s ease; }

  /* ===== Dot navigation ===== */
  .nav-dots { position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:row; gap:14px; z-index:120; }
  .nav-dot { width:11px; height:11px; border-radius:50%;
    background:rgba(4,20,46,.38);
    border:1.5px solid rgba(255,255,255,.92); cursor:pointer; padding:0;
    position:relative; transition:all .35s ease;
    /* dual-tone ring: the white edge reads on dark slides, the dark halo
       around it reads on white pages such as the embedded MI deck */
    box-shadow:0 0 0 1.5px rgba(0,10,26,.55), 0 1px 4px rgba(0,0,0,.35); }
  .nav-dot--sub { width:7px; height:7px; }
  .nav-dot:hover { background:rgba(30,111,208,.65); border-color:#fff; }
  .nav-dot.active { background:var(--bright-blue); border-color:#fff;
    transform:scale(1.4);
    box-shadow:0 0 0 1.5px rgba(0,10,26,.6), 0 0 12px 2px var(--accent-glow); }
  .nav-dot::after { content:attr(data-label); position:absolute; bottom:24px; left:50%;
    transform:translateX(-50%); white-space:nowrap; font-size:12px; letter-spacing:.04em;
    color:rgba(220,236,255,.92); background:rgba(4,20,46,.78);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    padding:5px 11px; border-radius:8px; border:1px solid rgba(255,255,255,.12);
    opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .nav-dot:hover::after { opacity:1; }

  /* ===== Carousel arrows ===== */
  .nav-arrow { position:fixed; top:50%; transform:translateY(-50%); z-index:130;
    width:54px; height:54px; border-radius:50%; cursor:pointer; padding:0;
    background:rgba(4,20,46,.5); border:1px solid rgba(255,255,255,.45);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    box-shadow:0 0 0 1px rgba(0,10,26,.45), 0 4px 14px rgba(0,0,0,.3);
    color:#fff; font-size:26px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition:background .3s ease, border-color .3s ease, opacity .3s ease,
               box-shadow .3s ease; }
  .nav-arrow:hover:not([disabled]) { background:rgba(30,111,208,.26);
    border-color:rgba(30,111,208,.65); box-shadow:0 0 22px 2px var(--accent-glow); }
  .nav-arrow--prev { left:28px; }
  .nav-arrow--next { right:28px; }
  .nav-arrow[disabled] { opacity:.2; cursor:default; }

  @media (max-width:780px) {
    .phrase { white-space:normal; }
    .nav-dots { gap:10px; bottom:18px; }
    .nav-arrow { width:42px; height:42px; font-size:22px; }
    .nav-arrow--prev { left:10px; }
    .nav-arrow--next { right:10px; }
    .panel-grid { gap:14px; }
    .slide { padding:6vh 5vw; }
  }

  /* Respect reduced-motion for content entrances, but keep the ambient
     background (sparkles, glow, horizon) alive so the slide never looks frozen. */
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity:1 !important; transform:none !important; transition:none !important; }
    .title-rule { width:clamp(160px,18vw,320px) !important; transition:none !important; }
    .rule { width:clamp(200px,26vw,460px) !important; transition:none !important; }
    .timeline::before { transform:scaleY(1) !important; transition:none !important; }
  }
</style>
</head>
<body>
  <!-- Progress + dot nav -->
  <div class="progress" id="progress"></div>
  <nav class="nav-dots" id="navDots">
    <button class="nav-dot" data-target="intro" data-label="소통"></button>
    <button class="nav-dot" data-target="game" data-label="온라인게임"></button>
    <button class="nav-dot nav-dot--sub" data-target="game-content" data-label="온라인게임 내용"></button>
    <button class="nav-dot" data-target="culture" data-label="조직문화 발표"></button>
    <button class="nav-dot nav-dot--sub" data-target="culture-content" data-label="조직문화 발표 내용"></button>
    <button class="nav-dot" data-target="video" data-label="영상"></button>
    <button class="nav-dot nav-dot--sub" data-target="video-content" data-label="영상 재생"></button>
    <button class="nav-dot" data-target="team-lead" data-label="팀장님 말씀"></button>
    <button class="nav-dot nav-dot--sub" data-target="team-lead-content" data-label="팀장님 말씀 내용"></button>
    <button class="nav-dot" data-target="mi-part" data-label="MI파트 발표"></button>
    <button class="nav-dot nav-dot--sub" data-target="mi-part-content" data-label="MI파트 발표 내용"></button>
    <button class="nav-dot" data-target="qna" data-label="Q&amp;A"></button>
    <button class="nav-dot nav-dot--sub" data-target="qna-content" data-label="Q&amp;A 내용"></button>
  </nav>
  <button class="nav-arrow nav-arrow--prev" id="prevBtn" aria-label="이전 페이지">&#8249;</button>
  <button class="nav-arrow nav-arrow--next" id="nextBtn" aria-label="다음 페이지">&#8250;</button>

  <!-- Shared fixed backdrop -->
  <div class="backdrop">
    <div class="ambient ambient--1"></div>
    <div class="ambient ambient--2"></div>
    <div class="ambient ambient--3"></div>
    <svg class="network" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1920 1080">
      <line x1="180" y1="160" x2="520" y2="320" />
      <line x1="520" y1="320" x2="360" y2="640" />
      <line x1="520" y1="320" x2="820" y2="240" />
      <line x1="1740" y1="200" x2="1480" y2="420" />
      <line x1="1480" y1="420" x2="1620" y2="720" />
      <line x1="1480" y1="420" x2="1180" y2="320" />
      <line x1="1620" y1="720" x2="1340" y2="860" />
      <line x1="360" y1="640" x2="180" y2="880" />
      <circle class="twinkle" cx="180" cy="160" r="4" style="animation-delay:0s" />
      <circle class="twinkle" cx="520" cy="320" r="5" style="animation-delay:.6s" />
      <circle class="twinkle" cx="360" cy="640" r="4" style="animation-delay:1.2s" />
      <circle class="twinkle" cx="820" cy="240" r="4" style="animation-delay:1.8s" />
      <circle class="twinkle" cx="1740" cy="200" r="4" style="animation-delay:.9s" />
      <circle class="twinkle" cx="1480" cy="420" r="5" style="animation-delay:1.5s" />
      <circle class="twinkle" cx="1620" cy="720" r="4" style="animation-delay:.3s" />
      <circle class="twinkle" cx="1180" cy="320" r="4" style="animation-delay:2.1s" />
      <circle class="twinkle" cx="1340" cy="860" r="4" style="animation-delay:1s" />
      <circle class="twinkle" cx="180" cy="880" r="4" style="animation-delay:1.7s" />
    </svg>
    <div class="particles" id="particles"></div>
    <div class="horizon-glow"></div>
    <div class="horizon"></div>
  </div>
  <div class="vignette"></div>

  <!-- ===== Slides ===== -->
  <main class="deck" id="deck">
    <div class="track" id="track">
    <!-- 1 · Title -->
    <section id="intro" class="slide">
      <div class="eyebrow reveal" style="--d:.1s">Team Town Hall</div>
      <h1 class="title reveal" style="--d:.25s; font-size:clamp(72px,10vw,168px); letter-spacing:.06em">소통</h1>
      <div class="at reveal" style="--d:.45s">@</div>
      <div class="team reveal" style="--d:.6s">기구개발팀</div>
      <div class="title-rule"></div>

      <div class="scroll-hint reveal" style="--d:1s">
        <span>Next</span><span class="chev"></span>
      </div>
    </section>

    <!-- 온라인게임 (제목) -->
    <section id="game" class="slide">
      <div class="kicker reveal" style="--d:.1s">01</div>
      <h2 class="headline reveal" style="--d:.3s">온라인게임</h2>
      <div class="rule" style="--d:.55s"></div>
    </section>

    <!-- 온라인게임 (내용) -->
    <section id="game-content" class="slide">
      <div class="kicker reveal" style="--d:.1s">온라인게임</div>
      <div class="content-panel reveal" style="--d:.3s">
        <p class="placeholder-note">내용 준비 중</p>
      </div>
    </section>

    <!-- 조직문화 발표 (제목) -->
    <section id="culture" class="slide">
      <div class="kicker reveal" style="--d:.1s">02</div>
      <h2 class="headline reveal" style="--d:.3s">조직문화 발표</h2>
      <div class="rule" style="--d:.55s"></div>
    </section>

    <!-- 조직문화 발표 (내용) -->
    <section id="culture-content" class="slide">
      <div class="kicker reveal" style="--d:.1s">조직문화 발표</div>
      <div class="content-panel reveal" style="--d:.3s">
        <p class="placeholder-note">내용 준비 중</p>
      </div>
    </section>

    <!-- 영상 (제목) -->
    <section id="video" class="slide">
      <div class="kicker reveal" style="--d:.1s">03</div>

    <!-- 영상 (내용) -->

           role="button" tabindex="0" aria-label="영상 전체화면 재생">

    <!-- 팀장님 말씀 (내용) -->

         target="_blank" rel="noopener">사내 깃헙 페이지 열기 <span class="ext">&#8599;</span></a>

    <!-- MI파트 발표 (제목) -->

         target="_blank" rel="noopener">새 탭에서 열기 &#8599;</a>

    <!-- Q&A (제목) -->

      <div class="kicker reveal" style="--d:.1s">06</div>
      <h2 class="headline reveal" style="--d:.3s">Q&amp;A</h2>

    <!-- Q&A (내용) -->

      <div class="kicker reveal" style="--d:.1s">Q&amp;A</div>

        <p class="placeholder-note">내용 준비 중</p>

  </main>

  <script>
    // ----- Floating particles (generated once on the fixed backdrop) -----
    (function () {
      var container = document.getElementById('particles');
      // Scale particle count with viewport area so large monitors aren't sparse.
      var COUNT = Math.min(180, Math.max(70,
        Math.round(window.innerWidth * window.innerHeight / 16000)));
      var frag = document.createDocumentFragment();
      for (var i = 0; i < COUNT; i++) {
        var p = document.createElement('span');
        p.className = 'particle';
        var size = Math.random() * 3.5 + 2,
            floatDur = Math.random() * 18 + 14,
            twDur = Math.random() * 3 + 2.5;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = (Math.random() * 100) + 'vw';
        p.style.top = (Math.random() * 100) + 'vh';
        p.style.animationDuration = floatDur + 's, ' + twDur + 's';
        p.style.animationDelay = (-Math.random() * floatDur) + 's, ' + (-Math.random() * twDur) + 's';
        frag.appendChild(p);
      }
      container.appendChild(frag);
    })();

    var track   = document.getElementById('track');
    var slides  = Array.prototype.slice.call(document.querySelectorAll('.slide'));
    var dots    = Array.prototype.slice.call(document.querySelectorAll('.nav-dot'));
    var progress = document.getElementById('progress');
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    var TOTAL   = slides.length;
    var current = 0;
    var revealTimer = null;

    // ----- Render current carousel position -----
    function render() {
      track.style.transform = 'translate3d(' + (-current * 100) + '%,0,0)';
      dots.forEach(function (d, i) { d.classList.toggle('active', i === current); });
      progress.style.width = ((current + 1) / TOTAL * 100) + '%';
      prevBtn.disabled = (current === 0);
      nextBtn.disabled = (current === TOTAL - 1);

      // a full-bleed embed gets the whole frame: drop the vignette
      document.body.classList.toggle('embed-mode',
        slides[current].classList.contains('slide--embed'));

      // Cinematic depth: the focused slide sits forward, sharp and lit;
      // its neighbours fall back — smaller, dimmer, out of focus, tilted away.
      slides.forEach(function (sl, i) {
        var off = i - current, a = Math.abs(off);
        if (a === 0) {
          sl.style.transform = 'scale(1) rotateY(0deg)';
          sl.style.opacity = '1';
          sl.style.filter = 'none';
        } else if (a === 1) {
          sl.style.transform = 'scale(.86) rotateY(' + (off > 0 ? -12 : 12) + 'deg)';
          sl.style.opacity = '.3';
          sl.style.filter = 'blur(6px)';
        } else {
          // far slides: no blur filter, keeps the GPU cost down
          sl.style.transform = 'scale(.8)';
          sl.style.opacity = '0';
          sl.style.filter = 'none';
        }
      });

      // play the entrance animation on the slide we landed on
      slides[current].classList.add('in-view');
      // clear the others only after the slide finishes moving, so the
      // outgoing slide doesn't blank out mid-transition
      clearTimeout(revealTimer);
      revealTimer = setTimeout(function () {
        slides.forEach(function (sl, i) {
          if (i !== current) sl.classList.remove('in-view');
        });
      }, 700);
    }

    function goTo(i) {
      i = Math.max(0, Math.min(TOTAL - 1, i));
      if (i === current) return;
      current = i;
      render();
    }
    function next() { goTo(current + 1); }
    function prev() { goTo(current - 1); }

    // Placeholder GitHub links: do nothing until a real URL is filled in
    document.querySelectorAll('a[data-needs-url]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        if (a.getAttribute('href') === '#') e.preventDefault();
      });
    });

    prevBtn.addEventListener('click', prev);
    nextBtn.addEventListener('click', next);
    dots.forEach(function (d, i) {
      d.addEventListener('click', function () { goTo(i); });
    });

    // ----- Video: click to play fullscreen, return when it ends -----
    (function () {
      var ytReady = false, ytQueue = [];
      window.onYouTubeIframeAPIReady = function () {
        ytReady = true;
        ytQueue.forEach(function (fn) { fn(); });
        ytQueue = [];
      };
      function whenYT(fn) { if (ytReady) { fn(); } else { ytQueue.push(fn); } }
      var tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);

      function exitFullscreen() {
        var ex = document.exitFullscreen || document.webkitExitFullscreen;
        if (ex && (document.fullscreenElement || document.webkitFullscreenElement)) {
          try { ex.call(document); } catch (e) {}
        }
      }

      document.querySelectorAll('.video-frame[data-yt]').forEach(function (frame, n) {
        var id = frame.dataset.yt;
        var holderId = 'ytplayer-' + n;
        var placeholder = frame.innerHTML;
        var player = null;

        // Put the poster back so the slide looks untouched afterwards
        function restore() {
          if (!frame.dataset.playing) return;
          frame.dataset.playing = '';
          if (player) { try { player.destroy(); } catch (e) {} player = null; }
          frame.innerHTML = placeholder;
        }
        frame.addEventListener('video-restore', restore);

        function play() {
          if (frame.dataset.playing) return;
          frame.dataset.playing = '1';
          // must be requested inside the click gesture or the browser blocks it
          var rf = frame.requestFullscreen || frame.webkitRequestFullscreen;
          if (rf) { try { rf.call(frame); } catch (e) {} }
          frame.innerHTML = '<div id="' + holderId + '"></div>';
          whenYT(function () {
            player = new YT.Player(holderId, {
              videoId: id,
              playerVars: { autoplay: 1, rel: 0, modestbranding: 1, playsinline: 1 },
              events: {
                onReady: function (e) { e.target.playVideo(); },
                onStateChange: function (e) {
                  if (e.data === YT.PlayerState.ENDED) { exitFullscreen(); restore(); }
                }
              }
            });
          });
        }
        frame.addEventListener('click', play);
        frame.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); }
        });
      });

      // Leaving fullscreen by hand (Esc) should also reset the slide
      ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (evt) {
        document.addEventListener(evt, function () {
          if (document.fullscreenElement || document.webkitFullscreenElement) return;
          document.querySelectorAll('.video-frame[data-playing="1"]').forEach(function (f) {
            f.dispatchEvent(new CustomEvent('video-restore'));
          });
        });
      });
    })();

    // ----- Keyboard -----
    window.addEventListener('keydown', function (e) {
      if (e.defaultPrevented) return;           // e.g. Space used to play the video
      if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].indexOf(e.key) !== -1) {
        e.preventDefault(); next();
      } else if (['ArrowLeft', 'ArrowUp', 'PageUp'].indexOf(e.key) !== -1) {
        e.preventDefault(); prev();
      } else if (e.key === 'Home') {
        e.preventDefault(); goTo(0);
      } else if (e.key === 'End') {
        e.preventDefault(); goTo(TOTAL - 1);
      }
    });

    // ----- Wheel / trackpad (throttled so one gesture = one slide) -----
    var wheelLock = false;
    window.addEventListener('wheel', function (e) {
      var d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
      if (Math.abs(d) < 12 || wheelLock) return;
      wheelLock = true;
      setTimeout(function () { wheelLock = false; }, 700);
      if (d > 0) next(); else prev();
    }, { passive: true });

    // ----- Touch swipe -----
    var tX = 0, tY = 0;
    window.addEventListener('touchstart', function (e) {
      tX = e.touches[0].clientX; tY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchend', function (e) {
      var dx = e.changedTouches[0].clientX - tX;
      var dy = e.changedTouches[0].clientY - tY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) next(); else prev();
      }
    }, { passive: true });

    render();
  </script>
