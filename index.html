<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEW HORIZON · Team Town Hall</title>
<style>
  /* ===== Reset & Base ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy:        #030B1A;
    --deep-blue:   #0B4F9C;
    --bright-blue: #1E88FF;
    --white:       #FFFFFF;
    --accent-glow: rgba(30, 136, 255, 0.5);
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Helvetica Neue", "Malgun Gothic", "Apple SD Gothic Neo",
                 "Noto Sans KR", sans-serif;
    color: var(--white);
    background: var(--navy);
    /* Vertical gradient: dark navy (top) -> deep cobalt (mid) -> Samsung blue (bottom) */
    background: linear-gradient(
      to bottom,
      #030B1A 0%,
      #06234E 32%,
      #0B4F9C 64%,
      #156FD0 86%,
      #1E88FF 100%
    );
    position: relative;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    /* Scale the whole composition relative to viewport so a 1920x1080
       layout fits any screen without scrolling. */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ===== Ambient glow blobs ===== */
  .ambient {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: 0;
  }
  .ambient--1 {
    width: 46vw; height: 46vw;
    top: -12vw; left: -8vw;
    background: radial-gradient(circle, rgba(30,136,255,0.28), transparent 70%);
    animation: drift 18s ease-in-out infinite alternate;
  }
  .ambient--2 {
    width: 40vw; height: 40vw;
    top: 8vh; right: -10vw;
    background: radial-gradient(circle, rgba(11,79,156,0.45), transparent 70%);
    animation: drift 22s ease-in-out infinite alternate-reverse;
  }
  .ambient--3 {
    width: 70vw; height: 38vw;
    bottom: -14vw; left: 15vw;
    background: radial-gradient(circle, rgba(30,136,255,0.30), transparent 72%);
    animation: pulseGlow 9s ease-in-out infinite;
  }

  @keyframes drift {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    100% { transform: translate3d(3vw, 2vh, 0) scale(1.08); }
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 0.9;  transform: scale(1.06); }
  }

  /* ===== AI network / geometric line overlay ===== */
  .network {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    opacity: 0.18;
    pointer-events: none;
  }
  .network line { stroke: var(--bright-blue); stroke-width: 1; }
  .network circle { fill: var(--bright-blue); }
  .network .twinkle {
    animation: nodeTwinkle 4s ease-in-out infinite;
  }
  @keyframes nodeTwinkle {
    0%, 100% { opacity: 0.3; }
    50%      { opacity: 1; }
  }

  /* ===== Particle field ===== */
  .particles {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    box-shadow: 0 0 6px 1px var(--accent-glow);
    opacity: 0;
    animation-name: floatUp, twinkle;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite, infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0); }
    100% { transform: translateY(-110vh); }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; }
    15%, 85% { opacity: 0.9; }
    50%      { opacity: 0.35; }
  }

  /* ===== Horizon line & light ===== */
  .horizon {
    position: absolute;
    left: 0;
    bottom: 16vh;
    width: 100%;
    height: 1px;
    z-index: 2;
    background: linear-gradient(
      to right,
      transparent 0%,
      rgba(255,255,255,0.15) 15%,
      rgba(255,255,255,0.95) 50%,
      rgba(255,255,255,0.15) 85%,
      transparent 100%
    );
    box-shadow: 0 0 24px 4px rgba(30,136,255,0.65);
  }
  .horizon-glow {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 90vw;
    height: 32vh;
    z-index: 1;
    background: radial-gradient(
      ellipse at center bottom,
      rgba(120,190,255,0.55) 0%,
      rgba(30,136,255,0.30) 28%,
      transparent 70%
    );
    filter: blur(10px);
    pointer-events: none;
    animation: horizonBreathe 7s ease-in-out infinite;
  }
  @keyframes horizonBreathe {
    0%, 100% { opacity: 0.7; }
    50%      { opacity: 1; }
  }

  /* ===== Content layer ===== */
  .content {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 100%;
    height: 100%;
    padding: 5vh 4vw;
  }

  /* ===== Title ===== */
  .title-block {
    margin-top: 7vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .eyebrow {
    font-size: clamp(11px, 1.05vw, 16px);
    letter-spacing: 0.55em;
    text-transform: uppercase;
    font-weight: 600;
    color: rgba(180, 215, 255, 0.9);
    margin-bottom: 2.4vh;
    padding-left: 0.55em;
    opacity: 0;
    animation: fadeUp 1s ease forwards;
    animation-delay: 0.2s;
  }
  .title {
    font-size: clamp(52px, 6.0vw, 96px);
    font-weight: 800;
    letter-spacing: 0.10em;
    line-height: 1.02;
    color: var(--white);
    text-shadow: 0 0 30px rgba(30,136,255,0.55),
                 0 0 60px rgba(30,136,255,0.25);
    opacity: 0;
    animation: fadeUp 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: 0.4s;
  }
  .at {
    font-size: clamp(28px, 3.0vw, 48px);
    font-weight: 300;
    color: rgba(255, 255, 255, 0.7);
    margin: 1.6vh 0 0.6vh;
    opacity: 0;
    animation: fadeUp 1.1s ease forwards;
    animation-delay: 0.65s;
  }
  .team {
    font-size: clamp(24px, 2.6vw, 44px);
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--white);
    text-shadow: 0 0 22px rgba(30,136,255,0.45);
    opacity: 0;
    animation: fadeUp 1.1s ease forwards;
    animation-delay: 0.85s;
  }
  .title-rule {
    width: 0;
    height: 2px;
    margin-top: 2.6vh;
    background: linear-gradient(to right, transparent, var(--bright-blue), transparent);
    box-shadow: 0 0 14px 2px var(--accent-glow);
    animation: growRule 1.2s ease forwards;
    animation-delay: 1.05s;
  }
  @keyframes growRule {
    to { width: clamp(160px, 18vw, 320px); }
  }

  /* ===== Agenda timeline ===== */
  .agenda {
    margin-top: auto;
    margin-bottom: 19vh;
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    gap: 1.15vh;
    position: relative;
  }
  .agenda-label {
    font-size: clamp(11px, 1vw, 14px);
    letter-spacing: 0.45em;
    text-transform: uppercase;
    font-weight: 600;
    color: rgba(170, 210, 255, 0.85);
    text-align: center;
    margin-bottom: 1.6vh;
    opacity: 0;
    animation: fadeUp 0.9s ease forwards;
    animation-delay: 1.1s;
  }

  .timeline {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 1.15vh;
  }
  /* Glowing connector line running through the number circles */
  .timeline::before {
    content: "";
    position: absolute;
    left: 24px;
    top: 24px;
    bottom: 24px;
    width: 2px;
    background: linear-gradient(
      to bottom,
      rgba(30,136,255,0.0),
      rgba(30,136,255,0.85) 12%,
      rgba(30,136,255,0.85) 88%,
      rgba(30,136,255,0.0)
    );
    box-shadow: 0 0 12px 1px var(--accent-glow);
    transform-origin: top;
    transform: scaleY(0);
    animation: growLine 1.1s ease forwards;
    animation-delay: 1.2s;
  }
  @keyframes growLine {
    to { transform: scaleY(1); }
  }

  .agenda-item {
    position: relative;
    display: flex;
    align-items: center;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    gap: 22px;
    padding: 1.4vh 26px 1.4vh 14px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 24px rgba(3, 11, 26, 0.35);
    opacity: 0;
    transform: translateY(22px);
    animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    transition: transform 0.35s ease, box-shadow 0.35s ease,
                border-color 0.35s ease, background 0.35s ease;
  }
  .agenda-item:hover {
    transform: translateY(-3px) translateX(4px);
    background: rgba(30, 136, 255, 0.14);
    border-color: rgba(30, 136, 255, 0.6);
    box-shadow: 0 8px 34px rgba(30, 136, 255, 0.35),
                0 0 0 1px rgba(30,136,255,0.25);
  }

  .num {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    color: var(--white);
    background: radial-gradient(circle at 35% 30%, #3a9bff, #0B4F9C);
    border: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow: 0 0 14px 2px var(--accent-glow);
    z-index: 1;
    transition: box-shadow 0.35s ease, transform 0.35s ease;
  }
  .agenda-item:hover .num {
    box-shadow: 0 0 22px 5px rgba(30,136,255,0.8);
    transform: scale(1.08);
  }

  .agenda-text {
    font-size: clamp(16px, 1.55vw, 24px);
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--white);
    text-align: left;
  }

  /* Stagger the agenda entrance */
  .agenda-item:nth-child(1) { animation-delay: 1.30s; }
  .agenda-item:nth-child(2) { animation-delay: 1.45s; }
  .agenda-item:nth-child(3) { animation-delay: 1.60s; }
  .agenda-item:nth-child(4) { animation-delay: 1.75s; }
  .agenda-item:nth-child(5) { animation-delay: 1.90s; }

  /* ===== Shared entrance keyframe ===== */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== Footer hint ===== */
  .footer {
    position: absolute;
    bottom: 4.5vh;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 5;
    font-size: clamp(10px, 0.9vw, 13px);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(200, 225, 255, 0.65);
    opacity: 0;
    animation: fadeUp 1s ease forwards;
    animation-delay: 2.1s;
  }

  /* ===== Reduced motion ===== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .particle { opacity: 0.5; }
    .title-rule { width: clamp(160px, 18vw, 320px); }
    .timeline::before { transform: scaleY(1); }
    [class]:not(.particle) { opacity: 1 !important; }
  }
</style>
</head>
<body>
  <div class="stage">
    <!-- Ambient glow blobs -->
    <div class="ambient ambient--1"></div>
    <div class="ambient ambient--2"></div>
    <div class="ambient ambient--3"></div>

    <!-- Faint AI network overlay -->
    <svg class="network" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1920 1080">
      <line x1="180" y1="160" x2="520" y2="320" />
      <line x1="520" y1="320" x2="360" y2="640" />
      <line x1="520" y1="320" x2="820" y2="240" />
      <line x1="1740" y1="200" x2="1480" y2="420" />
      <line x1="1480" y1="420" x2="1620" y2="720" />
      <line x1="1480" y1="420" x2="1180" y2="320" />
      <line x1="1620" y1="720" x2="1340" y2="860" />
      <line x1="360" y1="640" x2="180" y2="880" />
      <circle class="twinkle" cx="180" cy="160" r="4" style="animation-delay:0s" />
      <circle class="twinkle" cx="520" cy="320" r="5" style="animation-delay:0.6s" />
      <circle class="twinkle" cx="360" cy="640" r="4" style="animation-delay:1.2s" />
      <circle class="twinkle" cx="820" cy="240" r="4" style="animation-delay:1.8s" />
      <circle class="twinkle" cx="1740" cy="200" r="4" style="animation-delay:0.9s" />
      <circle class="twinkle" cx="1480" cy="420" r="5" style="animation-delay:1.5s" />
      <circle class="twinkle" cx="1620" cy="720" r="4" style="animation-delay:0.3s" />
      <circle class="twinkle" cx="1180" cy="320" r="4" style="animation-delay:2.1s" />
      <circle class="twinkle" cx="1340" cy="860" r="4" style="animation-delay:1.0s" />
      <circle class="twinkle" cx="180" cy="880" r="4" style="animation-delay:1.7s" />
    </svg>

    <!-- Particle field (populated by JS) -->
    <div class="particles" id="particles"></div>

    <!-- Horizon light -->
    <div class="horizon-glow"></div>
    <div class="horizon"></div>

    <!-- Main content -->
    <div class="content">
      <div class="title-block">
        <div class="eyebrow">Team Town Hall</div>
        <h1 class="title">NEW HORIZON</h1>
        <div class="at">@</div>
        <div class="team">기구개발팀</div>
        <div class="title-rule"></div>
      </div>

      <div class="agenda">
        <div class="agenda-label">Agenda</div>
        <div class="timeline">
          <a class="agenda-item" href="01-ax-video.html">
            <div class="num">1</div>
            <div class="agenda-text">AX영상 시청</div>
          </a>
          <a class="agenda-item" href="02-team-lead.html">
            <div class="num">2</div>
            <div class="agenda-text">팀장님 말씀</div>
          </a>
          <a class="agenda-item" href="03-ai-mindset.html">
            <div class="num">3</div>
            <div class="agenda-text">AI MINDSET</div>
          </a>
          <a class="agenda-item" href="04-ax-talk.html">
            <div class="num">4</div>
            <div class="agenda-text">AX TALK</div>
          </a>
          <a class="agenda-item" href="05-new-horizon.html">
            <div class="num">5</div>
            <div class="agenda-text">To the New Horizon</div>
          </a>
        </div>
      </div>
    </div>

    <div class="footer">Future Vision · AI Transformation Journey</div>
  </div>

  <script>
    // Generate a subtle field of floating light particles.
    (function () {
      var container = document.getElementById('particles');
      var COUNT = 38;
      var frag = document.createDocumentFragment();

      for (var i = 0; i < COUNT; i++) {
        var p = document.createElement('span');
        p.className = 'particle';

        var size = Math.random() * 2.5 + 1;          // 1 - 3.5px
        var left = Math.random() * 100;              // vw
        var startTop = Math.random() * 100;          // vh, staggered start
        var floatDur = Math.random() * 18 + 14;      // 14 - 32s rise
        var twinkleDur = Math.random() * 3 + 2.5;    // 2.5 - 5.5s
        var delay = -Math.random() * floatDur;       // negative = mid-cycle start

        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = left + 'vw';
        p.style.top = startTop + 'vh';
        p.style.animationDuration = floatDur + 's, ' + twinkleDur + 's';
        p.style.animationDelay = delay + 's, ' + (-Math.random() * twinkleDur) + 's';

        frag.appendChild(p);
      }
      container.appendChild(frag);
    })();

    // Advance to the next slide with the right arrow / page-down / space.
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        window.location.href = '01-ax-video.html';
      }
    });
  </script>
</body>
</html>
