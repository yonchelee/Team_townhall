<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* Rolex Deepsea D-Blue inspired: rich deep ocean blue fading to black */
    --navy:#01060F; --deep-blue:#0E448C; --bright-blue:#1E6FD0;
    --white:#FFFFFF; --accent-glow:rgba(30,111,208,0.45);
    --accent-soft:#7fbfff;
  }

  html, body { height:100%; }
  /* Buttons/links don't inherit type by default - make them follow the body */
  button, a, input, textarea, select { font-family: inherit; }

  body {
    font-family:"SamsungOneKoreanOTF","SamsungOneKorean","SamsungOne",
                -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",
                "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    color: var(--white);
    background: var(--navy);
    overflow: hidden;              /* carousel: page itself never scrolls */
  }

  /* ===== Fixed backdrop (shared across every slide) ===== */
  .backdrop {
    position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    background:
      radial-gradient(58% 48% at 18% 8%, rgba(60,86,255,.34) 0%, transparent 70%),
      radial-gradient(46% 40% at 88% 22%, rgba(0,188,190,.20) 0%, transparent 72%),
      radial-gradient(70% 55% at 62% 108%, rgba(122,58,240,.28) 0%, transparent 72%),
      linear-gradient(
        to bottom,
        #071C3E 0%, #061834 24%, #041228 48%, #030C1C 70%, #020712 88%, #01050C 100%
      );
    animation: kenburns 30s ease-in-out infinite alternate;
  }
  @keyframes kenburns { from { transform:scale(1); } to { transform:scale(1.07); } }

  /* Cinematic vignette: darkens the frame edges like a film print */
  .vignette { position:fixed; inset:0; z-index:2; pointer-events:none;
    background: radial-gradient(ellipse at center,
      transparent 44%, rgba(0,3,10,.40) 74%, rgba(0,3,10,.78) 100%); }
  .ambient { position:absolute; border-radius:50%; filter:blur(90px); }
  .ambient--1 { width:46vw; height:46vw; top:-12vw; left:-8vw;
    background:radial-gradient(circle,rgba(22,92,180,0.30),transparent 70%);
    animation:drift 18s ease-in-out infinite alternate; }
  .ambient--2 { width:40vw; height:40vw; top:8vh; right:-10vw;
    background:radial-gradient(circle,rgba(8,52,110,0.5),transparent 70%);
    animation:drift 22s ease-in-out infinite alternate-reverse; }
  .ambient--3 { width:70vw; height:38vw; bottom:-14vw; left:15vw;
    background:radial-gradient(circle,rgba(16,74,150,0.32),transparent 72%);
    animation:pulseGlow 9s ease-in-out infinite; }
  @keyframes drift { 0%{transform:translate3d(0,0,0) scale(1);}
    100%{transform:translate3d(3vw,2vh,0) scale(1.08);} }
  @keyframes pulseGlow { 0%,100%{opacity:.55;transform:scale(1);}
    50%{opacity:.9;transform:scale(1.06);} }

    box-shadow:0 0 12px 1px rgba(255,255,255,.6);

  @keyframes cometPass {
    0%{transform:translate3d(-10vw,-10vh,0) rotate(24deg);opacity:0;}
    8%{opacity:1;} 40%{opacity:0;}
    100%{transform:translate3d(110vw,80vh,0) rotate(24deg);opacity:0;} }

  .sheen { position:absolute; top:50%; left:50%; width:160vmax; height:160vmax;
    margin:-80vmax 0 0 -80vmax; pointer-events:none; opacity:.22;
    background:conic-gradient(from 0deg, transparent 0deg, var(--bright-blue) 40deg,
      transparent 96deg, transparent 240deg, var(--bright-blue) 290deg, transparent 340deg);
    -webkit-mask-image:radial-gradient(closest-side, transparent 32%, #000 62%, transparent 86%);
    mask-image:radial-gradient(closest-side, transparent 32%, #000 62%, transparent 86%);
    filter:blur(28px); animation:sheenSpin 48s linear infinite; }
  @keyframes sheenSpin { to { transform: rotate(360deg); } }

  .network { position:absolute; inset:0; width:100%; height:100%; opacity:.07; }
  .network line { stroke:var(--bright-blue); stroke-width:1; }
  .network circle { fill:var(--bright-blue); }
  .network .twinkle { animation:nodeTwinkle 4s ease-in-out infinite; }
  @keyframes nodeTwinkle { 0%,100%{opacity:.3;} 50%{opacity:1;} }

  .particles { position:absolute; inset:0; }
  .particle { position:absolute; width:3px; height:3px; border-radius:50%;
    background:rgba(255,255,255,1); box-shadow:0 0 12px 2px rgba(140,195,255,.85);
    opacity:0; animation-name:floatUp,twinkle;
    animation-timing-function:linear,ease-in-out;
    animation-iteration-count:infinite,infinite; }
  @keyframes floatUp { 0%{transform:translateY(0);} 100%{transform:translateY(-110vh);} }
  @keyframes twinkle { 0%,100%{opacity:0;} 12%,88%{opacity:1;} 50%{opacity:.45;} }

  .horizon { position:absolute; left:0; bottom:11vh; width:100%; height:1px;
    background:linear-gradient(to right,transparent 0%,rgba(255,255,255,.15) 15%,
      rgba(255,255,255,.95) 50%,rgba(255,255,255,.15) 85%,transparent 100%);
    box-shadow:0 0 24px 4px rgba(30,136,255,.45); opacity:.75; }
  .horizon-glow { position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    width:90vw; height:28vh;
    background:radial-gradient(ellipse at center bottom,rgba(60,140,225,.45) 0%,
      rgba(20,90,170,.28) 28%,transparent 70%);
    filter:blur(10px); animation:horizonBreathe 7s ease-in-out infinite; }
  @keyframes horizonBreathe { 0%,100%{opacity:.7;} 50%{opacity:1;} }

  /* ===== Carousel deck ===== */
  .deck { position:fixed; inset:0; z-index:1; overflow:hidden; perspective:1800px; }
  .track { display:flex; height:100%; width:100%; transform-style:preserve-3d;
    transition: transform .6s cubic-bezier(.76,0,.24,1); will-change: transform; }
  .slide {
    flex: 0 0 100%; width:100%; height:100%;
    position: relative; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 7vh 6vw;
    transform-origin: center center; backface-visibility: hidden;
    will-change: transform, opacity, filter;
    transition: transform .6s cubic-bezier(.76,0,.24,1),
                opacity .45s ease, filter .45s ease;
  }

  /* ===== Scroll-reveal primitives ===== */
  .reveal { opacity: 0; transform: translateY(30px) scale(.98);
    transition: opacity .7s ease, transform .7s cubic-bezier(.22,1,.36,1);
    transition-delay: var(--d, 0s); }
  .slide.in-view .reveal { opacity: 1; transform: none; }

  /* ===== Shared typography ===== */
  .eyebrow, .kicker { font-size:clamp(11px,1.05vw,16px); letter-spacing:.5em;
    text-transform:uppercase; font-weight:600; color:rgba(180,215,255,.9);
    padding-left:.5em; }
  .kicker { margin-bottom:2.6vh; }
  .headline { font-size:clamp(32px,5vw,96px); font-weight:800; letter-spacing:.02em;
    line-height:1.06; color:var(--white); white-space:nowrap;
    text-shadow:0 0 34px rgba(30,136,255,.5),0 0 70px rgba(30,136,255,.22); }
  .subhead { margin-top:2.4vh; font-size:clamp(15px,1.6vw,24px); font-weight:400;
    letter-spacing:.02em; color:rgba(214,232,255,.82); max-width:900px; }
  .rule { width:0; height:2px; margin:3.4vh auto 0;
    background:linear-gradient(to right,transparent,var(--bright-blue),transparent);
    box-shadow:0 0 14px 2px var(--accent-glow);
    transition:width 1.1s ease; transition-delay:var(--d,.6s); }
  .slide.in-view .rule { width:clamp(200px,26vw,460px); }

  /* ===== Intro slide ===== */
  .title { font-size:clamp(46px,5.4vw,88px); font-weight:800; letter-spacing:.10em;
    line-height:1.02; color:var(--white);
    text-shadow:0 0 30px rgba(30,136,255,.5),0 0 60px rgba(30,136,255,.22); }
  .at { font-size:clamp(26px,2.8vw,44px); font-weight:300;
    color:rgba(255,255,255,.7); margin:1.2vh 0 .5vh; }
  .team { font-size:clamp(22px,2.4vw,40px); font-weight:500; letter-spacing:.12em;
    color:var(--white); text-shadow:0 0 22px rgba(30,136,255,.4); }
  .title-rule { width:0; height:2px; margin-top:2.2vh;
    background:linear-gradient(to right,transparent,var(--bright-blue),transparent);
    box-shadow:0 0 14px 2px var(--accent-glow); transition:width 1.2s ease .8s; }
  .slide.in-view .title-rule { width:clamp(160px,18vw,320px); }

  /* ===== Lucky Draw: names | dial | winners ===== */
  .slide--draw { padding:3vh 2vw; }
  .draw-layout { display:flex; align-items:center; justify-content:center;
    gap:clamp(12px,1.5vw,28px); width:100%; }
  /* Equal-width side columns put the dial on the page centre line. The
     roster panel does not need its whole column; the leftover is simply
     empty, which is what keeps the dial centred. */
  .draw-side { flex:1 1 0; min-width:0; display:flex; align-items:center; }
  .draw-side--left { justify-content:flex-start; }
  .draw-side--right { justify-content:flex-end; }
  .roster-card, .winners-panel { flex:1 1 auto; width:100%; max-width:640px;
    max-height:78vh;
    display:flex; flex-direction:column; gap:10px; padding:18px 16px;
    border-radius:18px; background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    box-shadow:0 10px 36px rgba(3,11,26,.45); }
  /* the winner list is the one people read from the back of the room */
  .winners-panel { padding:22px 20px; gap:13px; }
  /* Left column is now audience-facing status, not an operator form */
  .roster-card { padding:22px 20px; gap:14px; }
  .rc-count { display:flex; align-items:baseline; gap:10px; }
  .rc-num { font-size:clamp(46px,5vw,104px); font-weight:800; line-height:1;
    color:#fff; font-variant-numeric:tabular-nums;
    text-shadow:0 0 30px rgba(30,136,255,.6), 0 0 70px rgba(30,136,255,.28); }
  .rc-total { font-size:clamp(13px,1.25vw,19px); color:rgba(190,215,255,.72); }
  .rc-total b { color:#fff; font-weight:700; }
  .rc-bar { height:6px; border-radius:99px; background:rgba(255,255,255,.1);
    overflow:hidden; }
  .rc-bar i { display:block; height:100%; border-radius:99px; width:0;
    background:linear-gradient(90deg,var(--deep-blue),var(--bright-blue));
    box-shadow:0 0 12px 1px var(--accent-glow); transition:width .6s ease; }
  .rc-meta { font-size:clamp(11px,1.05vw,15px); color:rgba(190,215,255,.7); }
  .rc-btn { margin-top:auto; padding:11px 18px; border-radius:999px;
    cursor:pointer; font-size:clamp(12px,1.15vw,16px); font-weight:600;
    color:rgba(220,236,255,.92); background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.22);
    transition:background .25s ease, border-color .25s ease; }
  .rc-btn:hover { background:rgba(30,111,208,.3);
    border-color:rgba(30,111,208,.6); color:#fff; }

  /* the form itself moves into a drawer the presenter opens when needed */
  .roster-drawer { position:fixed; inset:0; z-index:200; visibility:hidden; }
  .roster-drawer.open { visibility:visible; }
  .roster-drawer .scrim { position:absolute; inset:0; opacity:0;
    background:rgba(1,6,15,.72); -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px); transition:opacity .35s ease; }
  .roster-drawer.open .scrim { opacity:1; }
  .roster-drawer .sheet { position:absolute; left:0; top:0; bottom:0;
    width:min(440px,92vw); padding:26px 24px; overflow-y:auto;
    background:rgba(5,18,40,.97);
    border-right:1px solid rgba(255,255,255,.16);
    box-shadow:24px 0 60px rgba(0,0,0,.5);
    display:flex; flex-direction:column; gap:12px;
    transform:translateX(-100%);
    transition:transform .4s cubic-bezier(.22,1,.36,1); }
  .roster-drawer.open .sheet { transform:none; }
  .sheet-head { display:flex; align-items:center; justify-content:space-between; }
  .sheet-x { width:32px; height:32px; border-radius:50%; cursor:pointer;
    font-size:20px; line-height:1; color:#fff;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); }
  .sheet-x:hover { background:rgba(214,64,64,.3); border-color:rgba(214,64,64,.6); }
  .roster-drawer textarea { flex:1 1 auto; min-height:240px; resize:vertical;
    padding:10px 11px; border-radius:12px; font-size:13px; line-height:1.55;
    color:#fff; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.18); }
  .winners-panel .panel-title { font-size:clamp(14px,1.45vw,22px);
    letter-spacing:.18em; }
  .panel-title { font-size:clamp(10px,.95vw,13px); letter-spacing:.2em;
    text-transform:uppercase; font-weight:700; color:rgba(180,215,255,.9); }
  .panel-title span { color:#fff; }

  .panel-hint { font-size:11px; color:rgba(190,215,255,.5); letter-spacing:.02em; }
  .panel-hint b { color:rgba(220,236,255,.85); font-weight:700; }
  .col-map { display:flex; gap:8px; }
  .col-map label { flex:1 1 0; display:flex; align-items:center; gap:5px;
    font-size:11px; color:rgba(190,215,255,.7); }
  .col-map select { flex:1 1 0; min-width:0; padding:4px 6px; border-radius:8px;
    font-size:11px; color:#fff; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2); }
  .names-actions { display:flex; gap:8px; }
  .names-actions .apply-btn { flex:1 1 0; }
  .file-btn { flex:1 1 0; display:inline-flex; align-items:center;
    justify-content:center; padding:8px 12px; border-radius:999px;
    cursor:pointer; font-size:12px; font-weight:600;
    color:rgba(220,236,255,.9); background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.22); }
  .file-btn:hover { background:rgba(30,111,208,.3);
    border-color:rgba(30,111,208,.6); }
  .file-btn input { display:none; }
  .apply-btn { padding:8px 18px; border-radius:999px; cursor:pointer;
    font-size:12px; font-weight:700; color:#fff;
    background:rgba(30,111,208,.3); border:1px solid rgba(30,111,208,.65); }
  .apply-btn:hover { background:rgba(30,111,208,.48); }
  .opt { display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    font-size:clamp(10px,.95vw,13px); color:rgba(190,215,255,.75); }

  /* ----- the drum, sized to fill the middle column ----- */
  .roulette { flex:0 0 auto; width:min(74vh,46vw); display:flex;
    flex-direction:column; align-items:center; gap:1.3vh; }
  .drum-wrap { position:relative; width:100%; aspect-ratio:1; }
  .drum-wrap canvas { width:100%; height:100%; display:block;
    filter:drop-shadow(0 14px 40px rgba(3,11,26,.7))
           drop-shadow(0 0 22px rgba(40,120,220,.28)); }
  .drum-glow { position:absolute; inset:-9%; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(70,150,255,.34) 0%,
      rgba(70,150,255,.12) 46%, transparent 70%);
    filter:blur(20px); opacity:.6;
    transition:opacity .7s ease, transform .7s ease; }
  .drum-wrap.is-mixing .drum-glow { opacity:1; transform:scale(1.07); }
  /* the winner's name, ~5x the old size, laid over the dial so the dial
     itself keeps its full size */
  .winner-big { position:absolute; left:50%; top:50%; z-index:4;
    transform:translate(-50%,-50%) scale(.55);
    font-size:clamp(62px,9vw,170px); font-weight:800; line-height:1;
    letter-spacing:.01em; color:#fff; white-space:nowrap; text-align:center;
    text-shadow:0 0 40px rgba(30,136,255,.95), 0 0 110px rgba(30,136,255,.55),
                0 6px 26px rgba(0,0,0,.65);
    opacity:0; pointer-events:none;
    transition:opacity .35s ease, transform .55s cubic-bezier(.2,1.5,.3,1); }
  .wb-dept { margin-top:.12em; font-size:.26em; font-weight:600;
    letter-spacing:.06em; color:rgba(196,224,255,.9);
    text-shadow:0 0 22px rgba(30,136,255,.8), 0 3px 12px rgba(0,0,0,.6); }
  .winner-big::before { content:''; position:absolute; inset:-45% -22%; z-index:-1;
    background:radial-gradient(ellipse at center,
      rgba(2,8,20,.74) 0%, rgba(2,8,20,.45) 45%, transparent 72%); }
  .drum-wrap.show-name .winner-big { opacity:1;
    transform:translate(-50%,-50%) scale(1); }

  /* 축포 - two cannons firing from the lower corners */
  .confetti { position:fixed; inset:0; z-index:140; pointer-events:none;
    overflow:hidden; }
  .confetti i { position:absolute; display:block; border-radius:2px;
    will-change:transform, opacity;
    animation:shoot var(--dur) cubic-bezier(.16,.68,.36,1) forwards; }
  @keyframes shoot {
    0%   { transform:translate3d(0,0,0) rotate(0deg); opacity:1; }
    45%  { transform:translate3d(calc(var(--dx) * .6), var(--dy), 0)
                     rotate(calc(var(--rot) * .5)); opacity:1; }
    100% { transform:translate3d(var(--dx), 62vh, 0) rotate(var(--rot));
           opacity:0; }
  }

  .spin-btn { padding:12px 36px; border-radius:999px; cursor:pointer;
    font-size:clamp(14px,1.3vw,20px); font-weight:700; color:#fff;
    background:rgba(30,111,208,.3); border:1px solid rgba(30,111,208,.7);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    box-shadow:0 6px 26px rgba(3,11,26,.45), 0 0 24px 1px var(--accent-glow);
    transition:transform .25s ease, background .25s ease, box-shadow .25s ease; }
  .spin-btn:hover:not([disabled]) { transform:translateY(-2px);
    background:rgba(30,111,208,.45); box-shadow:0 10px 32px rgba(30,111,208,.5); }
  .spin-btn[disabled] { opacity:.45; cursor:default; }
  .winner { min-height:1.4em; font-size:clamp(18px,2.2vw,34px); font-weight:800;
    letter-spacing:.02em; color:rgba(214,232,255,.75); }
  .winner b { color:#fff; text-shadow:0 0 26px rgba(30,136,255,.85),
    0 0 60px rgba(30,136,255,.4); }

  /* ----- winners, materialising in ----- */
  .winners-list { list-style:none; margin:0; padding:0; overflow-y:auto;
    flex:1 1 auto; min-height:24vh;
    display:flex; flex-direction:column; gap:10px; text-align:left; }
  .winners-list li { position:relative; display:flex; align-items:center; gap:14px;
    padding:15px 18px; border-radius:15px; background:rgba(30,111,208,.18);
    border:1px solid rgba(30,111,208,.42);
    font-size:clamp(18px,1.65vw,32px); font-weight:600; }
  .winners-list li .w-text { flex:1 1 auto; min-width:0; display:flex;
    flex-direction:column; gap:1px; }
  .winners-list li .w-name { font-weight:700; line-height:1.25;
    white-space:normal; overflow-wrap:anywhere; }
  .winners-list li .w-dept { font-size:.72em; font-weight:500; line-height:1.3;
    color:rgba(180,215,255,.76); white-space:normal; overflow-wrap:anywhere; }
  .winners-list li .no { flex:0 0 auto; width:1.35em; height:1.35em;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:.62em; font-weight:700; background:rgba(255,255,255,.16); }
  /* teleport: a flat beam of light that stretches open and settles */
  .winners-list li.teleport { animation:teleportIn .9s cubic-bezier(.2,.8,.2,1); }
  @keyframes teleportIn {
    0%   { opacity:0; transform:scaleY(.05) scaleX(1.3);
           filter:brightness(3.2) blur(3px);
           box-shadow:0 0 28px 9px rgba(150,205,255,.95); }
    18%  { opacity:1; transform:scaleY(.1) scaleX(1.16);
           filter:brightness(2.8) blur(1.8px); }
    34%  { transform:scaleY(1.2) scaleX(.95);
           filter:brightness(2) blur(.7px);
           box-shadow:0 0 22px 6px rgba(150,205,255,.8); }
    48%  { opacity:.45; transform:scaleY(.88) scaleX(1.04);
           filter:brightness(2.4) blur(1.1px); }
    62%  { opacity:1; transform:scaleY(1.08) scaleX(.99);
           filter:brightness(1.4) blur(0); }
    76%  { opacity:.75; transform:scaleY(.97); }
    100% { opacity:1; transform:none; filter:none;
           box-shadow:0 0 0 0 rgba(150,205,255,0); }
  }
  .winners-list li.teleport::after { content:''; position:absolute;
    left:0; right:0; top:50%; height:2px; pointer-events:none; opacity:0;
    background:linear-gradient(90deg, transparent, #EAF4FF, transparent);
    box-shadow:0 0 16px 5px rgba(150,205,255,.9);
    animation:teleBeam .9s ease-out; }
  @keyframes teleBeam { 0%{transform:scaleX(.15); opacity:1;}
    55%{opacity:.8;} 100%{transform:scaleX(1); opacity:0;} }
  .winners-empty { font-size:clamp(14px,1.4vw,21px); color:rgba(190,215,255,.4);
    padding:4px 2px; }
  .reset-btn { padding:12px 22px; border-radius:999px; cursor:pointer;
    font-size:clamp(13px,1.3vw,19px); font-weight:600;
    color:rgba(220,236,255,.9);
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.22);
    transition:background .25s ease, border-color .25s ease, color .25s ease; }
  .reset-btn:hover { background:rgba(214,64,64,.28);
    border-color:rgba(214,64,64,.6); color:#fff; }

  @media (max-width:1100px) {
    .draw-layout { flex-wrap:wrap; }
    .draw-side { flex:1 1 100%; justify-content:center; }
    .roster-card, .winners-panel { width:min(46vw,340px); max-width:none;
      max-height:34vh; }
    .roulette { flex:1 1 100%; order:-1; width:auto; }
    .drum-wrap { width:min(46vh,86vw); }
    .winners-list { min-height:14vh; }
  }

  /* ===== Content panel (내용 페이지) ===== */
  .content-panel { width:min(88vw,1120px); min-height:46vh; margin-top:1vh;
    border-radius:20px; background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    box-shadow:0 10px 40px rgba(3,11,26,.4);
    display:flex; align-items:center; justify-content:center; padding:4vh 4vw; }
  .placeholder-note { font-size:clamp(13px,1.15vw,17px);
    color:rgba(190,215,255,.42); letter-spacing:.06em; }

  /* ===== Embedded page (사내 깃헙 페이지 임베드) ===== */
  /* Full-bleed: the embedded page fills the whole browser window */
  .slide--embed { padding:0; }
  .embed-wrap { width:100%; height:100%; margin:0; border:0; border-radius:0;
    overflow:hidden; box-shadow:none; background:#fff; }
  .embed-wrap iframe { width:100%; height:100%; border:0; display:block; }
  /* small, unobtrusive escape hatch pinned to the corner */
  .embed-open { position:absolute; top:14px; right:14px; z-index:5;
    padding:7px 15px; border-radius:999px; text-decoration:none;
    font-size:12px; font-weight:600; color:#fff;
    background:rgba(4,20,46,.6); border:1px solid rgba(255,255,255,.22);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    opacity:.3; transition:opacity .3s ease, background .3s ease; }
  .embed-open:hover { opacity:1; background:rgba(30,111,208,.55); }
  /* drop the cinematic vignette while a full-bleed page is on screen */
  .vignette { transition:opacity .45s ease; }
  body.embed-mode .vignette { opacity:0; }

  /* ===== Link button (사내 깃헙 연결) ===== */
  .link-btn { display:inline-flex; align-items:center; gap:12px; margin-top:4vh;
    padding:15px 32px; border-radius:999px; text-decoration:none;
    font-size:clamp(14px,1.35vw,20px); font-weight:600; color:#fff;
    background:rgba(30,111,208,.22); border:1px solid rgba(30,111,208,.55);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    box-shadow:0 6px 26px rgba(3,11,26,.4), 0 0 22px 1px var(--accent-glow);
    transition:transform .3s ease, background .3s ease, box-shadow .3s ease; }
  .link-btn:hover { transform:translateY(-3px); background:rgba(30,111,208,.36);
    box-shadow:0 10px 34px rgba(30,111,208,.45); }
  .link-btn .ext { font-size:1.1em; color:var(--accent-soft); }
  .link-btn--sm { margin-top:2vh; padding:10px 22px;
    font-size:clamp(12px,1.05vw,15px); }
  .link-note { margin-top:1.8vh; font-size:clamp(11px,.95vw,14px);
    color:rgba(190,215,255,.55); letter-spacing:.04em; }

  /* ===== Progress bar ===== */
  .progress { position:fixed; top:0; left:0; height:3px; width:0%; z-index:200;
    background:linear-gradient(90deg,var(--deep-blue),var(--bright-blue));
    box-shadow:0 0 12px 1px var(--accent-glow); transition:width .5s ease; }

  /* ===== Dot navigation ===== */
  /* prev + dots + next share one bar pinned to the bottom */
  .controls { position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    z-index:130; display:flex; align-items:center; gap:22px; }
  .nav-dots { display:flex; flex-direction:row; align-items:center; gap:14px; }
  .nav-dot { width:11px; height:11px; border-radius:50%;
    background:rgba(4,20,46,.38);
    border:1.5px solid rgba(255,255,255,.92); cursor:pointer; padding:0;
    position:relative; transition:all .35s ease;
    /* dual-tone ring: the white edge reads on dark slides, the dark halo
       around it reads on white pages such as the embedded MI deck */
    box-shadow:0 0 0 1.5px rgba(0,10,26,.55), 0 1px 4px rgba(0,0,0,.35); }
  .nav-dot--sub { width:7px; height:7px; }
  .nav-dot:hover { background:rgba(30,111,208,.65); border-color:#fff; }
  .nav-dot.active { background:var(--bright-blue); border-color:#fff;
    transform:scale(1.4);
    box-shadow:0 0 0 1.5px rgba(0,10,26,.6), 0 0 12px 2px var(--accent-glow); }

  <script>
    // ----- Floating particles (generated once on the fixed backdrop) -----
    (function () {
      var container = document.getElementById('particles');
      // Scale particle count with viewport area so large monitors aren't sparse.
      var COUNT = Math.min(180, Math.max(70,
        Math.round(window.innerWidth * window.innerHeight / 16000)));
      var frag = document.createDocumentFragment();
      for (var i = 0; i < COUNT; i++) {
        var p = document.createElement('span');
        p.className = 'particle';
        var size = Math.random() * 3.5 + 2,
            floatDur = Math.random() * 18 + 14,
            twDur = Math.random() * 3 + 2.5;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = (Math.random() * 100) + 'vw';
        p.style.top = (Math.random() * 100) + 'vh';
        p.style.animationDuration = floatDur + 's, ' + twDur + 's';
        p.style.animationDelay = (-Math.random() * floatDur) + 's, ' + (-Math.random() * twDur) + 's';
        frag.appendChild(p);
      }
      container.appendChild(frag);
    })();

    var track   = document.getElementById('track');
    var slides  = Array.prototype.slice.call(document.querySelectorAll('.slide'));
    var dots    = Array.prototype.slice.call(document.querySelectorAll('.nav-dot'));
    var progress = document.getElementById('progress');
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    var TOTAL   = slides.length;
    var current = 0;
    var revealTimer = null;

    // ----- Render current carousel position -----
    function render() {
      track.style.transform = 'translate3d(' + (-current * 100) + '%,0,0)';
      dots.forEach(function (d, i) { d.classList.toggle('active', i === current); });
      progress.style.width = ((current + 1) / TOTAL * 100) + '%';
      prevBtn.disabled = (current === 0);
      nextBtn.disabled = (current === TOTAL - 1);

      // a full-bleed embed gets the whole frame: drop the vignette
      document.body.classList.toggle('embed-mode',
        slides[current].classList.contains('slide--embed'));

      // Cinematic depth: the focused slide sits forward, sharp and lit;
      // its neighbours fall back — smaller, dimmer, out of focus, tilted away.
      slides.forEach(function (sl, i) {
        var off = i - current, a = Math.abs(off);
        if (a === 0) {
          sl.style.transform = 'scale(1) rotateY(0deg)';
          sl.style.opacity = '1';
          sl.style.filter = 'none';
        } else if (a === 1) {
          sl.style.transform = 'scale(.86) rotateY(' + (off > 0 ? -12 : 12) + 'deg)';
          sl.style.opacity = '.3';
          sl.style.filter = 'blur(6px)';
        } else {
          // far slides: no blur filter, keeps the GPU cost down
          sl.style.transform = 'scale(.8)';
          sl.style.opacity = '0';
          sl.style.filter = 'none';
        }
      });

      // play the entrance animation on the slide we landed on
      slides[current].classList.add('in-view');
      // clear the others only after the slide finishes moving, so the
      // outgoing slide doesn't blank out mid-transition
      clearTimeout(revealTimer);
      revealTimer = setTimeout(function () {
        slides.forEach(function (sl, i) {
          if (i !== current) sl.classList.remove('in-view');
        });
      }, 700);
    }

    function goTo(i) {
      i = Math.max(0, Math.min(TOTAL - 1, i));
      if (i === current) return;
      current = i;
      // ----- Titles: as large as they can be on one line -----
    // Measured rather than guessed: the size that fits depends on the font
    // actually in use (SamsungOne vs a fallback) and on the viewport.
    (function () {
      var titles = Array.prototype.slice.call(document.querySelectorAll('.headline'));
      if (!titles.length) return;

      function fitTitles() {
        titles.forEach(function (h) {
          h.style.fontSize = '100px';            // measure at a known size
          var avail = h.clientWidth;             // block width = slide content
          var need = h.scrollWidth;              // full text width, unwrapped
          if (!avail || !need) return;
          // width scales linearly with font-size, so one ratio lands it
          var size = 100 * (avail * 0.98) / need;
          size = Math.max(28, Math.min(size, 280));
          h.style.fontSize = size.toFixed(1) + 'px';
        });
      }

      fitTitles();
      // remeasure once the real font is in use, and on any resize
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(fitTitles).catch(function () {});
      }
      var t = null;
      window.addEventListener('resize', function () {
        clearTimeout(t);
        t = setTimeout(fitTitles, 150);
      });
    })();

    }
    function next() { goTo(current + 1); }
    function prev() { goTo(current - 1); }

    // Placeholder GitHub links: do nothing until a real URL is filled in
    document.querySelectorAll('a[data-needs-url]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        if (a.getAttribute('href') === '#') e.preventDefault();
      });
    });

    prevBtn.addEventListener('click', prev);
    nextBtn.addEventListener('click', next);
    dots.forEach(function (d, i) {
      d.addEventListener('click', function () { goTo(i); });
    });

    // ----- Keyboard -----
    window.addEventListener('keydown', function (e) {
      if (e.defaultPrevented) return;
      // never steal keys while someone is typing in the name list
      var tg = e.target;
      if (tg && /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)) return;
      var dr = document.getElementById('rosterDrawer');
      if (dr && dr.classList.contains('open')) return;
      if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].indexOf(e.key) !== -1) {
        e.preventDefault(); next();
      } else if (['ArrowLeft', 'ArrowUp', 'PageUp'].indexOf(e.key) !== -1) {
        e.preventDefault(); prev();
      } else if (e.key === 'Home') {
        e.preventDefault(); goTo(0);
      } else if (e.key === 'End') {
        e.preventDefault(); goTo(TOTAL - 1);
      }
    });

    // ----- Wheel / trackpad (throttled so one gesture = one slide) -----
    var wheelLock = false;
    window.addEventListener('wheel', function (e) {
      var d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
      if (Math.abs(d) < 12 || wheelLock) return;
      wheelLock = true;
      setTimeout(function () { wheelLock = false; }, 700);
      if (d > 0) next(); else prev();
    }, { passive: true });

    // ----- Touch swipe -----
    var tX = 0, tY = 0;
    window.addEventListener('touchstart', function (e) {
      tX = e.touches[0].clientX; tY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchend', function (e) {
      var dx = e.changedTouches[0].clientX - tX;
      var dy = e.changedTouches[0].clientY - tY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) next(); else prev();
      }
    }, { passive: true });

    // ----- Lucky Draw: ball drum, roster, winners -----
    // Physics is hand-rolled rather than pulled from a CDN: this deck runs on
    // a corporate network that blocks most outside hosts, and a blocked script
    // would leave the draw dead on stage. Circles bouncing inside a circle is
    // a short bit of maths, so the file stays self-contained.
    (function () {
      var cv = document.getElementById('drum');
      if (!cv) return;
      var ctx = cv.getContext('2d');
      var spinBtn   = document.getElementById('spinBtn');
      var winnerEl  = document.getElementById('winner');
      var namesBox  = document.getElementById('namesBox');
      var applyBtn  = document.getElementById('applyNames');
      var fileEl    = document.getElementById('rosterFile');
      var nameColEl = document.getElementById('nameCol');
      var deptColEl = document.getElementById('deptCol');
      var removeChk = document.getElementById('removeWinner');
      var listEl    = document.getElementById('winnersList');
      var countEl   = document.getElementById('winCount');
      var resetBtn  = document.getElementById('resetBtn');
      var wrap      = document.getElementById('drumWrap');
      var wbName    = document.getElementById('wbName');
      var wbDept    = document.getElementById('wbDept');
      var confettiEl = document.getElementById('confetti');
      var rcRemain  = document.getElementById('rcRemain');
      var rcTotal   = document.getElementById('rcTotal');
      var rcBar     = document.getElementById('rcBar');
      var rcMeta    = document.getElementById('rcMeta');
      var rcDept    = document.getElementById('rcDept');
      var drawer    = document.getElementById('rosterDrawer');
      var openBtn   = document.getElementById('openRoster');

      // The drum can only hold so many readable balls. With a bigger roster we
      // load a random handful, but the draw stays uniform over everyone:
      // sample BALLS entrants at random, then eject one of them at random.
      var BALLS = 30;
      var STORE = 'luckydraw.roster';
      var FONT = '"SamsungOneKoreanOTF","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
      var MIX_MS = 3800, EJECT_MS = 1250;

      var basePool = [
        { n: '참가자 1', d: '기구개발팀' }, { n: '참가자 2', d: '기구개발팀' },
        { n: '참가자 3', d: 'MI파트' },    { n: '참가자 4', d: 'MI파트' },
        { n: '참가자 5', d: '설계파트' },  { n: '참가자 6', d: '설계파트' },
        { n: '참가자 7', d: '선행개발' },  { n: '참가자 8', d: '선행개발' }
      ];
      var pool = basePool.slice();
      var display = [];          // entrants currently loaded as balls
      var winners = [];
      var balls = [];
      var phase = 'idle';        // idle | mixing | eject | won
      var phaseT = 0, pendingIdx = -1, ejected = null;
      var S = 0, cx = 0, cy = 0, R = 0, BR = 0, gateY = 0, trayY = 0, chuteW = 0;

      var PALETTE = [
        ['#8FCBFF', '#1E6FD0'], ['#9BE7EE', '#1B7E8C'], ['#BDB2FF', '#4A56B8'],
        ['#FFD98A', '#C98F27'], ['#FFB3C7', '#C1466F'], ['#A8F0C0', '#2A8F5C']
      ];

      // ---------- geometry ----------
      function layout() {
        var box = cv.getBoundingClientRect();
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        S = Math.max(240, Math.round(Math.min(box.width, box.height)));
        cv.width = Math.round(S * dpr);
        cv.height = Math.round(S * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cx = S / 2; cy = S * 0.425; R = S * 0.375;
        BR = R * 0.118;
        gateY = cy + R;
        trayY = S * 0.93;
        chuteW = BR * 2.6;
      }

      // ---------- roster parsing ----------
      var rawRows = [], nameCol = 0, deptCol = 1, hasHeader = false;
      var NAME_HDR = /^(이름|성명|성함|사원명|직원명|name)$/i;
      var DEPT_HDR = /^(부서|부서명|팀|팀명|소속|소속부서|조직|관할조직|파트|department|dept|division|org|organization)$/i;

      function parseRows(text) {
        var t = String(text);
        if (t.charCodeAt(0) === 65279) t = t.slice(1);
        var rows = [];
        t.split(/\r?\n/).forEach(function (ln) {
          if (!ln.trim()) return;
          rows.push(ln.split(/[,\t;]/).map(function (c) {
            return c.trim().replace(/^"|"$/g, '');
          }));
        });
        return rows;
      }

      function detectCols(rows) {
        var cols = 1;
        rows.forEach(function (r) { if (r.length > cols) cols = r.length; });
        var dflt = cols < 2 ? -1 : 1;
        if (!rows.length) return { name: 0, dept: dflt, header: false };
        var hn = -1, hd = -1;
        rows[0].forEach(function (c, i) {
          if (hn < 0 && NAME_HDR.test(c)) hn = i;
          if (hd < 0 && DEPT_HDR.test(c)) hd = i;
        });
        if (hn >= 0 || hd >= 0) {
          if (hn < 0) hn = (hd === 0) ? Math.min(1, cols - 1) : 0;
          if (hd < 0) hd = (hn === 0) ? dflt : 0;
          return { name: hn, dept: hd, header: true };
        }
        var idish = 0, seen0 = 0;
        rows.forEach(function (r) {
          var v = (r[0] || '').trim();
          if (!v) return;
          seen0++;
          if (/^[0-9][0-9\-\s]*$/.test(v)) idish++;
        });
        if (!seen0 || idish / seen0 < 0.5) return { name: 0, dept: dflt, header: false };
        var nS = [], dS = [];
        for (var c = 0; c < cols; c++) {
          var person = 0, deptish = 0, numeric = 0, seen = 0;
          rows.forEach(function (r) {
            var v = (r[c] || '').trim();
            if (!v) return;
            seen++;
            if (/^[가-힣]{2,4}$/.test(v)) person++;
            if (/(팀|파트|그룹|실|센터|본부|담당|과|사업부|개발|연구소)$/.test(v)) deptish++;
            if (/^[0-9][0-9\-\s]*$/.test(v)) numeric++;
          });
          nS[c] = seen ? (person - deptish - numeric * 2) / seen : -9;
          dS[c] = seen ? (deptish - numeric * 2) / seen : -9;
        }
        var nIdx = 0;
        for (var i2 = 1; i2 < cols; i2++) if (nS[i2] > nS[nIdx]) nIdx = i2;
        var dIdx = -1;
        for (var i3 = 0; i3 < cols; i3++) {
          if (i3 === nIdx) continue;
          if (dIdx < 0 || dS[i3] > dS[dIdx]) dIdx = i3;
        }
        return { name: nIdx, dept: dIdx, header: false };
      }

      function fillColSelects(cols) {
        [[nameColEl, nameCol, false], [deptColEl, deptCol, true]].forEach(function (t) {
          var el = t[0];
          if (!el) return;
          el.innerHTML = '';
          if (t[2]) {
            var none = document.createElement('option');
            none.value = '-1'; none.textContent = '없음';
            el.appendChild(none);
          }
          for (var c = 0; c < cols; c++) {
            var o = document.createElement('option');
            o.value = String(c); o.textContent = (c + 1) + '열';
            el.appendChild(o);
          }
          el.value = String(t[1]);
        });
      }

      function rowsToPool() {
        var out = [];
        rawRows.forEach(function (r, i) {
          if (hasHeader && i === 0) return;
          var n = (r[nameCol] || '').trim();
          var d = deptCol >= 0 ? (r[deptCol] || '').trim() : '';
          if (n) out.push({ n: n, d: d });
        });
        return out;
      }

      // ---------- load the drum ----------
      function prepareRound() {
        display = [];
        var want = Math.min(BALLS, pool.length);
        if (pool.length <= want) {
          for (var i = 0; i < pool.length; i++)
            display.push({ n: pool[i].n, d: pool[i].d, idx: i });
        } else {
          var taken = {}, got = 0;
          while (got < want) {
            var r = Math.floor(Math.random() * pool.length);
            if (taken[r]) continue;
            taken[r] = 1; got++;
            display.push({ n: pool[r].n, d: pool[r].d, idx: r });
          }
        }
        spawnBalls();
        updateCard();
      }

      function spawnBalls() {
        balls = [];
        ejected = null;
        display.forEach(function (e, i) {
          var a = Math.random() * Math.PI * 2;
          var rad = Math.random() * (R - BR * 1.4);
          var c = PALETTE[i % PALETTE.length];
          balls.push({
            x: cx + Math.cos(a) * rad, y: cy + Math.sin(a) * rad,
            vx: (Math.random() - 0.5) * S * 0.5,
            vy: (Math.random() - 0.5) * S * 0.5,
            r: BR, c1: c[0], c2: c[1], label: e.n, seg: i
          });
        });
      }

      // ---------- physics ----------
      // Constraints are relaxed in passes and the wall is always enforced
      // last. Resolving ball-ball overlap can shove a ball through the glass,
      // so a single wall pass before the collisions let them escape.
      function clampWall() {
        for (var i = 0; i < balls.length; i++) {
          var q = balls[i];
          if (q === ejected) continue;
          var dx = q.x - cx, dy = q.y - cy;
          var d = Math.hypot(dx, dy) || 1;
          var lim = R - q.r;
          if (d > lim) {
            var nx = dx / d, ny = dy / d;
            q.x = cx + nx * lim; q.y = cy + ny * lim;
            var vn = q.vx * nx + q.vy * ny;
            if (vn > 0) { q.vx -= 1.72 * vn * nx; q.vy -= 1.72 * vn * ny; }
          }
        }
      }

      function resolvePairs() {
        for (var i = 0; i < balls.length; i++) {
          var a1 = balls[i];
          if (a1 === ejected) continue;
          for (var j = i + 1; j < balls.length; j++) {
            var a2 = balls[j];
            if (a2 === ejected) continue;
            var ddx = a2.x - a1.x, ddy = a2.y - a1.y;
            var dd = Math.hypot(ddx, ddy);
            var mind = a1.r + a2.r;
            if (dd >= mind) continue;
            if (dd < 0.0001) { ddx = (Math.random() - 0.5); ddy = -1; dd = 1; }
            var ux = ddx / dd, uy = ddy / dd, push = (mind - dd) / 2;
            a1.x -= ux * push; a1.y -= uy * push;
            a2.x += ux * push; a2.y += uy * push;
            var rv = (a2.vx - a1.vx) * ux + (a2.vy - a1.vy) * uy;
            if (rv < 0) {
              var imp = -1.72 * rv / 2;
              a1.vx -= imp * ux; a1.vy -= imp * uy;
              a2.vx += imp * ux; a2.vy += imp * uy;
            }
          }
        }
      }

      function step(dt) {
        var mixing = (phase === 'mixing');
        var G = S * 1.5;
        var AG = mixing ? S * 7 : S * 0.7;     // random buffeting
        var SW = mixing ? S * 2.6 : 0;         // swirl, like the blower
        var DAMP = mixing ? 0.997 : 0.988;
        var VMAX = S * 2.2;                    // keeps a ball from tunnelling

        for (var i = 0; i < balls.length; i++) {
          var b = balls[i];
          if (b === ejected) continue;
          b.vy += G * dt;
          b.vx += (Math.random() - 0.5) * AG * dt;
          b.vy += (Math.random() - 0.5) * AG * dt;
          if (SW) {
            var ox = b.x - cx, oy = b.y - cy;
            var m = Math.hypot(ox, oy) || 1;
            b.vx += (-oy / m) * SW * dt;
            b.vy += (ox / m) * SW * dt;
          }
          b.vx *= DAMP; b.vy *= DAMP;
          var sp = Math.hypot(b.vx, b.vy);
          if (sp > VMAX) { b.vx = b.vx / sp * VMAX; b.vy = b.vy / sp * VMAX; }
          b.x += b.vx * dt; b.y += b.vy * dt;
        }

        for (var it = 0; it < 3; it++) { resolvePairs(); clampWall(); }
      }

      // ---------- drawing ----------
      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function drawBall(b, glow) {
        var g = ctx.createRadialGradient(
          b.x - b.r * 0.38, b.y - b.r * 0.42, b.r * 0.08, b.x, b.y, b.r);
        g.addColorStop(0, b.c1); g.addColorStop(1, b.c2);
        if (glow) { ctx.shadowColor = 'rgba(255,240,180,.95)'; ctx.shadowBlur = b.r * 1.6; }
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.2832);
        ctx.fillStyle = g; ctx.fill();
        ctx.shadowBlur = 0;
        ctx.lineWidth = Math.max(1, b.r * 0.06);
        ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.stroke();
        // printed label disc
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.64, 0, 6.2832);
        ctx.fillStyle = 'rgba(255,255,255,.94)'; ctx.fill();
        var fs = b.r * 0.46, txt = b.label;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '700 ' + fs.toFixed(1) + 'px ' + FONT;
        var guard = 0;
        while (ctx.measureText(txt).width > b.r * 1.12 && fs > 5 && guard++ < 30) {
          fs -= 0.6;
          ctx.font = '700 ' + fs.toFixed(1) + 'px ' + FONT;
        }
        ctx.fillStyle = '#0A2440';
        ctx.fillText(txt, b.x, b.y);
      }

      function render() {
        ctx.clearRect(0, 0, S, S);

        // exit chute, behind the drum
        var cwl = cx - chuteW / 2;
        roundRect(cwl, gateY - R * 0.05, chuteW, trayY - gateY + R * 0.1, chuteW * 0.3);
        ctx.fillStyle = 'rgba(12,34,70,.55)'; ctx.fill();
        ctx.lineWidth = Math.max(1, S * 0.004);
        ctx.strokeStyle = 'rgba(160,205,255,.32)'; ctx.stroke();

        // tray
        roundRect(cx - chuteW * 0.92, trayY - chuteW * 0.16, chuteW * 1.84,
                  chuteW * 0.52, chuteW * 0.22);
        ctx.fillStyle = 'rgba(10,30,62,.7)'; ctx.fill();
        ctx.strokeStyle = 'rgba(160,205,255,.3)'; ctx.stroke();

        // glass body
        var bg = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.08, cx, cy, R);
        bg.addColorStop(0, 'rgba(130,185,255,.12)');
        bg.addColorStop(0.65, 'rgba(24,64,124,.16)');
        bg.addColorStop(1, 'rgba(6,20,45,.34)');
        ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832);
        ctx.fillStyle = bg; ctx.fill();

        // balls, clipped inside the glass
        ctx.save();
        ctx.beginPath(); ctx.arc(cx, cy, R - 1, 0, 6.2832); ctx.clip();
        balls.forEach(function (b) { if (b !== ejected) drawBall(b, false); });
        ctx.restore();

        // the drawn ball rides the chute outside the glass
        if (ejected) drawBall(ejected, true);

        // rim
        ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832);
        ctx.lineWidth = R * 0.035;
        ctx.strokeStyle = 'rgba(185,222,255,.5)';
        ctx.shadowColor = 'rgba(60,140,255,.85)'; ctx.shadowBlur = R * 0.13;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // specular sweep and a soft inner edge
        ctx.beginPath();
        ctx.arc(cx, cy, R * 0.9, Math.PI * 1.06, Math.PI * 1.48);
        ctx.lineWidth = R * 0.055;
        ctx.strokeStyle = 'rgba(255,255,255,.2)';
        ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, R * 0.965, 0, 6.2832);
        ctx.lineWidth = R * 0.02;
        ctx.strokeStyle = 'rgba(255,255,255,.08)';
        ctx.stroke();

        // gate mouth
        ctx.beginPath();
        ctx.moveTo(cwl, gateY - R * 0.02); ctx.lineTo(cx + chuteW / 2, gateY - R * 0.02);
        ctx.lineWidth = Math.max(1, S * 0.006);
        ctx.strokeStyle = phase === 'eject' ? 'rgba(255,225,150,.9)' : 'rgba(160,205,255,.35)';
        ctx.stroke();
      }

      // ---------- loop ----------
      var last = 0;
      function frame(t) {
        if (!last) last = t;
        var dt = Math.min((t - last) / 1000, 0.033);
        last = t;

        if (phase === 'mixing') {
          phaseT += dt * 1000;
          if (phaseT >= MIX_MS) beginEject();
        } else if (phase === 'eject' && ejected) {
          phaseT += dt * 1000;
          var k = Math.min(phaseT / EJECT_MS, 1);
          var e = k < 0.5
            ? (k / 0.5) * 0.5                                  // drift to the gate
            : 0.5 + Math.pow((k - 0.5) / 0.5, 1.7) * 0.5;      // then drop away
          ejected.x = ejected.sx + (cx - ejected.sx) * Math.min(1, e * 2);
          ejected.y = ejected.sy + (trayY - ejected.sy) * e;
          if (k >= 1) finishDraw();
        }

        step(dt);
        render();
        requestAnimationFrame(frame);
      }

      // ---------- draw lifecycle ----------
      function startDraw() {
        if (phase === 'mixing' || phase === 'eject') return;
        if (needsResample) resample();
        if (!pool.length || !display.length) {
          winnerEl.innerHTML = '명단이 비었습니다 · 초기화를 눌러 주세요';
          return;
        }
        phase = 'mixing'; phaseT = 0;
        pendingIdx = Math.floor(Math.random() * display.length);
        spinBtn.disabled = true;
        wrap.classList.remove('show-name');
        wrap.classList.add('is-mixing');
        winnerEl.innerHTML = '추첨 중…';
        balls.forEach(function (b) {          // kick everything into motion
          b.vx += (Math.random() - 0.5) * S * 2.2;
          b.vy += (Math.random() - 0.5) * S * 2.2;
        });
      }

      function beginEject() {
        var b = balls[pendingIdx];
        if (!b) { finishDraw(); return; }
        ejected = b;
        b.sx = b.x; b.sy = b.y;
        phase = 'eject'; phaseT = 0;
        wrap.classList.remove('is-mixing');
      }

      function finishDraw() {
        var won = display[pendingIdx];
        phase = 'won';
        spinBtn.disabled = false;
        if (!won) { winnerEl.innerHTML = ''; needsResample = true; return; }
        wbName.textContent = won.n;
        wbDept.textContent = won.d || '';
        wrap.classList.add('show-name');
        fireConfetti();
        winnerEl.innerHTML = '축하합니다';
        winners.push({ n: won.n, d: won.d });
        renderWinners(true);
        if (removeChk.checked) pool.splice(won.idx, 1);
        updateCard();
        needsResample = true;
        roundTimer = setTimeout(resample, 1600);
      }

      var needsResample = false, roundTimer = null;
      function resample() {
        clearTimeout(roundTimer); roundTimer = null;
        phase = 'idle';
        prepareRound();
        needsResample = false;
      }

      // ---------- winners ----------
      function renderWinners(teleportLast) {
        countEl.textContent = winners.length;
        listEl.innerHTML = '';
        if (!winners.length) {
          var e = document.createElement('div');
          e.className = 'winners-empty';
          e.textContent = '아직 당첨자가 없습니다';
          listEl.appendChild(e);
          return;
        }
        winners.forEach(function (w, i) {
          var li = document.createElement('li');
          if (teleportLast && i === winners.length - 1) li.className = 'teleport';
          var no = document.createElement('span');
          no.className = 'no'; no.textContent = i + 1;
          li.appendChild(no);
          var tw = document.createElement('span');
          tw.className = 'w-text';
          var nm = document.createElement('span');
          nm.className = 'w-name'; nm.textContent = w.n;
          tw.appendChild(nm);
          if (w.d) {
            var dp = document.createElement('span');
            dp.className = 'w-dept'; dp.textContent = w.d;
            tw.appendChild(dp);
          }
          li.appendChild(tw);
          listEl.appendChild(li);
        });
        listEl.scrollTop = listEl.scrollHeight;
      }

      function updateCard() {
        var total = basePool.length, left = pool.length, drawn = total - left;
        if (rcRemain) rcRemain.textContent = left;
        if (rcTotal) rcTotal.textContent = total;
        if (rcBar) rcBar.style.width = total ? (drawn / total * 100).toFixed(1) + '%' : '0%';
        if (rcMeta) rcMeta.textContent = '추첨 ' + drawn + '명 완료';
        if (rcDept) {
          var seen = {}, n = 0;
          basePool.forEach(function (e) {
            if (e.d && !seen[e.d]) { seen[e.d] = 1; n++; }
          });
          rcDept.textContent = n ? '· 부서 ' + n + '곳' : '';
        }
      }

      function setDrawer(on) { if (drawer) drawer.classList.toggle('open', on); }

      // ---------- 축포 ----------
      var CONF = ['#EAF4FF','#5FA8FF','#1E6FD0','#7FD8E8','#9B8CFF','#FFD98A'];
      function fireConfetti() {
        var frag = document.createDocumentFragment(), made = [];
        for (var c = 0; c < 2; c++) {
          var fromLeft = (c === 0);
          for (var i = 0; i < 58; i++) {
            var d = document.createElement('i');
            var ang = (38 + Math.random() * 42) * Math.PI / 180;
            var vel = 42 + Math.random() * 48;
            var dx = (fromLeft ? 1 : -1) * Math.cos(ang) * vel;
            var dy = -Math.sin(ang) * vel;
            var w = 6 + Math.random() * 6;
            d.style.width = w.toFixed(1) + 'px';
            d.style.height = (w * (1 + Math.random())).toFixed(1) + 'px';
            d.style.background = CONF[(Math.random() * CONF.length) | 0];
            d.style.bottom = '6vh';
            d.style[fromLeft ? 'left' : 'right'] = '4vw';
            d.style.setProperty('--dx', dx.toFixed(1) + 'vh');
            d.style.setProperty('--dy', dy.toFixed(1) + 'vh');
            d.style.setProperty('--rot', ((Math.random() * 1080) | 0) + 'deg');
            d.style.setProperty('--dur', (1.9 + Math.random() * 1.1).toFixed(2) + 's');
            d.style.animationDelay = (Math.random() * 0.18).toFixed(2) + 's';
            frag.appendChild(d); made.push(d);
          }
        }
        confettiEl.appendChild(frag);
        setTimeout(function () {
          made.forEach(function (d) { if (d.parentNode) d.parentNode.removeChild(d); });
        }, 3400);
      }

      // ---------- reset / roster ----------
      function restore(list) {
        clearTimeout(roundTimer); roundTimer = null;
        phase = 'idle'; phaseT = 0; ejected = null;
        spinBtn.disabled = false;
        wrap.classList.remove('is-mixing');
        wrap.classList.remove('show-name');
        winners = [];
        if (list) basePool = list;
        pool = basePool.slice();
        prepareRound();
        needsResample = false;
        renderWinners();
      }

      function loadRoster(text, redetect) {
        rawRows = parseRows(text);
        var cols = 1;
        rawRows.forEach(function (r) { if (r.length > cols) cols = r.length; });
        if (redetect) {
          var det = detectCols(rawRows);
          nameCol = det.name; deptCol = det.dept; hasHeader = det.header;
        }
        if (nameCol >= cols || nameCol < 0) nameCol = 0;
        if (deptCol >= cols) deptCol = cols < 2 ? -1 : 1;
        fillColSelects(cols);
        return rowsToPool();
      }

      function applyRoster(redetect) {
        var list = loadRoster(namesBox.value, redetect !== false);
        if (list.length < 2) { winnerEl.innerHTML = '두 명 이상 입력해 주세요'; return; }
        restore(list);
        try {
          localStorage.setItem(STORE, JSON.stringify({
            t: namesBox.value, n: nameCol, d: deptCol, h: hasHeader
          }));
        } catch (err) {}
        setDrawer(false);
        var withDept = list.filter(function (e) { return e.d; }).length;
        winnerEl.innerHTML = list.length + '명 등록 · 이름 ' + (nameCol + 1) + '열' +
          (deptCol >= 0 ? ' · 부서 ' + (deptCol + 1) + '열' : '') +
          (withDept ? ' (' + withDept + '명)' : '');
      }

      resetBtn.addEventListener('click', function () {
        restore(null);
        winnerEl.innerHTML = '';
      });
      spinBtn.addEventListener('click', startDraw);
      spinBtn.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); startDraw(); }
      });
      if (openBtn) openBtn.addEventListener('click', function () { setDrawer(true); });
      if (drawer) {
        drawer.querySelectorAll('[data-close]').forEach(function (el) {
          el.addEventListener('click', function () { setDrawer(false); });
        });
      }
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && drawer && drawer.classList.contains('open')) setDrawer(false);
      });
      applyBtn.addEventListener('click', function () { applyRoster(true); });
      [nameColEl, deptColEl].forEach(function (el) {
        if (!el) return;
        el.addEventListener('change', function () {
          nameCol = parseInt(nameColEl.value, 10);
          deptCol = parseInt(deptColEl.value, 10);
          if (isNaN(nameCol)) nameCol = 0;
          if (isNaN(deptCol)) deptCol = -1;
          applyRoster(false);
        });
      });

      if (fileEl) {
        fileEl.addEventListener('change', function () {
          var f = fileEl.files && fileEl.files[0];
          if (!f) return;
          var r = new FileReader();
          r.onload = function () {
            var txt = '';
            try {
              txt = new TextDecoder('utf-8').decode(r.result);
              if (txt.indexOf('�') !== -1) {
                txt = new TextDecoder('euc-kr').decode(r.result);
              }
            } catch (err) {
              try { txt = new TextDecoder('euc-kr').decode(r.result); } catch (e2) {}
            }
            namesBox.value = txt;
            applyRoster(true);
            fileEl.value = '';
          };
          r.readAsArrayBuffer(f);
        });
      }

      var rt = null;
      window.addEventListener('resize', function () {
        clearTimeout(rt);
        rt = setTimeout(function () { layout(); spawnBalls(); }, 150);
      });

      // ---------- init ----------
      var seedText = basePool.map(function (e) { return e.n + ',' + e.d; }).join('\n');
      try {
        var saved = localStorage.getItem(STORE);
        if (saved) {
          var o = JSON.parse(saved);
          if (o && typeof o.t === 'string') {
            seedText = o.t;
            nameCol = o.n | 0; deptCol = o.d | 0; hasHeader = !!o.h;
          }
        }
      } catch (err) {}
      namesBox.value = seedText;
      layout();
      var seeded = loadRoster(seedText, false);
      if (seeded.length >= 2) { basePool = seeded; pool = basePool.slice(); }
      prepareRound();
      renderWinners();
      requestAnimationFrame(frame);
    })();

    render();
  </script>
</body>
</html>
