    </section>

    <!-- Q&A (내용) -->
    <section id="qna-content" class="slide slide--embed">
      <div class="embed-wrap">
        <iframe src="https://pages.github.sec.samsung.net/yonche-lee/team_qna" title="소통이 필요해" allow="fullscreen"></iframe>
      </div>
      <a class="embed-open" href="https://pages.github.sec.samsung.net/yonche-lee/team_qna"
         target="_blank" rel="noopener">새 탭에서 열기 &#8599;</a>
    </section>

    <!-- 마무리 영상: full-bleed, plays when the slide arrives -->
    <section id="closing" class="slide slide--embed slide--video">
      <video id="closingVideo" src="media/closing.mp4" playsinline preload="auto"
             aria-label="마무리 영상"></video>
      <button class="video-play" id="closingPlay" aria-label="재생">
        <span class="video-play__icon">&#9654;</span>
        <span class="video-play__label">재생</span>
      </button>
    </section>
    </div>
  </main>

  <script>
    // ?remote=1 turns this same file into the presenter's remote (a popup
    // opened from the deck), so nothing heavy runs there
    var REMOTE_MODE = /[?&]remote=1/.test(location.search);
    if (REMOTE_MODE) document.documentElement.classList.add('remote-mode');

    // ----- Floating particles (generated once on the fixed backdrop) -----
    (function () {
      if (REMOTE_MODE) return;
      var container = document.getElementById('particles');
      // Scale particle count with viewport area so large monitors aren't sparse.
      var COUNT = Math.min(180, Math.max(70,
        Math.round(window.innerWidth * window.innerHeight / 16000)));
      var frag = document.createDocumentFragment();
      for (var i = 0; i < COUNT; i++) {
        var p = document.createElement('span');
        p.className = 'particle';
        var size = Math.random() * 3.5 + 2,
            floatDur = Math.random() * 18 + 14,
            twDur = Math.random() * 3 + 2.5;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = (Math.random() * 100) + 'vw';
        p.style.top = (Math.random() * 100) + 'vh';
        p.style.animationDuration = floatDur + 's, ' + twDur + 's';
        p.style.animationDelay = (-Math.random() * floatDur) + 's, ' + (-Math.random() * twDur) + 's';
        frag.appendChild(p);
      }
      container.appendChild(frag);
    })();

    var track   = document.getElementById('track');
    var slides  = Array.prototype.slice.call(document.querySelectorAll('.slide'));
    var dots    = Array.prototype.slice.call(document.querySelectorAll('.nav-dot'));
    var progress = document.getElementById('progress');
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    var TOTAL   = slides.length;
    var current = 0;
    var revealTimer = null;

    // ----- Render current carousel position -----
    function render() {
      track.style.transform = 'translate3d(' + (-current * 100) + '%,0,0)';
      dots.forEach(function (d, i) { d.classList.toggle('active', i === current); });
      progress.style.width = ((current + 1) / TOTAL * 100) + '%';
      prevBtn.disabled = (current === 0);
      nextBtn.disabled = (current === TOTAL - 1);

      // a full-bleed embed gets the whole frame: drop the vignette
      document.body.classList.toggle('embed-mode',
        slides[current].classList.contains('slide--embed'));
      // and the draw slide gets the animation budget
      document.body.classList.toggle('drum-focus',
        slides[current].id === 'pinball-content');
      // the closing video plays when its slide arrives and rests when it leaves
      if (typeof closingVideoOn === 'function') closingVideoOn(slides[current].id === 'closing');
      if (typeof raceFullOn === 'function') raceFullOn(slides[current].id === 'pinball-content');
      pushRemote();

      // Cinematic depth: the focused slide sits forward, sharp and lit;
      // its neighbours fall back — smaller, dimmer, out of focus, tilted away.
      slides.forEach(function (sl, i) {
        var off = i - current, a = Math.abs(off);
        if (a === 0) {
          sl.style.transform = 'scale(1) rotateY(0deg)';
          sl.style.opacity = '1';
          sl.style.filter = 'none';
        } else if (a === 1) {
          sl.style.transform = 'scale(.86) rotateY(' + (off > 0 ? -12 : 12) + 'deg)';
          sl.style.opacity = '.3';
          sl.style.filter = 'blur(6px)';
        } else {
          // far slides: no blur filter, keeps the GPU cost down
          sl.style.transform = 'scale(.8)';
          sl.style.opacity = '0';
          sl.style.filter = 'none';
        }
      });

      // play the entrance animation on the slide we landed on
      slides[current].classList.add('in-view');
      // clear the others only after the slide finishes moving, so the
      // outgoing slide doesn't blank out mid-transition
      clearTimeout(revealTimer);
      revealTimer = setTimeout(function () {
        slides.forEach(function (sl, i) {
          if (i !== current) sl.classList.remove('in-view');
        });
      }, 700);
    }

    function goTo(i) {
      i = Math.max(0, Math.min(TOTAL - 1, i));
      if (i === current) return;
      current = i;
      render();
    }
    function next() { goTo(current + 1); }
    function prev() { goTo(current - 1); }

    // Placeholder GitHub links: do nothing until a real URL is filled in
    document.querySelectorAll('a[data-needs-url]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        if (a.getAttribute('href') === '#') e.preventDefault();
      });
    });

    prevBtn.addEventListener('click', prev);
    nextBtn.addEventListener('click', next);
    dots.forEach(function (d, i) {
      d.addEventListener('click', function () { goTo(i); });
    });

    // ----- Presenter remote: a popup of this same page that drives the deck -----
    var remoteWin = null, remoteSeen = 0;
    function remoteState() {
      return { type: 'townhall-state', current: current, total: TOTAL,
               labels: dots.map(function (d) { return { t: d.dataset.label, sub: d.classList.contains('nav-dot--sub') }; }) };
    }
    function pushRemote() {
      if (remoteWin && !remoteWin.closed) { try { remoteWin.postMessage(remoteState(), '*'); } catch (err) {} }
    }
    function openRemote() {
      var url = location.href.split('#')[0].split('?')[0] + '?remote=1';
      remoteWin = window.open(url, 'townhallRemote', 'width=440,height=780,menubar=no,toolbar=no,location=no,status=no');
      if (remoteWin) remoteWin.focus();
    }
    window.addEventListener('message', function (ev) {
      var m = ev.data || {};
      if (m.type !== 'townhall-cmd') return;
      remoteSeen = Date.now();
      if (ev.source) remoteWin = ev.source;
      document.body.classList.add('remote-on');   // the bottom bar steps aside
      if (m.cmd === 'next') next();
      else if (m.cmd === 'prev') prev();
      else if (m.cmd === 'goto') goTo(m.index | 0);
      pushRemote();
    });
    setInterval(function () {
      if (document.body.classList.contains('remote-on') &&
          (Date.now() - remoteSeen > 4500 || !remoteWin || remoteWin.closed)) {
        document.body.classList.remove('remote-on');
      }
    }, 1000);
    var remoteBtn = document.getElementById('remoteBtn');
    if (remoteBtn) remoteBtn.addEventListener('click', openRemote);

    // ----- Keyboard -----
    window.addEventListener('keydown', function (e) {
      if (e.defaultPrevented) return;
      // never steal keys while someone is typing in the name list
      var tg = e.target;
      if (tg && /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)) return;
      var dr = document.getElementById('pbRosterDrawer');
      if (dr && dr.classList.contains('open')) return;
      if (document.fullscreenElement) return;   // a fullscreen race owns the keys
      if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].indexOf(e.key) !== -1) {
        e.preventDefault(); next();
      } else if (['ArrowLeft', 'ArrowUp', 'PageUp'].indexOf(e.key) !== -1) {
        e.preventDefault(); prev();
      } else if (e.key === 'Home') {
        e.preventDefault(); goTo(0);
      } else if (e.key === 'End') {
        e.preventDefault(); goTo(TOTAL - 1);
      } else if (e.key === 'r' || e.key === 'R') {
        e.preventDefault(); openRemote();
      }
    });

    // ----- Wheel / trackpad (throttled so one gesture = one slide) -----
    var wheelLock = false;
    window.addEventListener('wheel', function (e) {
      var d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
      if (Math.abs(d) < 12 || wheelLock) return;
      wheelLock = true;
      setTimeout(function () { wheelLock = false; }, 700);
      if (d > 0) next(); else prev();
    }, { passive: true });

    // ----- Touch swipe -----
    var tX = 0, tY = 0;
    window.addEventListener('touchstart', function (e) {
      tX = e.touches[0].clientX; tY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchend', function (e) {
      var dx = e.changedTouches[0].clientX - tX;
      var dy = e.changedTouches[0].clientY - tY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) next(); else prev();
      }
    }, { passive: true });

    // ----- Titles: as large as they can be on one line -----
    // Measured rather than guessed: the size that fits depends on the font
    // actually in use (SamsungOne vs a fallback) and on the viewport.
    (function () {
      var titles = Array.prototype.slice.call(document.querySelectorAll('.headline'));
      if (!titles.length) return;

      function fitTitles() {
        titles.forEach(function (h) {
          h.style.fontSize = '100px';            // measure at a known size
          var avail = h.clientWidth;             // block width = slide content
          var need = h.scrollWidth;              // full text width, unwrapped
          if (!avail || !need) return;
          // width scales linearly with font-size, so one ratio lands it
          var size = 100 * (avail * 0.98) / need;
          size = Math.max(28, Math.min(size, 280));
          h.style.fontSize = size.toFixed(1) + 'px';
        });
      }

      fitTitles();
      // remeasure once the real font is in use, and on any resize
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(fitTitles).catch(function () {});
      }
      var ft = null;
      window.addEventListener('resize', function () {
        clearTimeout(ft);
        ft = setTimeout(fitTitles, 150);
      });
    })();

    // ----- the remote popup -----
    (function () {
      if (!REMOTE_MODE) return;
      document.title = '리모컨 · 소통 @ 기구개발팀';
      var ui = document.createElement('div');
      ui.className = 'remote-ui';
      ui.innerHTML =
        '<div class="remote-head"><b>소통 @ 기구개발팀</b><span>리모컨 · <span id="rmPos">–</span></span></div>' +
        '<div class="remote-big"><button id="rmPrev">&#8249; 이전</button><button id="rmNext">다음 &#8250;</button></div>' +
        '<ol class="remote-list" id="rmList"></ol>' +
        '<div class="remote-hint" id="rmHint">← → 또는 Space 키로 넘길 수 있습니다. 이 창이 열려 있는 동안 본 화면의 하단 컨트롤은 숨겨집니다.</div>';
      document.body.appendChild(ui);
      var main = window.opener, list = document.getElementById('rmList');
      var pos = document.getElementById('rmPos'), hint = document.getElementById('rmHint');
      var state = null;
      function send(cmd, index) {
        if (!main || main.closed) {
          hint.className = 'remote-hint warn';
          hint.textContent = '본 화면과 연결되지 않았습니다. 본 화면 오른쪽 아래의 리모컨 버튼(또는 R 키)으로 이 창을 열어 주세요.';
          return;
        }
        main.postMessage({ type: 'townhall-cmd', cmd: cmd, index: index }, '*');
      }
      function draw() {
        if (!state) return;
        pos.textContent = (state.current + 1) + ' / ' + state.total;
        list.innerHTML = '';
        state.labels.forEach(function (l, i) {
          var li = document.createElement('li');
          li.className = (l.sub ? 'sub ' : '') + (i === state.current ? 'cur' : '');
          var b = document.createElement('button');
          b.innerHTML = '<span class="n">' + (i + 1) + '</span>';
          b.appendChild(document.createTextNode(l.t));
          b.addEventListener('click', function () { send('goto', i); });
          li.appendChild(b); list.appendChild(li);
        });
        var cur = list.querySelector('.cur');
        if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
      }
      window.addEventListener('message', function (ev) {
        var m = ev.data || {};
        if (m.type !== 'townhall-state') return;
        state = m; draw();
      });
      document.getElementById('rmPrev').addEventListener('click', function () { send('prev'); });
      document.getElementById('rmNext').addEventListener('click', function () { send('next'); });
      document.addEventListener('keydown', function (e) {
        if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].indexOf(e.key) !== -1) { e.preventDefault(); send('next'); }
        else if (['ArrowLeft', 'ArrowUp', 'PageUp'].indexOf(e.key) !== -1) { e.preventDefault(); send('prev'); }
        else if (e.key === 'Home') { e.preventDefault(); send('goto', 0); }
        else if (e.key === 'End' && state) { e.preventDefault(); send('goto', state.total - 1); }
      });
      // a heartbeat keeps the deck's bar hidden while this window lives
      send('hello');
      setInterval(function () { send('hello'); }, 1500);
    })();

    // ----- closing video: plays on arrival, click for fullscreen, rests on leaving -----
    var closingVideoOn = (function () {
      var sec = document.getElementById('closing');
      var v = document.getElementById('closingVideo');
      var btn = document.getElementById('closingPlay');
      if (!sec || !v || !btn) return null;
      function setPlaying(on) { sec.classList.toggle('playing', on); }
      function tryPlay() {
        var p = v.play();
        if (p && p.then) p.then(function () { setPlaying(true); }).catch(function () { setPlaying(false); });
      }
      function goFull() {
        var el = sec;
        var rf = el.requestFullscreen || el.webkitRequestFullscreen;
        if (rf && !document.fullscreenElement) { try { rf.call(el); } catch (e) {} }
      }
      function leaveFull() {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(function () {});
        }
      }
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        tryPlay(); goFull();
      });
      sec.addEventListener('click', function () {
        if (v.paused) { tryPlay(); goFull(); }
        else { v.pause(); setPlaying(false); }
      });
      v.addEventListener('play', function () { setPlaying(true); });
      v.addEventListener('pause', function () { setPlaying(false); });
      v.addEventListener('ended', function () {
        setPlaying(false); leaveFull();
        btn.querySelector('.video-play__label').textContent = '다시 재생';
      });
      return function (active) {
        if (active) { v.currentTime = 0; tryPlay(); }
        else { if (!v.paused) v.pause(); setPlaying(false); leaveFull(); }
      };
    })();

    // ----- shared by both draw games: roster text, ball sprites, confetti -----
    var BALL_FONT = '"SamsungOneKoreanOTF","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
    var NAME_HDR = /^(이름|성명|성함|사원명|직원명|name)$/i;
    var DEPT_HDR = /^(부서|부서명|팀|팀명|소속|소속부서|조직|관할조직|파트|department|dept|division|org|organization)$/i;

    function parseRows(text) {
      var t = String(text);
      if (t.charCodeAt(0) === 65279) t = t.slice(1);
      var rows = [];
      t.split(/\r?\n/).forEach(function (ln) {
        if (!ln.trim()) return;
        rows.push(ln.split(/[,\t;]/).map(function (c) {
          return c.trim().replace(/^"|"$/g, '');
        }));
      });
      return rows;
    }

    function detectCols(rows) {
      var cols = 1;
      rows.forEach(function (r) { if (r.length > cols) cols = r.length; });
      var dflt = cols < 2 ? -1 : 1;
      if (!rows.length) return { name: 0, dept: dflt, header: false };
      var hn = -1, hd = -1;
      rows[0].forEach(function (c, i) {
        if (hn < 0 && NAME_HDR.test(c)) hn = i;
        if (hd < 0 && DEPT_HDR.test(c)) hd = i;
      });
      if (hn >= 0 || hd >= 0) {
        if (hn < 0) hn = (hd === 0) ? Math.min(1, cols - 1) : 0;
        if (hd < 0) hd = (hn === 0) ? dflt : 0;
        return { name: hn, dept: hd, header: true };
      }
      var idish = 0, seen0 = 0;
      rows.forEach(function (r) {
        var v = (r[0] || '').trim();
        if (!v) return;
        seen0++;
        if (/^[0-9][0-9\-\s]*$/.test(v)) idish++;
      });
      if (!seen0 || idish / seen0 < 0.5) return { name: 0, dept: dflt, header: false };
      var nS = [], dS = [];
      for (var c = 0; c < cols; c++) {
        var person = 0, deptish = 0, numeric = 0, seen = 0;
        rows.forEach(function (r) {
          var v = (r[c] || '').trim();
          if (!v) return;
          seen++;
          if (/^[가-힣]{2,4}$/.test(v)) person++;
          if (/(팀|파트|그룹|실|센터|본부|담당|과|사업부|개발|연구소)$/.test(v)) deptish++;
          if (/^[0-9][0-9\-\s]*$/.test(v)) numeric++;
        });
        nS[c] = seen ? (person - deptish - numeric * 2) / seen : -9;
        dS[c] = seen ? (deptish - numeric * 2) / seen : -9;
      }
      var nIdx = 0;
      for (var i2 = 1; i2 < cols; i2++) if (nS[i2] > nS[nIdx]) nIdx = i2;
      var dIdx = -1;
      for (var i3 = 0; i3 < cols; i3++) {
        if (i3 === nIdx) continue;
        if (dIdx < 0 || dS[i3] > dS[dIdx]) dIdx = i3;
      }
      return { name: nIdx, dept: dIdx, header: false };
    }

    // One gradient per ball per frame was costing ~4fps at a thousand balls,
    // so each look is baked into a small canvas once and blitted.
    // Sprites are baked at device resolution so a four-digit number on an
    // eight-pixel ball still renders crisp on a projector.
    function makeBallSprite(c1, c2, label, r, dpr) {
      var pad = 3, d = Math.ceil(r * 2) + pad * 2, mx = d / 2;
      var cn = document.createElement('canvas');
      cn.width = Math.ceil(d * dpr); cn.height = Math.ceil(d * dpr);
      cn.cssW = d;
      var g = cn.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      var grd = g.createRadialGradient(mx - r * 0.38, mx - r * 0.42, r * 0.08, mx, mx, r);
      grd.addColorStop(0, c1); grd.addColorStop(1, c2);
      g.beginPath(); g.arc(mx, mx, r, 0, 6.2832); g.fillStyle = grd; g.fill();
      g.lineWidth = Math.max(1, r * 0.06);
      g.strokeStyle = 'rgba(255,255,255,.4)'; g.stroke();
      if (label) {
        // small balls give the number most of their face
        var small = r < 11;
        var disc = small ? 0.8 : 0.64, maxW = small ? 1.5 : 1.12;
        g.beginPath(); g.arc(mx, mx, r * disc, 0, 6.2832);
        g.fillStyle = 'rgba(255,255,255,.94)'; g.fill();
        var fs = r * (small ? 0.9 : 0.52), guard = 0;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.font = '700 ' + fs.toFixed(1) + 'px ' + BALL_FONT;
        while (g.measureText(label).width > r * maxW && fs > 3 && guard++ < 60) {
          fs -= 0.4;
          g.font = '700 ' + fs.toFixed(1) + 'px ' + BALL_FONT;
        }
        g.fillStyle = '#0A2440';
        g.fillText(label, mx, mx);
      }
      return cn;
    }

    // ---------- 축포 ----------
    var CONF = ['#EAF4FF','#5FA8FF','#1E6FD0','#7FD8E8','#9B8CFF','#FFD98A'];
    function fireConfetti() {
      var frag = document.createDocumentFragment(), made = [];
      for (var c = 0; c < 2; c++) {
        var fromLeft = (c === 0);
        for (var i = 0; i < 58; i++) {
          var d = document.createElement('i');
          var ang = (38 + Math.random() * 42) * Math.PI / 180;
          var vel = 42 + Math.random() * 48;
          var dx = (fromLeft ? 1 : -1) * Math.cos(ang) * vel;
          var dy = -Math.sin(ang) * vel;
          var w = 6 + Math.random() * 6;
          d.style.width = w.toFixed(1) + 'px';
          d.style.height = (w * (1 + Math.random())).toFixed(1) + 'px';
          d.style.background = CONF[(Math.random() * CONF.length) | 0];
          d.style.bottom = '6vh';
          d.style[fromLeft ? 'left' : 'right'] = '4vw';
          d.style.setProperty('--dx', dx.toFixed(1) + 'vh');
          d.style.setProperty('--dy', dy.toFixed(1) + 'vh');
          d.style.setProperty('--rot', ((Math.random() * 1080) | 0) + 'deg');
          d.style.setProperty('--dur', (1.9 + Math.random() * 1.1).toFixed(2) + 's');
          d.style.animationDelay = (Math.random() * 0.18).toFixed(2) + 's';
          frag.appendChild(d); made.push(d);
        }
      }
      document.getElementById('confetti').appendChild(frag);
      setTimeout(function () {
        made.forEach(function (d) { if (d.parentNode) d.parentNode.removeChild(d); });
      }, 3400);
    }


    var raceFullOn = null;    // the carousel uses this to drop fullscreen when it leaves

    // ----- Lucky Drop: a marble race down a long course, first home wins -----
    // The same fairness rules as the drum. Every entrant is a marble in the
    // start box, numbered, in a shuffled order; the code never picks one.
    // On 레이스 시작 the floor opens and the whole field falls down a course
    // of pins, pop bumpers, ramps with a swing gate, spinning wheels, moving
    // shelves, split lanes, a funnel with a turnstile; the camera
    // follows the leaders and zooms in for the finish. The first marble
    // across the goal line has won. Nothing steers a marble.
    (function () {
      var cv = document.getElementById('pinboard');
      if (!cv || REMOTE_MODE) return;
      var ctx = cv.getContext('2d');
      var $ = function (id) { return document.getElementById(id); };
      var spinBtn = $('pbSpinBtn'), shakeBtn = $('pbShakeBtn'), winnerEl = $('pbWinner');
      var namesBox = $('pbNamesBox'), applyBtn = $('pbApplyNames'), fileEl = $('pbRosterFile');
      var nameColEl = $('pbNameCol'), deptColEl = $('pbDeptCol'), removeChk = $('pbRemoveWinner');
      var listEl = $('pbWinnersList'), countEl = $('pbWinCount'), resetBtn = $('pbResetBtn');
      var wrap = $('pinWrap'), wbName = $('pbWbName'), wbDept = $('pbWbDept');
      var rcRemain = $('pbRcRemain'), rcTotal = $('pbRcTotal'), rcBar = $('pbRcBar');
      var rcMeta = $('pbRcMeta'), rcDept = $('pbRcDept');
      var boardEl = $('pbRosterBoard'), boardList = $('pbRosterList');
      var drawer = $('pbRosterDrawer'), openBtn = $('pbOpenRoster');
      var rankList = $('pbRankList'), rankSel = $('pbWinRank');

      var MAX_BALLS = 1500;
      var STORE = 'luckydraw.roster';    // shared with the drum: one roster serves both games
      var MIX_MS = 2500;                 // shaking before the floor opens
      var RANKS = 5;                     // places listed after the first is home
      var RACE_TAIL_MS = 60000;          // the race ends this long after first place at the latest
      var ranks = [], firstAt = 0;

      // The course is laid out in world units; the canvas is a camera on it.
      var WW = 26;                       // course width
      var HOPPER_Y = 14;                 // start-box floor, with room above the pile to boil
      var GOAL_Y = 324, END_Y = 333, COURSE_H = 336;   // set by buildCourse

      var basePool = [
        { n: '참가자 1', d: '기구개발팀' }, { n: '참가자 2', d: '기구개발팀' },
        { n: '참가자 3', d: 'MI파트' },    { n: '참가자 4', d: 'MI파트' },
        { n: '참가자 5', d: '설계파트' },  { n: '참가자 6', d: '설계파트' },
        { n: '참가자 7', d: '선행개발' },  { n: '참가자 8', d: '선행개발' }
      ];
      var pool = [], winners = [], balls = [];
      var phase = 'idle';                // idle | shake | mixing | race | won
      var phaseStart = 0, gateOpen = false, ejected = null, holeAt = 0;
      var W = 0, H = 0, DPR = 1, PX = 1, viewH = 30;
      var BR = 0.25, passes = 2, substeps = 2, grid = {}, cell = 0;
      var segs = [], circles = [], movers = [], bands = {};
      var cam = { x: WW / 2, y: 15, z: 1, tx: WW / 2, ty: 15, tz: 1 };
      var miniLayer = null, MINI = { w: 44, h: 0, x: 0, y: 12, s: 1 }, NOZZLES = [];
      var plainSprites = [];

      var PALETTE = [
        ['#8FCBFF', '#1E6FD0'], ['#9BE7EE', '#1B7E8C'], ['#BDB2FF', '#4A56B8'],
        ['#FFD98A', '#C98F27'], ['#FFB3C7', '#C1466F'], ['#A8F0C0', '#2A8F5C']
      ];

      // ---------- geometry ----------
      function layout() {
        var box = cv.getBoundingClientRect();
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        geometry(Math.max(180, Math.round(box.width)), Math.max(240, Math.round(box.height)));
        cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }

      function geometry(w, h) {
        W = w; H = h;
        PX = W / WW;                     // pixels per unit at zoom 1
        viewH = H / PX;
        buildNozzles();
        sizeBalls();
        buildCourse();
        // the course is a tall ribbon now, so the minimap is too
        MINI.h = H * 0.52; MINI.s = MINI.h / COURSE_H; MINI.w = WW * MINI.s;
        MINI.x = W - MINI.w - 10; MINI.y = 12;
        bakeMini();
      }

      // air comes up through a row of nozzles in the box floor, each one
      // breathing on its own, so the pile boils from several places at once
      function buildNozzles() {
        NOZZLES = [];
        var n = 6;
        for (var i = 0; i < n; i++) {
          NOZZLES.push({ x: WW * (i + 0.5) / n,
                         ph: i * 1.7,                 // fixed offsets: same mix every time
                         sp: 0.006 + (i % 3) * 0.004 });
        }
      }

      // ---------- balls ----------
      function sizeBalls() {
        var n = Math.max(1, Math.min(pool.length || 1, MAX_BALLS));
        // a small field gets bigger marbles; a big one must still fit the box
        BR = n <= 150 ? 0.36 : n <= 800 ? 0.25 : 0.22;
        passes = 2;
      }

      function makeSprite(c1, c2, label, r) { return makeBallSprite(c1, c2, label, r, DPR); }

      // Every entrant gets a marble; entrant-to-position is shuffled, so roster
      // order carries no positional bias. They start stacked in the box.
      function spawnBalls() {
        balls = []; ejected = null;
        var spx = Math.ceil(BR * PX * 2.6 * 2);       // sprite radius in px, crisp at full zoom
        plainSprites = PALETTE.map(function (c) { return makeSprite(c[0], c[1], null, spx); });
        var n = Math.min(pool.length, MAX_BALLS);
        var order = [];
        for (var i = 0; i < n; i++) order.push(i);
        for (var k = n - 1; k > 0; k--) {
          var j = Math.floor(Math.random() * (k + 1));
          var tmp = order[k]; order[k] = order[j]; order[j] = tmp;
        }
        var cols = Math.max(1, Math.floor((WW - BR * 2 - 0.4) / (BR * 2.05)));
        for (var p = 0; p < n; p++) {
          var ent = pool[order[p]];
          var row = Math.floor(p / cols), col = p % cols;
          var c = PALETTE[p % PALETTE.length];
          balls.push({
            x: BR * 1.05 + col * BR * 2.05 + (row % 2) * BR,
            y: HOPPER_Y - BR * 1.2 - row * BR * 1.78,
            vx: 0, vy: 0, r: BR, c1: c[0], c2: c[1], ent: ent, pi: p % PALETTE.length,
            above: true, done: false,
            sprite: makeSprite(c[0], c[1], String(ent.no), spx)
          });
        }
      }

      // ---------- course ----------
      function seg(ax, ay, bx, by, e) {
        var dx = bx - ax, dy = by - ay, l = Math.sqrt(dx * dx + dy * dy) || 1;
        return { ax: ax, ay: ay, bx: bx, by: by, dx: dx, dy: dy, l2: l * l, e: e || 0.3,
                 minx: Math.min(ax, bx), maxx: Math.max(ax, bx),
                 miny: Math.min(ay, by), maxy: Math.max(ay, by) };
      }
      function addBox(cx, cy, w, h, rot, e) {
        var c = Math.cos(rot), s = Math.sin(rot), hw = w / 2, hh = h / 2;
        var pts = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].map(function (p) {
          return [cx + p[0] * c - p[1] * s, cy + p[0] * s + p[1] * c];
        });
        for (var i = 0; i < 4; i++) {
          var a = pts[i], b = pts[(i + 1) % 4];
          var sg = seg(a[0], a[1], b[0], b[1], e); sg.box = true;
          segs.push(sg);
        }
        boxes.push({ x: cx, y: cy, w: w, h: h, rot: rot });
      }
      var boxes = [];

      // The side walls used to be flat, and a marble that reached one rode it
      // straight down past everything. They now zigzag: a shallow sawtooth,
      // out of phase left and right. A marble is turned back into the field
      // wherever it touches, and because no face is steeper than about ten
      // degrees off vertical there is nowhere for it to rest.
      var WALL_AMP = 1.0, WALL_PER = 13;
      function wallOff(y) {
        if (y <= HOPPER_Y) return 0;
        var t = ((y - HOPPER_Y) % WALL_PER) / WALL_PER;
        return WALL_AMP * (t < 0.5 ? t * 2 : (1 - t) * 2);
      }
      function wallSlope(y) {                    // dx/dy of the left wall
        if (y <= HOPPER_Y) return 0;
        var t = ((y - HOPPER_Y) % WALL_PER) / WALL_PER;
        return (t < 0.5 ? 1 : -1) * 2 * WALL_AMP / WALL_PER;
      }

      // ---- course sections; each takes the y it starts at and returns the
      // y the next one starts at, so the course is assembled down the page
      function secPins(y, rows, kicks) {
        kicks = kicks || [];
        var ky = y + Math.floor(rows / 2) * 1.7;
        for (var r = 0; r < rows; r++) {
          var yy = y + r * 1.7;
          for (var c = 0; c < 14; c++) {
            var x = 1.4 + c * 1.8 + (r % 2) * 0.9;
            if (x > WW - 1) continue;
            var near = false;
            for (var k = 0; k < kicks.length; k++) {
              if (Math.abs(x - kicks[k]) < 1.3 && Math.abs(yy - ky) < 1.3) near = true;
            }
            if (!near) circles.push({ x: x, y: yy, r: 0.22, e: 0.38 });
          }
        }
        kicks.forEach(function (kx) { circles.push({ x: kx, y: ky, r: 0.55, e: 0.6, kick: 13 }); });
        return y + rows * 1.7 + 1.5;
      }

      // zigzag ramps; one of them ends in a trapdoor hinged at the wall the
      // ramp runs down to, which holds a group and drops them all at once
      function secRamps(y, n, gateIdx, mirror) {
        var ry = y;
        for (var i = 0; i < n; i++) {
          var descRight = ((i % 2 === 0) !== !!mirror);
          if (descRight) addBox(9, ry + 1.2, 17, 0.35, 0.3, 0.15);
          else addBox(WW - 9, ry + 1.2, 17, 0.35, -0.3, 0.15);
          if (i === gateIdx) {
            if (descRight) movers.push({ kind: 'gate', x: WW - 0.3, y: ry + 4.4, len: 6.7, w: 0.3,
                                         period: 4.2, closed: Math.PI, open: Math.PI - 1.35, a: Math.PI, om: 0 });
            else movers.push({ kind: 'gate', x: 0.3, y: ry + 4.4, len: 6.7, w: 0.3,
                               period: 4.2, closed: 0, open: 1.35, a: 0, om: 0 });
            ry += 8.8;
          } else ry += 6.8;
        }
        return ry + 1;
      }

      function secWheels(y, big) {
        movers.push({ kind: 'paddle', x: 13, y: y + 3.5, len: big ? 4.6 : 3.6, w: 0.32,
                      om: big ? 0.75 : -1.05, bars: big ? 3 : 2, a: 0 });
        movers.push({ kind: 'paddle', x: 3.6, y: y + 1.5, len: 2.2, w: 0.3, om: -1.7, bars: 2, a: 0.4 });
        movers.push({ kind: 'paddle', x: WW - 3.6, y: y + 1.5, len: 2.2, w: 0.3, om: 1.7, bars: 2, a: 0.9 });
        return y + 9;
      }

      function secSliders(y, ph) {
        movers.push({ kind: 'slider', x: 7, y: y + 2, len: 5, w: 0.35, amp: 3.6, period: 3.1,
                      ph: ph, sx: 7, vx: 0, tl: 0.5 });
        movers.push({ kind: 'slider', x: 19, y: y + 2, len: 5, w: 0.35, amp: 3.6, period: 3.7,
                      ph: ph + 2.1, sx: 19, vx: 0, tl: -0.5 });
        return y + 6;
      }

      // the course splits in two: pop bumpers down one lane, diamonds the other
      function secSplit(y, kickLeft) {
        segs.push(seg(13, y, 13, y + 10, 0.2));
        var kx = kickLeft ? [4, 9.2, 4] : [22, 16.8, 22];
        var dx = kickLeft ? [16, 22.5, 19.2, 16, 22.5] : [4, 10.5, 7.2, 4, 10.5];
        circles.push({ x: kx[0], y: y + 2, r: 0.55, e: 0.6, kick: 12 });
        circles.push({ x: kx[1], y: y + 5, r: 0.55, e: 0.6, kick: 12 });
        circles.push({ x: kx[2], y: y + 8, r: 0.55, e: 0.6, kick: 12 });
        [[dx[0], y + 2], [dx[1], y + 2], [dx[2], y + 5], [dx[3], y + 8], [dx[4], y + 8]].forEach(function (d) {
          addBox(d[0], d[1], 0.9, 0.9, Math.PI / 4, 0.62);
        });
        return y + 12;
      }

      function secDiamonds(y, rows) {
        for (var r = 0; r < rows; r++) {
          var yy = y + r * 3;
          for (var c = 0; c < 8; c++) {
            var x = 2.5 + c * 3 + (r % 2) * 1.5;
            if (x > WW - 1.5) continue;
            addBox(x, yy, 0.9, 0.9, Math.PI / 4, 0.62);
          }
        }
        return y + rows * 3 + 1;
      }

      // a funnel down to a four-unit throat, with a turnstile above it
      function secFunnel(y, turnstile) {
        segs.push(seg(0, y, 11, y + 14, 0.2)); segs.push(seg(WW, y, WW - 11, y + 14, 0.2));
        segs.push(seg(11, y + 14, 11, y + 17, 0.2)); segs.push(seg(WW - 11, y + 14, WW - 11, y + 17, 0.2));
        circles.push({ x: 8, y: y + 6, r: 0.3, e: 0.38 }); circles.push({ x: 18, y: y + 6, r: 0.3, e: 0.38 });
        if (turnstile) movers.push({ kind: 'paddle', x: 13, y: y + 9.8, len: 1.7, w: 0.26, om: 1.6, bars: 2, a: 0 });
        return y + 19;
      }

      function buildCourse() {
        segs = []; circles = []; movers = []; boxes = [];
        var y = HOPPER_Y + 3;
        // Laps of the same kinds of obstacle, each laid out differently. A
        // big field pushes itself down a long course; a handful of marbles
        // would straggle for minutes, so a small one gets a shorter course.
        var laps = pool.length <= 40 ? 2 : 4;
        for (var cyc = 0; cyc < laps; cyc++) {
          y = secPins(y, cyc === 0 ? 8 : 5, cyc % 2 === 0 ? [5, 13, 21] : [9, 17]);
          y = secRamps(y, 2, 1, cyc % 2 === 1);
          y = secWheels(y, cyc % 2 === 0);
          y = secSliders(y, cyc * 1.3);
          y = secSplit(y, cyc % 2 === 0);
          y = secDiamonds(y, cyc === laps - 1 ? 2 : 3);
          y = secPins(y, 4, cyc % 2 === 0 ? [9, 17] : [5, 13, 21]);
          if (cyc === 1 && laps > 2) y = secWheels(y, false);
        }
        // the last funnel, then the home straight and the goal line
        y = secFunnel(y, true);
        for (var r = 0; r < 3; r++) {
          var hy = y + 3 + r * 1.8;
          for (var c = 0; c < 12; c++) {
            var x = 1.5 + c * 2.1 + (r % 2) * 1.05;
            if (x > WW - 1) continue;
            circles.push({ x: x, y: hy, r: 0.22, e: 0.38 });
          }
        }
        GOAL_Y = y + 13; END_Y = GOAL_Y + 9; COURSE_H = END_Y + 3;

        // anything buried in a wall's bulge is unreachable, so drop it
        circles = circles.filter(function (o) {
          return o.x > wallOff(o.y) + 0.1 && o.x < WW - wallOff(o.y + WALL_PER / 2) - 0.1;
        });

        // A pin or bumper sitting against a sloping wall makes a notch a
        // marble can wedge into for good, so clear a lane beside every wall.
        var walls = segs.filter(function (sg) { return !sg.box; });
        function distToSeg(px, py, sg) {
          var t2 = ((px - sg.ax) * sg.dx + (py - sg.ay) * sg.dy) / sg.l2;
          t2 = t2 < 0 ? 0 : t2 > 1 ? 1 : t2;
          return Math.sqrt(Math.pow(px - (sg.ax + sg.dx * t2), 2) + Math.pow(py - (sg.ay + sg.dy * t2), 2));
        }
        function clearOf(px, py, gap) {
          for (var wi = 0; wi < walls.length; wi++) if (distToSeg(px, py, walls[wi]) < gap) return false;
          return true;
        }
        circles = circles.filter(function (o) { return clearOf(o.x, o.y, o.r + 1.1); });
        var kept = [];
        boxes = boxes.filter(function (bx) { return clearOf(bx.x, bx.y, 1.6); });
        segs = segs.filter(function (sg) {
          if (!sg.box) return true;
          return boxes.some(function (bx) {
            return Math.abs(sg.minx - bx.x) < bx.w && Math.abs(sg.miny - bx.y) < bx.w;
          });
        });

        // spatial bands so a marble only tests nearby statics
        bands = {};
        function reg(k, lo, hi, item) {
          for (var b = Math.floor(lo); b <= Math.floor(hi); b++) {
            var key = k + b;
            if (!bands[key]) bands[key] = [];
            bands[key].push(item);
          }
        }
        segs.forEach(function (s) { reg('s', s.miny - 1, s.maxy + 1, s); });
        circles.forEach(function (o) { reg('c', o.y - o.r - 1, o.y + o.r + 1, o); });
      }

      // ---------- physics ----------
      var TH = 0.06;                     // wall thickness, so a fast marble cannot slip through

      function hitSeg(b, s, vsx, vsy) {
        var rr = b.r + TH;
        if (b.y < s.miny - rr || b.y > s.maxy + rr || b.x < s.minx - rr || b.x > s.maxx + rr) return;
        var t = ((b.x - s.ax) * s.dx + (b.y - s.ay) * s.dy) / s.l2;
        t = t < 0 ? 0 : t > 1 ? 1 : t;
        var px = s.ax + s.dx * t, py = s.ay + s.dy * t;
        var ddx = b.x - px, ddy = b.y - py;
        var d = Math.sqrt(ddx * ddx + ddy * ddy);
        if (d >= rr) return;
        if (d < 0.0001) { ddx = 0; ddy = -1; d = 1; }
        var nx = ddx / d, ny = ddy / d;
        b.x += nx * (rr - d); b.y += ny * (rr - d);
        var vn = (b.vx - (vsx || 0)) * nx + (b.vy - (vsy || 0)) * ny;
        if (vn < 0) { b.vx -= (1 + s.e) * vn * nx; b.vy -= (1 + s.e) * vn * ny; }
      }

      function hitCircle(b, o) {
        var ddx = b.x - o.x, ddy = b.y - o.y, mind = b.r + o.r;
        var d2 = ddx * ddx + ddy * ddy;
        if (d2 >= mind * mind) return;
        // dead centre on a pin: pick a direction, or the marble is snapped to
        // the pin's centre for good and sits there forever
        if (d2 < 1e-8) { var ra = Math.random() * 6.2832; ddx = Math.cos(ra); ddy = Math.sin(ra); d2 = 1; }
        var d = Math.sqrt(d2), nx = ddx / d, ny = ddy / d;
        b.x = o.x + nx * mind; b.y = o.y + ny * mind;
        var vn = b.vx * nx + b.vy * ny;
        if (vn < 0) { b.vx -= (1 + o.e) * vn * nx; b.vy -= (1 + o.e) * vn * ny; }
        // a pop bumper kicks: it sends the marble off at full speed whatever
        // speed it arrived with
        if (o.kick) {
          var vk = b.vx * nx + b.vy * ny;
          if (vk < o.kick) { b.vx += (o.kick - vk) * nx; b.vy += (o.kick - vk) * ny; }
        }
      }

      // Movers are the course's kinematic parts. On contact the part's own
      // surface speed is what the marble bounces off, so a wheel flings and a
      // shelf carries.
      function moverPose(m, t) {
        if (m.kind === 'gate') {
          // closed most of the cycle, then a quick swing open, a pause, and back
          var u = ((t / 1000) / m.period) % 1, k;
          if (u < 0.55) { m.a = m.closed; m.om = 0; }
          else if (u < 0.7) { k = (u - 0.55) / 0.15; m.a = m.closed + (m.open - m.closed) * k * k * (3 - 2 * k); m.om = (m.open - m.closed) * 6 * k * (1 - k) / (0.15 * m.period); }
          else if (u < 0.85) { m.a = m.open; m.om = 0; }
          else { k = (u - 0.85) / 0.15; m.a = m.open + (m.closed - m.open) * k * k * (3 - 2 * k); m.om = (m.closed - m.open) * 6 * k * (1 - k) / (0.15 * m.period); }
        } else if (m.kind === 'slider') {
          var w = 6.2832 / m.period, ph = w * t / 1000 + m.ph;
          m.sx = m.x + m.amp * Math.sin(ph);
          m.vx = m.amp * w * Math.cos(ph);
        }
      }

      function hitMover(b, m) {
        var dx = b.x - m.x, dy = b.y - m.y, reach = (m.amp || m.len) + m.len + b.r + 0.6;
        if (dx * dx + dy * dy > reach * reach) return;
        var k, a, c, sn, sg;
        if (m.kind === 'paddle') {
          for (k = 0; k < m.bars; k++) {
            a = m.a + k * Math.PI / m.bars; c = Math.cos(a); sn = Math.sin(a);
            sg = seg(m.x - c * m.len, m.y - sn * m.len, m.x + c * m.len, m.y + sn * m.len, 0.5);
            hitSeg(b, sg, -m.om * (b.y - m.y), m.om * (b.x - m.x));
          }
          hitCircle(b, { x: m.x, y: m.y, r: 0.45, e: 0.4 });
        } else if (m.kind === 'gate') {
          c = Math.cos(m.a); sn = Math.sin(m.a);
          sg = seg(m.x, m.y, m.x + c * m.len, m.y + sn * m.len, 0.3);
          hitSeg(b, sg, -m.om * (b.y - m.y), m.om * (b.x - m.x));
        } else if (m.kind === 'slider') {
          sg = seg(m.sx - m.len / 2, m.y - m.tl, m.sx + m.len / 2, m.y + m.tl, 0.3);
          hitSeg(b, sg, m.vx, 0);
          // riding on the shelf: friction drags the marble along with it, and
          // the shelf's tilt means it always rolls off one end
          var surf = m.y + m.tl * ((b.x - m.sx) / (m.len / 2));
          if (Math.abs(b.x - m.sx) < m.len / 2 + b.r && b.y < surf && surf - b.y < b.r + TH + 0.1) {
            b.vx += (m.vx - b.vx) * 0.2;
          }
        }
      }

      function buildGrid() {
        grid = {};
        cell = Math.max(0.3, BR * 2);
        for (var i = 0; i < balls.length; i++) {
          var b = balls[i];
          if (b.done) continue;
          var k = Math.floor(b.x / cell) + ',' + Math.floor(b.y / cell);
          if (grid[k]) grid[k].push(i); else grid[k] = [i];
        }
      }

      function resolvePairs() {
        buildGrid();
        for (var i = 0; i < balls.length; i++) {
          var a1 = balls[i];
          if (a1.done) continue;
          var ix = Math.floor(a1.x / cell), iy = Math.floor(a1.y / cell);
          for (var dx = -1; dx <= 1; dx++) {
            for (var dy = -1; dy <= 1; dy++) {
              var lst = grid[(ix + dx) + ',' + (iy + dy)];
              if (!lst) continue;
              for (var m = 0; m < lst.length; m++) {
                var j = lst[m];
                if (j <= i) continue;
                var a2 = balls[j];
                var ddx = a2.x - a1.x, ddy = a2.y - a1.y;
                var dd = Math.sqrt(ddx * ddx + ddy * ddy);
                var mind = a1.r + a2.r;
                if (dd >= mind) continue;
                if (dd < 0.0001) { ddx = Math.random() - 0.5; ddy = -1; dd = 1; }
                var ux = ddx / dd, uy = ddy / dd, push = (mind - dd) / 2;
                a1.x -= ux * push; a1.y -= uy * push;
                a2.x += ux * push; a2.y += uy * push;
                var rv = (a2.vx - a1.vx) * ux + (a2.vy - a1.vy) * uy;
                if (rv < 0) {
                  var imp = -1.4 * rv / 2;
                  a1.vx -= imp * ux; a1.vy -= imp * uy;
                  a2.vx += imp * ux; a2.vy += imp * uy;
                }
              }
            }
          }
        }
      }

      // Side walls, the start-box floor while closed, every static in the
      // marble's band, the movers, and the goal line. The first marble whose
      // centre crosses the goal has won; that is the whole rule.
      function clampStatics() {
        for (var i = 0; i < balls.length; i++) {
          var b = balls[i];
          if (b.done) continue;
          // The wall only ever acts sideways: it never takes anything off a
          // marble's fall, so nothing can come to rest against it. Where the
          // wall bulges inward it throws a falling marble back into the field.
          var lw = wallOff(b.y) + b.r;
          if (b.x < lw) {
            var ls = wallSlope(b.y);
            b.x = lw;
            if (b.vx < 0) b.vx *= -0.35;
            if (ls > 0 && b.vy > 0) b.vx += ls * b.vy * 0.9;
          }
          var rw = WW - wallOff(b.y + WALL_PER / 2) - b.r;
          if (b.x > rw) {
            var rs = wallSlope(b.y + WALL_PER / 2);
            b.x = rw;
            if (b.vx > 0) b.vx *= -0.35;
            if (rs > 0 && b.vy > 0) b.vx -= rs * b.vy * 0.9;
          }
          if (b.y < b.r) { b.y = b.r; if (b.vy < 0) b.vy *= -0.4; }
          if (b.above) {
            if (gateOpen) { if (b.y > HOPPER_Y - b.r) b.above = false; }
            else if (b.y > HOPPER_Y - b.r) { b.y = HOPPER_Y - b.r; if (b.vy > 0) b.vy *= -0.3; }
          }
          var band = Math.floor(b.y);
          for (var k = band - 1; k <= band + 1; k++) {
            var ss = bands['s' + k];
            if (ss) for (var q = 0; q < ss.length; q++) hitSeg(b, ss[q], 0, 0);
            var cs = bands['c' + k];
            if (cs) for (var u = 0; u < cs.length; u++) hitCircle(b, cs[u]);
          }
          for (var pd = 0; pd < movers.length; pd++) hitMover(b, movers[pd]);
          if (b.y > GOAL_Y && phase === 'race') { capture(b); continue; }
          if (b.y > END_Y) b.done = true;
        }
      }

      function step(dt, now) {
        var shaking = (phase === 'shake' || phase === 'mixing');
        // a big field pushes itself along; a handful of marbles has nothing to
        // shove it, so a small field runs on a steeper hill
        var small = pool.length <= 60;
        var G = small ? 32 : 22, VMAX = shaking ? 46 : (small ? 42 : 33);   // the blower throws harder than the course does
        // the start box is an air-mix chamber: six nozzles along the floor,
        // each breathing at its own rate, so plumes rise in several places at
        // once and the pile keeps turning over instead of circulating one way
        var JET = shaking ? 210 : 0;
        var rattle = (phase === 'race' && now - holeAt > 100000 && ((now - holeAt) % 4000) < 700);
        var h = dt / substeps;
        for (var sub = 0; sub < substeps; sub++) {
          for (var i = 0; i < balls.length; i++) {
            var b = balls[i];
            if (b.done) continue;
            var inBox = b.y < HOPPER_Y + b.r;
            b.vy += G * h;
            if (shaking && inBox) {
              var hh = (HOPPER_Y - b.y) / HOPPER_Y;                 // 0 at the floor, 1 at the top
              var pw = WW * (0.045 + 0.09 * hh);                    // each plume widens as it rises
              var lift = 0, drift = 0;
              for (var nz = 0; nz < NOZZLES.length; nz++) {
                var N = NOZZLES[nz];
                var ox = b.x - N.x;
                if (ox > pw * 2.5 || ox < -pw * 2.5) continue;
                var str = JET * (0.5 + 0.5 * Math.sin(now * N.sp + N.ph));
                var e2 = Math.exp(-(ox * ox) / (pw * pw)) * Math.max(0, 1.15 - hh * 2.2);
                lift += str * e2;
                drift += (ox / pw) * str * e2 * 0.2;                // air spills sideways as it rises
              }
              b.vy -= lift * h; b.vx += drift * h;
              if (b.x < 1.5) b.vx += 8 * h;                         // walls nudge marbles back in
              if (b.x > WW - 1.5) b.vx -= 8 * h;
              b.vx += (Math.random() - 0.5) * 70 * h; b.vy += (Math.random() - 0.5) * 70 * h;
            }
            if (inBox && !shaking && b.above) { b.vx *= 0.96; b.vy *= 0.96; }
            else b.vx += (Math.random() - 0.5) * 6 * h;
            if (rattle) { b.vx += (Math.random() - 0.5) * 80 * h; b.vy -= Math.random() * 50 * h; }
            b.vx *= 0.999; b.vy *= 0.999;
            var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
            if (sp > VMAX) { b.vx = b.vx / sp * VMAX; b.vy = b.vy / sp * VMAX; }
            b.x += b.vx * h; b.y += b.vy * h;
          }
          for (var pd = 0; pd < movers.length; pd++) {
            var mv = movers[pd];
            if (mv.kind === 'paddle') mv.a += mv.om * h; else moverPose(mv, now + (sub + 1) * h * 1000);
          }
          for (var it = 0; it < passes; it++) { resolvePairs(); clampStatics(); }
        }
      }

      // ---------- drawing ----------
      // The course is three hundred units long, so it is drawn live, band by
      // band, instead of baked into one enormous canvas. Only what the camera
      // can see is touched, which is a fraction of the marbles' cost.
      function courseTint(y) {
        var t = Math.max(0, Math.min(1, y / COURSE_H));
        var a = [130, 185, 255, 0.10], b2 = [24, 64, 124, 0.16], c2 = [6, 20, 45, 0.32];
        var p, q, k;
        if (t < 0.5) { p = a; q = b2; k = t / 0.5; } else { p = b2; q = c2; k = (t - 0.5) / 0.5; }
        return 'rgba(' + Math.round(p[0] + (q[0] - p[0]) * k) + ',' +
                         Math.round(p[1] + (q[1] - p[1]) * k) + ',' +
                         Math.round(p[2] + (q[2] - p[2]) * k) + ',' +
                         (p[3] + (q[3] - p[3]) * k).toFixed(3) + ')';
      }

      function drawCourse(g, top, bot, mini) {
        var y0 = Math.max(0, top), y1 = Math.min(COURSE_H, bot);
        if (y1 <= y0) return;
        var bg = g.createLinearGradient(0, y0, 0, y1);
        bg.addColorStop(0, courseTint(y0)); bg.addColorStop(1, courseTint(y1));
        g.fillStyle = bg; g.fillRect(0, y0, WW, y1 - y0);
        if (!mini) {
          g.strokeStyle = 'rgba(255,255,255,.05)'; g.lineWidth = 0.04;
          for (var yy = Math.ceil(y0 / 10) * 10; yy < y1; yy += 10) {
            g.beginPath(); g.moveTo(0, yy); g.lineTo(WW, yy); g.stroke();
          }
        }
        if (y0 < HOPPER_Y) {
          g.fillStyle = 'rgba(8,24,52,.4)';
          g.fillRect(0, y0, WW, Math.min(HOPPER_Y, y1) - y0);
        }
        // the zigzag side walls
        var step = mini ? 4 : 1;
        g.beginPath(); g.moveTo(0, y0);
        for (var wy = y0; wy <= y1; wy += step) g.lineTo(wallOff(wy), wy);
        g.lineTo(wallOff(y1), y1); g.lineTo(0, y1); g.closePath();
        g.fillStyle = 'rgba(110,165,235,.22)'; g.fill();
        g.beginPath(); g.moveTo(WW, y0);
        for (var wy2 = y0; wy2 <= y1; wy2 += step) g.lineTo(WW - wallOff(wy2 + WALL_PER / 2), wy2);
        g.lineTo(WW - wallOff(y1 + WALL_PER / 2), y1); g.lineTo(WW, y1); g.closePath();
        g.fill();
        // funnel and lane walls
        g.strokeStyle = 'rgba(175,215,255,.6)'; g.lineWidth = mini ? 0.3 : 0.18; g.lineCap = 'round';
        for (var si = 0; si < segs.length; si++) {
          var sg = segs[si];
          if (sg.box || sg.maxy < y0 || sg.miny > y1) continue;
          g.beginPath(); g.moveTo(sg.ax, sg.ay); g.lineTo(sg.bx, sg.by); g.stroke();
        }
        // ramps and bumpers
        for (var bi = 0; bi < boxes.length; bi++) {
          var bx = boxes[bi];
          if (bx.y < y0 - 3.5 || bx.y > y1 + 3.5) continue;
          g.save(); g.translate(bx.x, bx.y); g.rotate(bx.rot);
          g.fillStyle = bx.w > 5 ? 'rgba(175,215,255,.55)' : 'rgba(127,216,232,.75)';
          g.fillRect(-bx.w / 2, -bx.h / 2, bx.w, bx.h);
          g.restore();
        }
        // pins and pop bumpers
        for (var ci = 0; ci < circles.length; ci++) {
          var o = circles[ci];
          if (o.y < y0 - 1 || o.y > y1 + 1) continue;
          if (!mini) {                               // a soft halo instead of a shadow blur
            g.beginPath(); g.arc(o.x, o.y, o.r * 2.1, 0, 6.2832);
            g.fillStyle = o.kick ? 'rgba(255,120,170,.2)' : 'rgba(120,190,255,.18)';
            g.fill();
          }
          g.beginPath(); g.arc(o.x, o.y, o.r, 0, 6.2832);
          g.fillStyle = o.kick ? 'rgba(255,179,199,.95)' : o.e > 0.55 ? 'rgba(255,227,154,.9)' : 'rgba(200,228,255,.9)';
          g.fill();
          if (o.kick && !mini) {
            g.beginPath(); g.arc(o.x, o.y, o.r + 0.25, 0, 6.2832);
            g.lineWidth = 0.08; g.strokeStyle = 'rgba(255,179,199,.7)'; g.stroke();
          }
        }
        // hubs and pivots
        for (var mi = 0; mi < movers.length; mi++) {
          var mv = movers[mi];
          if (mv.kind === 'slider' || mv.y < y0 - 1 || mv.y > y1 + 1) continue;
          g.beginPath(); g.arc(mv.x, mv.y, mv.kind === 'gate' ? 0.35 : 0.45, 0, 6.2832);
          g.fillStyle = 'rgba(255,227,154,.9)'; g.fill();
        }
        // goal
        if (y1 > GOAL_Y) {
          g.fillStyle = 'rgba(255,227,154,.14)'; g.fillRect(0, GOAL_Y, WW, END_Y - GOAL_Y);
          g.strokeStyle = 'rgba(255,227,154,.9)'; g.lineWidth = mini ? 0.5 : 0.14;
          if (!mini) g.setLineDash([0.6, 0.4]);
          g.beginPath(); g.moveTo(0, GOAL_Y); g.lineTo(WW, GOAL_Y); g.stroke();
          g.setLineDash([]);
          if (!mini) {
            g.font = '800 2.2px ' + BALL_FONT; g.textAlign = 'center'; g.textBaseline = 'middle';
            g.fillStyle = 'rgba(255,227,154,.9)'; g.fillText('GOAL', WW / 2, GOAL_Y + 3.6);
          }
        }
      }

      // the whole course, once, at thumbnail size
      function bakeMini() {
        var m = document.createElement('canvas');
        m.width = Math.max(1, Math.ceil(MINI.w * DPR)); m.height = Math.max(1, Math.ceil(MINI.h * DPR));
        var mg = m.getContext('2d');
        mg.fillStyle = 'rgba(3,11,26,.7)'; mg.fillRect(0, 0, m.width, m.height);
        mg.scale(m.width / WW, m.height / COURSE_H);
        drawCourse(mg, 0, COURSE_H, true);
        miniLayer = m;
      }

      function drawBall(g, b, useName, glow) {
        var sp = useName ? plainSprites[b.pi] : b.sprite;
        if (!sp) return;
        if (glow) { g.shadowColor = 'rgba(255,240,180,.95)'; g.shadowBlur = b.r * 2; }
        g.drawImage(sp, b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
        if (glow) g.shadowBlur = 0;
      }

      function leaders(n) {
        var top = [];
        for (var i = 0; i < balls.length; i++) {
          var b = balls[i];
          if (b.done || b.above) continue;
          if (top.length < n) { top.push(b); top.sort(function (p, q) { return q.y - p.y; }); }
          else if (b.y > top[n - 1].y) { top[n - 1] = b; top.sort(function (p, q) { return q.y - p.y; }); }
        }
        return top;
      }

      function render(now) {
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.clearRect(0, 0, W, H);
        var z = cam.z, s = PX * z;
        ctx.save();
        ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-cam.x, -cam.y);
        // visible band of the course
        var top = cam.y - viewH / z / 2 - 2, bot = cam.y + viewH / z / 2 + 2;
        drawCourse(ctx, top, bot, false);
        if (!gateOpen) {
          ctx.strokeStyle = 'rgba(255,227,154,.6)'; ctx.lineWidth = 0.12;
          ctx.beginPath(); ctx.moveTo(0, HOPPER_Y); ctx.lineTo(WW, HOPPER_Y); ctx.stroke();
        }
        // the nozzles in the box floor, and their air while they are blowing
        if (top < HOPPER_Y + 1) {
          var blowing = (phase === 'shake' || phase === 'mixing');
          for (var nz = 0; nz < NOZZLES.length; nz++) {
            var N = NOZZLES[nz];
            ctx.fillStyle = blowing ? 'rgba(255,227,154,.9)' : 'rgba(175,215,255,.5)';
            ctx.fillRect(N.x - 0.5, HOPPER_Y - 0.18, 1, 0.22);
            if (!blowing) continue;
            var str = 0.55 + 0.45 * Math.sin(now * N.sp + N.ph);
            ctx.lineWidth = 0.1; ctx.lineCap = 'round';
            for (var q2 = 0; q2 < 3; q2++) {
              var ph2 = ((now / 700) + q2 * 0.33 + nz * 0.21) % 1;
              var sy2 = HOPPER_Y - ph2 * HOPPER_Y * (0.5 + 0.5 * str);
              ctx.strokeStyle = 'rgba(190,225,255,' + (0.4 * (1 - ph2) * str).toFixed(2) + ')';
              ctx.beginPath();
              ctx.moveTo(N.x + (q2 - 1) * 0.35, sy2);
              ctx.lineTo(N.x + (q2 - 1) * 0.35, sy2 - 1.5);
              ctx.stroke();
            }
          }
        }
        // movers
        movers.forEach(function (m) {
          if (m.y < top - 6 || m.y > bot + 6) return;
          ctx.save();
          if (m.kind === 'paddle') {
            ctx.translate(m.x, m.y); ctx.rotate(m.a);
            ctx.fillStyle = 'rgba(255,227,154,.85)';
            for (var k = 0; k < m.bars; k++) {
              ctx.fillRect(-m.len, -m.w / 2, m.len * 2, m.w);
              ctx.rotate(Math.PI / m.bars);
            }
          } else if (m.kind === 'gate') {
            ctx.translate(m.x, m.y); ctx.rotate(m.a);
            ctx.fillStyle = m.om === 0 && m.a === m.closed ? 'rgba(255,179,199,.9)' : 'rgba(255,227,154,.85)';
            ctx.fillRect(0, -m.w / 2, m.len, m.w);
          } else if (m.kind === 'slider') {
            ctx.translate(m.sx, m.y); ctx.rotate(Math.atan2(m.tl * 2, m.len));
            ctx.fillStyle = 'rgba(127,216,232,.85)';
            ctx.fillRect(-m.len / 2, -m.w / 2, m.len, m.w);
            ctx.fillStyle = 'rgba(3,11,26,.6)';
            for (var q = -1; q <= 1; q++) ctx.fillRect(q * 1.2 - 0.08, -m.w / 2 + 0.06, 0.16, m.w - 0.12);
          }
          ctx.restore();
        });
        // marbles; names appear once a marble is big enough on screen
        var screenR = BR * s, useName = screenR >= 10;
        for (var i = 0; i < balls.length; i++) {
          var b = balls[i];
          if (b.done || b === ejected || b.y < top || b.y > bot) continue;
          drawBall(ctx, b, useName, false);
        }
        if (useName) {
          var fs = Math.min(15, Math.max(10, screenR * 0.95)) / s;
          ctx.font = '700 ' + fs.toFixed(3) + 'px ' + BALL_FONT;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.lineWidth = fs * 0.28; ctx.lineJoin = 'round';
          for (var j = 0; j < balls.length; j++) {
            var nb = balls[j];
            if (nb.done || nb === ejected || nb.y < top || nb.y > bot) continue;
            ctx.strokeStyle = 'rgba(3,11,26,.85)'; ctx.strokeText(nb.ent.n, nb.x, nb.y);
            ctx.fillStyle = '#fff'; ctx.fillText(nb.ent.n, nb.x, nb.y);
          }
        }
        for (var rk = 0; rk < ranks.length; rk++) {
          var fb = ranks[rk];
          var kk2 = Math.min(1, (now - fb.since) / 500);
          var px2 = WW * (0.5 + (rk - (RANKS - 1) / 2) * 0.17), py2 = GOAL_Y + 2.2;
          var big = { x: fb.x + (px2 - fb.x) * kk2, y: fb.y + (py2 - fb.y) * kk2,
                      r: fb.r * (1 + (rk === 0 ? 2.2 : 1.4) * kk2), pi: fb.pi, sprite: fb.sprite };
          drawBall(ctx, big, false, rk === 0);
          if (kk2 >= 1) {
            var fs2 = (rk === 0 ? 13 : 11) / s;
            ctx.font = '700 ' + fs2.toFixed(3) + 'px ' + BALL_FONT;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.lineWidth = fs2 * 0.28; ctx.strokeStyle = 'rgba(3,11,26,.85)';
            ctx.strokeText((rk + 1) + '등 ' + fb.ent.n, big.x, big.y + big.r + fs2 * 0.8);
            ctx.fillStyle = rk === 0 ? '#FFE39A' : '#fff';
            ctx.fillText((rk + 1) + '등 ' + fb.ent.n, big.x, big.y + big.r + fs2 * 0.8);
          }
        }
        ctx.restore();

        // The places already home, then whoever is racing for the rest. The
        // side panel is out of sight while a race runs fullscreen, so this is
        // where the room reads the result.
        if (phase === 'race' || phase === 'won') {
          var lead = phase === 'race' ? leaders(Math.max(0, RANKS - ranks.length)) : [];
          var rows = ranks.length + Math.min(3, lead.length);
          if (rows) {
            var fs3 = Math.max(12, Math.round(W * 0.022));
            ctx.font = '700 ' + fs3 + 'px ' + BALL_FONT;
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            var lh = Math.round(fs3 * 1.5), pw = Math.round(fs3 * 13), ph = 12 + rows * lh;
            ctx.fillStyle = 'rgba(3,11,26,.6)';
            ctx.beginPath(); ctx.rect(10, 10, pw, ph); ctx.fill();
            var row = 0;
            for (var fi = 0; fi < ranks.length; fi++, row++) {
              ctx.fillStyle = fi === 0 ? '#FFE39A' : 'rgba(255,227,154,.8)';
              ctx.fillText((fi + 1) + '등  ' + ranks[fi].ent.n, 18, 17 + row * lh + lh / 2);
            }
            for (var L = 0; L < lead.length && L < 3; L++, row++) {
              ctx.fillStyle = 'rgba(200,222,255,.75)';
              ctx.fillText('· ' + lead[L].ent.n + '  No.' + lead[L].ent.no, 18, 17 + row * lh + lh / 2);
            }
          }
        }
        // minimap
        if (miniLayer) {
          ctx.drawImage(miniLayer, MINI.x, MINI.y, MINI.w, MINI.h);
          ctx.strokeStyle = 'rgba(175,215,255,.5)'; ctx.lineWidth = 1;
          ctx.strokeRect(MINI.x, MINI.y, MINI.w, MINI.h);
          ctx.fillStyle = 'rgba(255,255,255,.85)';
          for (var mi = 0; mi < balls.length; mi++) {
            var mb = balls[mi];
            if (mb.done) continue;
            ctx.fillRect(MINI.x + mb.x * MINI.s - 0.5, MINI.y + mb.y * MINI.s - 0.5, 1.2, 1.2);
          }
          ctx.strokeStyle = 'rgba(255,227,154,.9)';
          var vh = viewH / z, vw = WW / z;
          ctx.strokeRect(MINI.x + (cam.x - vw / 2) * MINI.s, MINI.y + (cam.y - vh / 2) * MINI.s, vw * MINI.s, vh * MINI.s);
        }
      }

      // ---------- camera & loop ----------
      function updateCamera(dt) {
        if (phase === 'race') {
          // frame the marbles still racing for the places left to decide:
          // all five at first, then fewer as they come home
          var lead = leaders(Math.max(1, RANKS - ranks.length));
          if (lead.length) {
            var top = lead[0].y, bottom = lead[lead.length - 1].y, mx = 0;
            for (var li = 0; li < lead.length; li++) mx += lead[li].x;
            mx /= lead.length;
            var near = Math.max(0, 1 - Math.max(0, GOAL_Y - 22 - top) / 30);   // 0 far, 1 at the goal
            var zGoal = 1 + 1.4 * near;
            var zFit = (viewH * 0.55) / Math.max(4, top - bottom + 4);          // keep the group in view
            cam.tz = Math.max(1, Math.min(zGoal, zFit));
            var vh = viewH / cam.tz, hw = WW / cam.tz / 2;
            cam.ty = (top + bottom) / 2 + vh * 0.12;
            cam.tx = Math.max(hw, Math.min(WW - hw, mx));
          }
        } else if (phase === 'won' && ranks.length) {
          cam.tz = 2.0; cam.ty = GOAL_Y + 1.5; cam.tx = WW / 2;
        } else {
          cam.tz = 1; cam.ty = viewH / 2; cam.tx = WW / 2;
        }
        var vh2 = viewH / cam.tz / 2;
        cam.ty = Math.max(vh2, Math.min(COURSE_H - vh2, cam.ty));
        var k = Math.min(1, 4 * dt);
        cam.x += (cam.tx - cam.x) * k; cam.y += (cam.ty - cam.y) * k; cam.z += (cam.tz - cam.z) * k * 0.7;
      }

      var last = 0;
      function frame(t) {
        if (!last) last = t;
        var dt = Math.min((t - last) / 1000, 0.033);
        last = t;
        if (phase === 'mixing' && t - phaseStart >= MIX_MS) {
          phase = 'race'; phaseStart = t; holeAt = t;
          gateOpen = true;
          winnerEl.innerHTML = '레이스 진행 중';
          renderRanks(false);
        } else if (phase === 'race' && ranks.length &&
                   (t - firstAt > (basePool.length <= 40 ? 150000 : RACE_TAIL_MS) || !stillRunning())) {
          endRace();
        }
        step(dt, t);
        updateCamera(dt);
        render(t);
        requestAnimationFrame(frame);
      }

      // ---------- fullscreen ----------
      // A race takes over the screen from 레이스 시작 until the fifth marble is
      // home. The canvas is re-measured on the way in and out.
      var stage = wrap.parentNode;
      function enterFull() {
        var rf = stage.requestFullscreen || stage.webkitRequestFullscreen;
        if (rf && !document.fullscreenElement) { try { rf.call(stage); } catch (err) {} }
      }
      function leaveFull() {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(function () {});
        }
      }
      document.addEventListener('fullscreenchange', function () {
        setTimeout(function () { layout(); }, 60);
      });
      raceFullOn = function (onSlide) { if (!onSlide) leaveFull(); };

      // ---------- draw lifecycle ----------
      var roundTimer = null, nameTimer = null;
      function setShake(on) {
        if (on && phase !== 'idle' && phase !== 'won') return;
        if (!on && phase !== 'shake') return;
        clearTimeout(roundTimer); roundTimer = null;
        clearTimeout(nameTimer); nameTimer = null;
        if (on && (phase === 'won' || gateOpen)) { gateOpen = false; spawnBalls(); }
        phase = on ? 'shake' : 'idle';
        if (on) ejected = null;
        wrap.classList.toggle('is-mixing', on);
        if (shakeBtn) { shakeBtn.classList.toggle('on', on); shakeBtn.textContent = on ? '흔들기 멈춤' : '공 흔들기'; }
        if (on) winnerEl.innerHTML = '바람으로 섞는 중';
        else if (winnerEl.innerHTML === '바람으로 섞는 중') winnerEl.innerHTML = '';
      }

      function startDraw() {
        if (phase === 'mixing' || phase === 'race') return;
        if (!pool.length) {
          winnerEl.innerHTML = '명단이 비었습니다 · 초기화를 눌러 주세요';
          return;
        }
        clearTimeout(roundTimer); roundTimer = null;
        clearTimeout(nameTimer); nameTimer = null;
        ejected = null;
        // every race starts from a full, freshly shuffled box
        if (phase !== 'shake') { gateOpen = false; spawnBalls(); }
        ranks = []; renderRanks(false);
        wrap.classList.remove('show-name');
        phase = 'mixing'; phaseStart = performance.now();
        spinBtn.disabled = true;
        if (shakeBtn) { shakeBtn.disabled = true; shakeBtn.classList.remove('on'); shakeBtn.textContent = '공 흔들기'; }
        wrap.classList.add('is-mixing');
        winnerEl.innerHTML = '섞는 중…';
        enterFull();
      }

      // called from clampStatics each time a marble's centre crosses the goal;
      // the first is the winner, and the race runs on until RANKS are home
      function capture(b) {
        var now = performance.now();
        b.done = true;                              // out of the simulation, parked at the line
        b.since = now;
        b.rank = ranks.length + 1;
        ranks.push(b);
        renderRanks(true);
        var winRank = rankSel ? parseInt(rankSel.value, 10) || 1 : 1;
        if (b.rank === 1) {
          ejected = b; firstAt = now;
          wrap.classList.remove('is-mixing');
          fireConfetti();
          winnerEl.innerHTML = '골인! 축하합니다';
        }
        if (b.rank <= RANKS) {
          // 1등, 2등, … each flashes up in the centre as it crosses the line
          wbName.textContent = b.rank + '등 ' + b.ent.n;
          wbDept.textContent = 'No.' + b.ent.no + (b.ent.d ? ' · ' + b.ent.d : '');
          clearTimeout(nameTimer);
          wrap.classList.remove('show-name');
          void wrap.offsetWidth;                    // restart the entrance animation
          wrap.classList.add('show-name');
          nameTimer = setTimeout(function () { wrap.classList.remove('show-name'); }, 200);
        }
        if (b.rank <= winRank) addWinner(b.ent);
        if (ranks.length >= RANKS) endRace();
      }

      function addWinner(won) {
        winners.push({ n: won.n, d: won.d, no: won.no });
        renderWinners(true);
        if (removeChk.checked) {
          var pi = pool.indexOf(won);
          if (pi >= 0) pool.splice(pi, 1);
          markDrawn(won.no);
        }
        updateCard();
      }

      function endRace() {
        if (phase !== 'race') return;
        phase = 'won';
        spinBtn.disabled = false;
        if (shakeBtn) shakeBtn.disabled = false;
        if (ranks.length < RANKS) renderRanks(false);
        leaveFull();                       // the board goes back into the page
        roundTimer = setTimeout(function () {
          if (phase !== 'won') return;
          ejected = null;
          gateOpen = false; spawnBalls();
        }, 7000);
      }

      function stillRunning() {
        for (var i = 0; i < balls.length; i++) if (!balls[i].done) return true;
        return false;
      }

      // ---------- finishing order ----------
      function renderRanks(teleportLast) {
        if (!rankList) return;
        rankList.innerHTML = '';
        if (!ranks.length) {
          var e = document.createElement('div');
          e.className = 'winners-empty';
          e.textContent = phase === 'race' ? '레이스 진행 중…' : '레이스를 시작하면 순위가 표시됩니다';
          rankList.appendChild(e);
          return;
        }
        ranks.forEach(function (b, i) {
          var li = document.createElement('li');
          li.className = (teleportLast && i === ranks.length - 1 ? 'teleport ' : '') + (i === 0 ? 'first' : '');
          var no = document.createElement('span');
          no.className = 'no'; no.textContent = (i + 1) + '등';
          li.appendChild(no);
          var tw = document.createElement('span');
          tw.className = 'w-text';
          var nm = document.createElement('span');
          nm.className = 'w-name'; nm.textContent = b.ent.n;
          tw.appendChild(nm);
          var dp = document.createElement('span');
          dp.className = 'w-dept';
          dp.textContent = 'No.' + b.ent.no + (b.ent.d ? ' · ' + b.ent.d : '');
          tw.appendChild(dp);
          li.appendChild(tw);
          rankList.appendChild(li);
        });
      }

      // ---------- roster board ----------
      function renderBoard() {
        if (!boardEl || !boardList) return;
        boardList.innerHTML = '';
        boardEl.classList.remove('scroll');
        boardList.style.removeProperty('--dur');
        var frag = document.createDocumentFragment();
        basePool.forEach(function (e) {
          var li = document.createElement('li');
          li.setAttribute('data-no', e.no);
          li.innerHTML = '<span class="no">' + e.no + '</span><span class="nm"></span>' +
                         (e.d ? '<span class="d"></span>' : '');
          li.querySelector('.nm').textContent = e.n;
          if (e.d) li.querySelector('.d').textContent = e.d;
          frag.appendChild(li);
        });
        boardList.appendChild(frag);
        if (boardList.scrollHeight > boardEl.clientHeight + 4) {
          var rows = basePool.length;
          boardList.innerHTML += boardList.innerHTML;
          boardList.style.setProperty('--dur', Math.max(20, rows * 0.13).toFixed(1) + 's');
          boardEl.classList.add('scroll');
        }
      }

      function markDrawn(no) {
        if (!boardList) return;
        var rows = boardList.querySelectorAll('li[data-no="' + no + '"]');
        for (var i = 0; i < rows.length; i++) rows[i].classList.add('drawn');
      }

      // ---------- winners list ----------
      // the finishing order is the result here; winners are only kept so the
      // pool and the board know who is out
      function renderWinners() {
        if (countEl) countEl.textContent = winners.length;
      }

      function updateCard() {
        var total = basePool.length, left = pool.length, drawn = total - left;
        if (rcRemain) rcRemain.textContent = left;
        if (rcTotal) rcTotal.textContent = total;
        if (rcBar) rcBar.style.width = total ? (drawn / total * 100).toFixed(1) + '%' : '0%';
        if (rcMeta) rcMeta.textContent = '출발 ' + left + '구 · 제외 ' + drawn + '명';
        if (rcDept) {
          var seen = {}, n = 0;
          basePool.forEach(function (e) { if (e.d && !seen[e.d]) { seen[e.d] = 1; n++; } });
          rcDept.textContent = n ? '· 부서 ' + n + '곳' : '';
        }
      }

      function setDrawer(on) { if (drawer) drawer.classList.toggle('open', on); }

      // ---------- reset / roster ----------
      var rawRows = [], nameCol = 0, deptCol = 1, hasHeader = false;

      function fillColSelects(cols) {
        [[nameColEl, nameCol, false], [deptColEl, deptCol, true]].forEach(function (t) {
          var el = t[0];
          if (!el) return;
          el.innerHTML = '';
          if (t[2]) {
            var none = document.createElement('option');
            none.value = '-1'; none.textContent = '없음';
            el.appendChild(none);
          }
          for (var c = 0; c < cols; c++) {
            var o = document.createElement('option');
            o.value = String(c); o.textContent = (c + 1) + '열';
            el.appendChild(o);
          }
          el.value = String(t[1]);
        });
      }

      function rowsToPool() {
        var out = [];
        rawRows.forEach(function (r, i) {
          if (hasHeader && i === 0) return;
          var n = (r[nameCol] || '').trim();
          var d = deptCol >= 0 ? (r[deptCol] || '').trim() : '';
          if (n) out.push({ n: n, d: d });
        });
        return out;
      }

      function restore(list) {
        clearTimeout(roundTimer); roundTimer = null;
        clearTimeout(nameTimer); nameTimer = null;
        leaveFull();
        phase = 'idle'; ejected = null; gateOpen = false;
        spinBtn.disabled = false;
        if (shakeBtn) { shakeBtn.disabled = false; shakeBtn.classList.remove('on'); shakeBtn.textContent = '공 흔들기'; }
        wrap.classList.remove('is-mixing');
        wrap.classList.remove('show-name');
        winners = []; ranks = [];
        if (list) basePool = list;
        basePool.forEach(function (e, i) { e.no = i + 1; });
        pool = basePool.slice();
        layout();                 // the course is built to suit the field size
        spawnBalls();
        renderBoard();
        renderWinners();
        renderRanks(false);
        updateCard();
      }

      function loadRoster(text, redetect) {
        rawRows = parseRows(text);
        var cols = 1;
        rawRows.forEach(function (r) { if (r.length > cols) cols = r.length; });
        if (redetect) {
          var det = detectCols(rawRows);
          nameCol = det.name; deptCol = det.dept; hasHeader = det.header;
        }
        if (nameCol >= cols || nameCol < 0) nameCol = 0;
        if (deptCol >= cols) deptCol = cols < 2 ? -1 : 1;
        fillColSelects(cols);
        return rowsToPool();
      }

      function applyRoster(redetect) {
        var list = loadRoster(namesBox.value, redetect !== false);
        if (list.length < 2) { winnerEl.innerHTML = '두 명 이상 입력해 주세요'; return; }
        restore(list);
        var saved = { t: namesBox.value, n: nameCol, d: deptCol, h: hasHeader };
        try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (err) {}
        saved.src = 'pinball';
        window.dispatchEvent(new CustomEvent('luckyroster', { detail: saved }));
        setDrawer(false);
        var withDept = list.filter(function (e) { return e.d; }).length;
        winnerEl.innerHTML = list.length + '명 등록 · 이름 ' + (nameCol + 1) + '열' +
          (deptCol >= 0 ? ' · 부서 ' + (deptCol + 1) + '열' : '') +
          (withDept ? ' (' + withDept + '명)' : '');
      }

      // the drum's roster changes reach here too, so both games stay in step
      window.addEventListener('luckyroster', function (ev) {
        var o = ev.detail || {};
        if (o.src === 'pinball' || typeof o.t !== 'string') return;
        namesBox.value = o.t; nameCol = o.n | 0; deptCol = o.d | 0; hasHeader = !!o.h;
        var list = loadRoster(o.t, false);
        if (list.length >= 2) restore(list);
      });

      resetBtn.addEventListener('click', function () { restore(null); winnerEl.innerHTML = ''; });
      spinBtn.addEventListener('click', startDraw);
      spinBtn.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); startDraw(); }
      });
      if (shakeBtn) shakeBtn.addEventListener('click', function () { setShake(phase !== 'shake'); });
      if (openBtn) openBtn.addEventListener('click', function () { setDrawer(true); });
      if (drawer) {
        drawer.querySelectorAll('[data-close]').forEach(function (el) {
          el.addEventListener('click', function () { setDrawer(false); });
        });
      }
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && drawer && drawer.classList.contains('open')) setDrawer(false);
      });
      applyBtn.addEventListener('click', function () { applyRoster(true); });
      [nameColEl, deptColEl].forEach(function (el) {
        if (!el) return;
        el.addEventListener('change', function () {
          nameCol = parseInt(nameColEl.value, 10);
          deptCol = parseInt(deptColEl.value, 10);
          if (isNaN(nameCol)) nameCol = 0;
          if (isNaN(deptCol)) deptCol = -1;
          applyRoster(false);
        });
      });
      if (fileEl) {
        fileEl.addEventListener('change', function () {
          var f = fileEl.files && fileEl.files[0];
          if (!f) return;
          var r = new FileReader();
          r.onload = function () {
            var txt = '';
            try {
              txt = new TextDecoder('utf-8').decode(r.result);
              if (txt.indexOf('�') !== -1) txt = new TextDecoder('euc-kr').decode(r.result);
            } catch (err) {
              try { txt = new TextDecoder('euc-kr').decode(r.result); } catch (e2) {}
            }
            namesBox.value = txt;
            applyRoster(true);
            fileEl.value = '';
          };
          r.readAsArrayBuffer(f);
        });
      }

      var rt = null;
      window.addEventListener('resize', function () {
        clearTimeout(rt);
        rt = setTimeout(function () { layout(); if (phase === 'idle' || phase === 'won') spawnBalls(); renderBoard(); }, 150);
      });

      // ---------- init ----------
      var seedText = basePool.map(function (e) { return e.n + ',' + e.d; }).join('\n');
      try {
        var saved = localStorage.getItem(STORE);
        if (saved) {
          var o = JSON.parse(saved);
          if (o && typeof o.t === 'string') {
            seedText = o.t;
            nameCol = o.n | 0; deptCol = o.d | 0; hasHeader = !!o.h;
          }
        }
      } catch (err) {}
      namesBox.value = seedText;
      var seeded = loadRoster(seedText, false);
      if (seeded.length >= 2) basePool = seeded;
      basePool.forEach(function (e, i) { e.no = i + 1; });
      pool = basePool.slice();
      layout();
      spawnBalls();
      renderBoard();
      renderWinners();
      renderRanks(false);
      updateCard();
      cam.y = viewH / 2; cam.ty = cam.y;
      requestAnimationFrame(frame);
    })();

    render();
  </script>
</body>
</html>
