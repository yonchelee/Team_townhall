<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* Rolex Deepsea D-Blue inspired: rich deep ocean blue fading to black */
    --navy:#01060F; --deep-blue:#0E448C; --bright-blue:#1E6FD0;
    --white:#FFFFFF; --accent-glow:rgba(30,111,208,0.45);
    --accent-soft:#7fbfff;
  }

  html, body { height:100%; }
  /* Buttons/links don't inherit type by default - make them follow the body */
  button, a, input, textarea, select { font-family: inherit; }

  body {
    font-family:"SamsungOneKoreanOTF","SamsungOneKorean","SamsungOne",
                -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",
                "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    color: var(--white);
    background: var(--navy);
    overflow: hidden;              /* carousel: page itself never scrolls */
  }

  /* ===== Fixed backdrop (shared across every slide) ===== */
  .backdrop {
    position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    background:
      radial-gradient(58% 48% at 18% 8%, rgba(60,86,255,.34) 0%, transparent 70%),
      radial-gradient(46% 40% at 88% 22%, rgba(0,188,190,.20) 0%, transparent 72%),
      radial-gradient(70% 55% at 62% 108%, rgba(122,58,240,.28) 0%, transparent 72%),
      linear-gradient(
        to bottom,
        #071C3E 0%, #061834 24%, #041228 48%, #030C1C 70%, #020712 88%, #01050C 100%
      );
    animation: kenburns 30s ease-in-out infinite alternate;
  }
  @keyframes kenburns { from { transform:scale(1); } to { transform:scale(1.07); } }

  /* Cinematic vignette: darkens the frame edges like a film print */
  .vignette { position:fixed; inset:0; z-index:2; pointer-events:none;
    background: radial-gradient(ellipse at center,
      transparent 44%, rgba(0,3,10,.40) 74%, rgba(0,3,10,.78) 100%); }
  .ambient { position:absolute; border-radius:50%; filter:blur(90px); }
  .ambient--1 { width:46vw; height:46vw; top:-12vw; left:-8vw;
    background:radial-gradient(circle,rgba(22,92,180,0.30),transparent 70%);
    animation:drift 18s ease-in-out infinite alternate; }
  .ambient--2 { width:40vw; height:40vw; top:8vh; right:-10vw;
    background:radial-gradient(circle,rgba(8,52,110,0.5),transparent 70%);
    animation:drift 22s ease-in-out infinite alternate-reverse; }
  .ambient--3 { width:70vw; height:38vw; bottom:-14vw; left:15vw;
    background:radial-gradient(circle,rgba(16,74,150,0.32),transparent 72%);
    animation:pulseGlow 9s ease-in-out infinite; }
  @keyframes drift { 0%{transform:translate3d(0,0,0) scale(1);}
    100%{transform:translate3d(3vw,2vh,0) scale(1.08);} }
  @keyframes pulseGlow { 0%,100%{opacity:.55;transform:scale(1);}
    50%{opacity:.9;transform:scale(1.06);} }

    box-shadow:0 0 12px 1px rgba(255,255,255,.6);

  @keyframes cometPass {
    0%{transform:translate3d(-10vw,-10vh,0) rotate(24deg);opacity:0;}
    8%{opacity:1;} 40%{opacity:0;}
    100%{transform:translate3d(110vw,80vh,0) rotate(24deg);opacity:0;} }

  .sheen { position:absolute; top:50%; left:50%; width:160vmax; height:160vmax;
    margin:-80vmax 0 0 -80vmax; pointer-events:none; opacity:.22;
    background:conic-gradient(from 0deg, transparent 0deg, var(--bright-blue) 40deg,
      transparent 96deg, transparent 240deg, var(--bright-blue) 290deg, transparent 340deg);
    -webkit-mask-image:radial-gradient(closest-side, transparent 32%, #000 62%, transparent 86%);
    mask-image:radial-gradient(closest-side, transparent 32%, #000 62%, transparent 86%);
    filter:blur(28px); animation:sheenSpin 48s linear infinite; }
  @keyframes sheenSpin { to { transform: rotate(360deg); } }

         target="_blank" rel="noopener">새 탭에서 열기 &#8599;</a>
    </section>

    <!-- MI파트 발표 (제목) -->
    <section id="mi-part" class="slide">
      <div class="kicker reveal" style="--d:.1s">05</div>
      <h2 class="headline reveal" style="--d:.3s">MI파트 발표</h2>
      <div class="rule" style="--d:.55s"></div>
    </section>

    <!-- MI파트 발표 (내용) -->
    <section id="mi-part-content" class="slide slide--embed">
      <div class="embed-wrap">
        <iframe src="https://pages.github.sec.samsung.net/yonche-lee/team_mi" title="MI파트 발표" allow="fullscreen"></iframe>
      </div>
      <a class="embed-open" href="https://pages.github.sec.samsung.net/yonche-lee/team_mi"
         target="_blank" rel="noopener">새 탭에서 열기 &#8599;</a>
    </section>

    <!-- 룰렛 게임 (제목) -->
    <section id="roulette" class="slide">
      <div class="kicker reveal" style="--d:.1s">06</div>
      <h2 class="headline reveal" style="--d:.3s">룰렛 게임</h2>
      <div class="rule" style="--d:.55s"></div>
    </section>

    <!-- 룰렛 게임 (내용) -->
    <section id="roulette-content" class="slide">
      <div class="roulette">
        <div class="wheel-wrap reveal" style="--d:.1s">
          <div class="pointer"></div>
          <svg viewBox="0 0 200 200" aria-label="룰렛">
            <g id="wheel"></g>
            <circle cx="100" cy="100" r="15" fill="#04142E"
                    stroke="rgba(255,255,255,.55)" stroke-width="1.5" />
          </svg>
        </div>
        <button class="spin-btn reveal" style="--d:.25s" id="spinBtn">돌리기</button>
        <div class="winner reveal" style="--d:.35s" id="winner">버튼을 눌러 추첨하세요</div>
        <div class="roul-opts reveal" style="--d:.45s">
          <label><input type="checkbox" id="removeWinner" checked /> 당첨자 제외</label>
          <details class="names-edit">
            <summary>명단 편집</summary>
            <textarea id="namesBox" spellcheck="false"
              aria-label="명단 (한 줄에 한 명)"></textarea>
            <button id="applyNames">적용</button>
          </details>
        </div>
      </div>
    </section>

    <!-- Q&A (제목) -->
    <section id="qna" class="slide">
      <div class="kicker reveal" style="--d:.1s">07</div>
      <h2 class="headline reveal" style="--d:.3s">Q&amp;A</h2>
      <div class="rule" style="--d:.55s"></div>
    </section>

    <!-- Q&A (내용) -->
    <section id="qna-content" class="slide">
      <div class="kicker reveal" style="--d:.1s">Q&amp;A</div>
      <div class="content-panel reveal" style="--d:.3s">
        <p class="placeholder-note">내용 준비 중</p>
      </div>
    </section>
    </div>
  </main>

  <script>
    // ----- Floating particles (generated once on the fixed backdrop) -----
    (function () {
      var container = document.getElementById('particles');
      // Scale particle count with viewport area so large monitors aren't sparse.
      var COUNT = Math.min(180, Math.max(70,
        Math.round(window.innerWidth * window.innerHeight / 16000)));
      var frag = document.createDocumentFragment();
      for (var i = 0; i < COUNT; i++) {
        var p = document.createElement('span');
        p.className = 'particle';
        var size = Math.random() * 3.5 + 2,
            floatDur = Math.random() * 18 + 14,
            twDur = Math.random() * 3 + 2.5;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = (Math.random() * 100) + 'vw';
        p.style.top = (Math.random() * 100) + 'vh';
        p.style.animationDuration = floatDur + 's, ' + twDur + 's';
        p.style.animationDelay = (-Math.random() * floatDur) + 's, ' + (-Math.random() * twDur) + 's';
        frag.appendChild(p);
      }
      container.appendChild(frag);
    })();

    var track   = document.getElementById('track');
    var slides  = Array.prototype.slice.call(document.querySelectorAll('.slide'));
    var dots    = Array.prototype.slice.call(document.querySelectorAll('.nav-dot'));
    var progress = document.getElementById('progress');
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    var TOTAL   = slides.length;
    var current = 0;
    var revealTimer = null;

    // ----- Render current carousel position -----
    function render() {
      track.style.transform = 'translate3d(' + (-current * 100) + '%,0,0)';
      dots.forEach(function (d, i) { d.classList.toggle('active', i === current); });
      progress.style.width = ((current + 1) / TOTAL * 100) + '%';
      prevBtn.disabled = (current === 0);
      nextBtn.disabled = (current === TOTAL - 1);

      // a full-bleed embed gets the whole frame: drop the vignette
      document.body.classList.toggle('embed-mode',
        slides[current].classList.contains('slide--embed'));

      // Cinematic depth: the focused slide sits forward, sharp and lit;
      // its neighbours fall back — smaller, dimmer, out of focus, tilted away.
      slides.forEach(function (sl, i) {
        var off = i - current, a = Math.abs(off);
        if (a === 0) {
          sl.style.transform = 'scale(1) rotateY(0deg)';
          sl.style.opacity = '1';
          sl.style.filter = 'none';
        } else if (a === 1) {
          sl.style.transform = 'scale(.86) rotateY(' + (off > 0 ? -12 : 12) + 'deg)';
          sl.style.opacity = '.3';
          sl.style.filter = 'blur(6px)';
        } else {
          // far slides: no blur filter, keeps the GPU cost down
          sl.style.transform = 'scale(.8)';
          sl.style.opacity = '0';
          sl.style.filter = 'none';
        }
      });

      // play the entrance animation on the slide we landed on
      slides[current].classList.add('in-view');
      // clear the others only after the slide finishes moving, so the
      // outgoing slide doesn't blank out mid-transition
      clearTimeout(revealTimer);
      revealTimer = setTimeout(function () {
        slides.forEach(function (sl, i) {
          if (i !== current) sl.classList.remove('in-view');
        });
      }, 700);
    }

    function goTo(i) {
      i = Math.max(0, Math.min(TOTAL - 1, i));
      if (i === current) return;
      current = i;
      render();
    }
    function next() { goTo(current + 1); }
    function prev() { goTo(current - 1); }

    // Placeholder GitHub links: do nothing until a real URL is filled in
    document.querySelectorAll('a[data-needs-url]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        if (a.getAttribute('href') === '#') e.preventDefault();
      });
    });

    prevBtn.addEventListener('click', prev);
    nextBtn.addEventListener('click', next);
    dots.forEach(function (d, i) {
      d.addEventListener('click', function () { goTo(i); });
    });

    // ----- Keyboard -----
    window.addEventListener('keydown', function (e) {
      if (e.defaultPrevented) return;
      // never steal keys while someone is typing in the name list
      var tg = e.target;
      if (tg && /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)) return;
      if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].indexOf(e.key) !== -1) {
        e.preventDefault(); next();
      } else if (['ArrowLeft', 'ArrowUp', 'PageUp'].indexOf(e.key) !== -1) {
        e.preventDefault(); prev();
      } else if (e.key === 'Home') {
        e.preventDefault(); goTo(0);
      } else if (e.key === 'End') {
        e.preventDefault(); goTo(TOTAL - 1);
      }
    });

    // ----- Wheel / trackpad (throttled so one gesture = one slide) -----
    var wheelLock = false;
    window.addEventListener('wheel', function (e) {
      var d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
      if (Math.abs(d) < 12 || wheelLock) return;
      wheelLock = true;
      setTimeout(function () { wheelLock = false; }, 700);
      if (d > 0) next(); else prev();
    }, { passive: true });

    // ----- Touch swipe -----
    var tX = 0, tY = 0;
    window.addEventListener('touchstart', function (e) {
      tX = e.touches[0].clientX; tY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchend', function (e) {
      var dx = e.changedTouches[0].clientX - tX;
      var dy = e.changedTouches[0].clientY - tY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) next(); else prev();
      }
    }, { passive: true });

    // ----- Roulette wheel -----
    (function () {
      var wheel = document.getElementById('wheel');
      if (!wheel) return;
      var spinBtn = document.getElementById('spinBtn');
      var winnerEl = document.getElementById('winner');
      var namesBox = document.getElementById('namesBox');
      var applyBtn = document.getElementById('applyNames');
      var removeChk = document.getElementById('removeWinner');

      // Edit this list, or use 명단 편집 on the slide itself
      var names = ['참가자 1','참가자 2','참가자 3','참가자 4',
                   '참가자 5','참가자 6','참가자 7','참가자 8'];
      var rotation = 0, spinning = false;
      var SVGNS = 'http://www.w3.org/2000/svg';

      // 0deg = 12 o'clock, angles run clockwise
      function pointAt(deg, r) {
        var a = (deg - 90) * Math.PI / 180;
        return [100 + r * Math.cos(a), 100 + r * Math.sin(a)];
      }

      function draw() {
        while (wheel.firstChild) wheel.removeChild(wheel.firstChild);
        var n = names.length;
        if (!n) return;
        var seg = 360 / n;
        for (var i = 0; i < n; i++) {
          var a0 = i * seg, a1 = (i + 1) * seg;
          var p0 = pointAt(a0, 95), p1 = pointAt(a1, 95);
          var path = document.createElementNS(SVGNS, 'path');
          path.setAttribute('d',
            'M100,100 L' + p0[0].toFixed(2) + ',' + p0[1].toFixed(2) +
            ' A95,95 0 ' + (seg > 180 ? 1 : 0) + ',1 ' +
            p1[0].toFixed(2) + ',' + p1[1].toFixed(2) + ' Z');
          path.setAttribute('fill', i % 2 ? '#1E6FD0' : '#0B3A78');
          path.setAttribute('stroke', 'rgba(255,255,255,.28)');
          path.setAttribute('stroke-width', '0.6');
          wheel.appendChild(path);

          var mid = a0 + seg / 2, tp = pointAt(mid, 60);
          var t = document.createElementNS(SVGNS, 'text');
          t.setAttribute('x', tp[0].toFixed(2));
          t.setAttribute('y', tp[1].toFixed(2));
          t.setAttribute('fill', '#fff');
          t.setAttribute('font-size', n > 14 ? '5' : n > 9 ? '6.4' : '7.6');
          t.setAttribute('font-weight', '700');
          t.setAttribute('text-anchor', 'middle');
          t.setAttribute('dominant-baseline', 'middle');
          t.setAttribute('transform', 'rotate(' + mid + ' ' +
            tp[0].toFixed(2) + ' ' + tp[1].toFixed(2) + ')');
          t.textContent = names[i].length > 10
            ? names[i].slice(0, 10) + '…' : names[i];
          wheel.appendChild(t);
        }
        namesBox.value = names.join('\n');
      }

      function spin() {
        if (spinning || names.length < 2) return;
        spinning = true;
        spinBtn.disabled = true;
        winnerEl.innerHTML = '추첨 중…';
        // 5-8 full turns plus a random landing offset
        rotation += 360 * (5 + Math.floor(Math.random() * 4)) + Math.random() * 360;
        wheel.style.transform = 'rotate(' + rotation + 'deg)';
      }

      wheel.addEventListener('transitionend', function () {
        if (!spinning) return;
        spinning = false;
        spinBtn.disabled = false;
        var n = names.length, seg = 360 / n;
        // the segment now under the pointer started at angle -rotation
        var at = ((-rotation % 360) + 360) % 360;
        var idx = Math.floor(at / seg) % n;
        var hit = names[idx];
        winnerEl.innerHTML = '당첨 <b>' + hit + '</b>';
        if (removeChk.checked && n > 1) {
          names.splice(idx, 1);
          setTimeout(function () {
            rotation = 0;
            wheel.style.transition = 'none';
            wheel.style.transform = 'rotate(0deg)';
            draw();
            // restore the easing on the next frame
            requestAnimationFrame(function () {
              requestAnimationFrame(function () { wheel.style.transition = ''; });
            });
          }, 1600);
        }
      });

      spinBtn.addEventListener('click', spin);
      // Space/Enter would also page the carousel — handle it here instead
      spinBtn.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); spin(); }
      });

      applyBtn.addEventListener('click', function () {
        var list = namesBox.value.split('\n')
          .map(function (v) { return v.trim(); })
          .filter(function (v) { return v; });
        if (list.length < 2) { winnerEl.innerHTML = '두 명 이상 입력해 주세요'; return; }
        names = list;
        rotation = 0;
        wheel.style.transition = 'none';
        wheel.style.transform = 'rotate(0deg)';
        draw();
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { wheel.style.transition = ''; });
        });
        winnerEl.innerHTML = '버튼을 눌러 추첨하세요';
      });

      draw();
    })();

    render();
  </script>
</body>
