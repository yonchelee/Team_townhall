<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* Rolex Deepsea D-Blue inspired: rich deep ocean blue fading to black */
    --navy:#01060F; --deep-blue:#0E448C; --bright-blue:#1E6FD0;
    --white:#FFFFFF; --accent-glow:rgba(30,111,208,0.45);
    --accent-soft:#7fbfff;
  }

  html, body { height:100%; }
  /* Buttons/links don't inherit type by default - make them follow the body */
  button, a, input, textarea, select { font-family: inherit; }

  body {
    font-family:"SamsungOneKoreanOTF","SamsungOneKorean","SamsungOne",
                -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",
                "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    color: var(--white);
    background: var(--navy);
    overflow: hidden;              /* carousel: page itself never scrolls */
  }

  /* ===== Fixed backdrop (shared across every slide) ===== */
  .backdrop {
    position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    background:
      radial-gradient(58% 48% at 18% 8%, rgba(60,86,255,.34) 0%, transparent 70%),
      radial-gradient(46% 40% at 88% 22%, rgba(0,188,190,.20) 0%, transparent 72%),
      radial-gradient(70% 55% at 62% 108%, rgba(122,58,240,.28) 0%, transparent 72%),
      linear-gradient(
        to bottom,
        #071C3E 0%, #061834 24%, #041228 48%, #030C1C 70%, #020712 88%, #01050C 100%
      );
    animation: kenburns 30s ease-in-out infinite alternate;
  }
  @keyframes kenburns { from { transform:scale(1); } to { transform:scale(1.07); } }

  /* Cinematic vignette: darkens the frame edges like a film print */
  .vignette { position:fixed; inset:0; z-index:2; pointer-events:none;
    background: radial-gradient(ellipse at center,
      transparent 44%, rgba(0,3,10,.40) 74%, rgba(0,3,10,.78) 100%); }
  .ambient { position:absolute; border-radius:50%; filter:blur(90px); }
  .ambient--1 { width:46vw; height:46vw; top:-12vw; left:-8vw;
    background:radial-gradient(circle,rgba(22,92,180,0.30),transparent 70%);
    animation:drift 18s ease-in-out infinite alternate; }
  .ambient--2 { width:40vw; height:40vw; top:8vh; right:-10vw;
    background:radial-gradient(circle,rgba(8,52,110,0.5),transparent 70%);
    animation:drift 22s ease-in-out infinite alternate-reverse; }
  .ambient--3 { width:70vw; height:38vw; bottom:-14vw; left:15vw;
    background:radial-gradient(circle,rgba(16,74,150,0.32),transparent 72%);
    animation:pulseGlow 9s ease-in-out infinite; }
  @keyframes drift { 0%{transform:translate3d(0,0,0) scale(1);}
    100%{transform:translate3d(3vw,2vh,0) scale(1.08);} }
  @keyframes pulseGlow { 0%,100%{opacity:.55;transform:scale(1);}
    50%{opacity:.9;transform:scale(1.06);} }

    box-shadow:0 0 12px 1px rgba(255,255,255,.6);

  @keyframes cometPass {
    0%{transform:translate3d(-10vw,-10vh,0) rotate(24deg);opacity:0;}
    8%{opacity:1;} 40%{opacity:0;}
    100%{transform:translate3d(110vw,80vh,0) rotate(24deg);opacity:0;} }

  .sheen { position:absolute; top:50%; left:50%; width:160vmax; height:160vmax;
    margin:-80vmax 0 0 -80vmax; pointer-events:none; opacity:.22;
    background:conic-gradient(from 0deg, transparent 0deg, var(--bright-blue) 40deg,
      transparent 96deg, transparent 240deg, var(--bright-blue) 290deg, transparent 340deg);
    -webkit-mask-image:radial-gradient(closest-side, transparent 32%, #000 62%, transparent 86%);
    mask-image:radial-gradient(closest-side, transparent 32%, #000 62%, transparent 86%);
    filter:blur(28px); animation:sheenSpin 48s linear infinite; }
  @keyframes sheenSpin { to { transform: rotate(360deg); } }

  .network { position:absolute; inset:0; width:100%; height:100%; opacity:.07; }
  .network line { stroke:var(--bright-blue); stroke-width:1; }
  .network circle { fill:var(--bright-blue); }
  .network .twinkle { animation:nodeTwinkle 4s ease-in-out infinite; }
  @keyframes nodeTwinkle { 0%,100%{opacity:.3;} 50%{opacity:1;} }

  .particles { position:absolute; inset:0; }
  .particle { position:absolute; width:3px; height:3px; border-radius:50%;
    background:rgba(255,255,255,1); box-shadow:0 0 12px 2px rgba(140,195,255,.85);
    opacity:0; animation-name:floatUp,twinkle;
    animation-timing-function:linear,ease-in-out;
    animation-iteration-count:infinite,infinite; }
  @keyframes floatUp { 0%{transform:translateY(0);} 100%{transform:translateY(-110vh);} }
  @keyframes twinkle { 0%,100%{opacity:0;} 12%,88%{opacity:1;} 50%{opacity:.45;} }

  .horizon { position:absolute; left:0; bottom:11vh; width:100%; height:1px;
    background:linear-gradient(to right,transparent 0%,rgba(255,255,255,.15) 15%,
      rgba(255,255,255,.95) 50%,rgba(255,255,255,.15) 85%,transparent 100%);
    box-shadow:0 0 24px 4px rgba(30,136,255,.45); opacity:.75; }
  .horizon-glow { position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    width:90vw; height:28vh;
    background:radial-gradient(ellipse at center bottom,rgba(60,140,225,.45) 0%,
      rgba(20,90,170,.28) 28%,transparent 70%);
    filter:blur(10px); animation:horizonBreathe 7s ease-in-out infinite; }
  @keyframes horizonBreathe { 0%,100%{opacity:.7;} 50%{opacity:1;} }

  /* ===== Carousel deck ===== */
  .deck { position:fixed; inset:0; z-index:1; overflow:hidden; perspective:1800px; }
  .track { display:flex; height:100%; width:100%; transform-style:preserve-3d;
    transition: transform .6s cubic-bezier(.76,0,.24,1); will-change: transform; }
  .slide {
    flex: 0 0 100%; width:100%; height:100%;
    position: relative; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 7vh 6vw;
    transform-origin: center center; backface-visibility: hidden;
    will-change: transform, opacity, filter;
    transition: transform .6s cubic-bezier(.76,0,.24,1),
                opacity .45s ease, filter .45s ease;
  }

  /* ===== Scroll-reveal primitives ===== */
  .reveal { opacity: 0; transform: translateY(30px) scale(.98);
    transition: opacity .7s ease, transform .7s cubic-bezier(.22,1,.36,1);
    transition-delay: var(--d, 0s); }
  .slide.in-view .reveal { opacity: 1; transform: none; }

  /* ===== Shared typography ===== */
  .eyebrow, .kicker { font-size:clamp(11px,1.05vw,16px); letter-spacing:.5em;
    text-transform:uppercase; font-weight:600; color:rgba(180,215,255,.9);
    padding-left:.5em; }
  .kicker { margin-bottom:2.6vh; }
  .headline { font-size:clamp(32px,5vw,96px); font-weight:800; letter-spacing:.02em;
    line-height:1.06; color:var(--white); white-space:nowrap;
    text-shadow:0 0 34px rgba(30,136,255,.5),0 0 70px rgba(30,136,255,.22); }
  .subhead { margin-top:2.4vh; font-size:clamp(15px,1.6vw,24px); font-weight:400;
    letter-spacing:.02em; color:rgba(214,232,255,.82); max-width:900px; }
  .rule { width:0; height:2px; margin:3.4vh auto 0;
    background:linear-gradient(to right,transparent,var(--bright-blue),transparent);
    box-shadow:0 0 14px 2px var(--accent-glow);
    transition:width 1.1s ease; transition-delay:var(--d,.6s); }
  .slide.in-view .rule { width:clamp(200px,26vw,460px); }

  /* ===== Intro slide ===== */
  .title { font-size:clamp(46px,5.4vw,88px); font-weight:800; letter-spacing:.10em;
    line-height:1.02; color:var(--white);
    text-shadow:0 0 30px rgba(30,136,255,.5),0 0 60px rgba(30,136,255,.22); }
  .at { font-size:clamp(26px,2.8vw,44px); font-weight:300;
    color:rgba(255,255,255,.7); margin:1.2vh 0 .5vh; }
  .team { font-size:clamp(22px,2.4vw,40px); font-weight:500; letter-spacing:.12em;
    color:var(--white); text-shadow:0 0 22px rgba(30,136,255,.4); }
  .title-rule { width:0; height:2px; margin-top:2.2vh;
    background:linear-gradient(to right,transparent,var(--bright-blue),transparent);
    box-shadow:0 0 14px 2px var(--accent-glow); transition:width 1.2s ease .8s; }
  .slide.in-view .title-rule { width:clamp(160px,18vw,320px); }

  /* ===== Lucky Draw: names | dial | winners ===== */
  .slide--draw { padding:2vh 2vw 8vh; }   /* the bottom band belongs to the pager */
  .draw-layout { display:flex; align-items:center; justify-content:center;
    gap:clamp(12px,1.5vw,28px); width:100%; }
  /* Equal-width side columns put the dial on the page centre line. The
     roster panel does not need its whole column; the leftover is simply
     empty, which is what keeps the dial centred. */
  .draw-side { flex:1 1 0; min-width:0; display:flex; align-items:center; }
  .draw-side--left { justify-content:flex-start; }
  .draw-side--right { justify-content:flex-end; }
  .roster-card, .winners-panel { flex:1 1 auto; width:100%; max-width:640px;
    max-height:78vh;
    display:flex; flex-direction:column; gap:10px; padding:18px 16px;
    border-radius:18px; background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    box-shadow:0 10px 36px rgba(3,11,26,.45); }
  /* the winner list is the one people read from the back of the room */
  .winners-panel { padding:22px 20px; gap:13px; }
  /* Left column is now audience-facing status, not an operator form */
  .roster-card { padding:22px 20px; gap:14px; }
  .rc-count { display:flex; align-items:baseline; gap:10px; }
  .rc-num { font-size:clamp(46px,5vw,104px); font-weight:800; line-height:1;
    color:#fff; font-variant-numeric:tabular-nums;
    text-shadow:0 0 30px rgba(30,136,255,.6), 0 0 70px rgba(30,136,255,.28); }
  .rc-total { font-size:clamp(13px,1.25vw,19px); color:rgba(190,215,255,.72); }
  .rc-total b { color:#fff; font-weight:700; }
  .rc-bar { height:6px; border-radius:99px; background:rgba(255,255,255,.1);
    overflow:hidden; }
  .rc-bar i { display:block; height:100%; border-radius:99px; width:0;
    background:linear-gradient(90deg,var(--deep-blue),var(--bright-blue));
    box-shadow:0 0 12px 1px var(--accent-glow); transition:width .6s ease; }
  .rc-meta { font-size:clamp(11px,1.05vw,15px); color:rgba(190,215,255,.7); }
  /* Ball-number board: the audience matches the number on the drawn ball to
     a name here, so it lists every entrant and loops when it overflows */
  .roster-board { height:38vh; overflow:hidden; border-radius:12px;
    background:rgba(3,11,26,.35); border:1px solid rgba(255,255,255,.1);
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 8%,#000 92%,transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0,#000 8%,#000 92%,transparent 100%); }
  .roster-board ul { list-style:none; margin:0; padding:8px 12px; }
  .roster-board li { display:flex; align-items:baseline; gap:10px;
    padding:4px 0; font-size:clamp(12px,1.15vw,17px); line-height:1.35;
    color:rgba(232,242,255,.92); border-bottom:1px solid rgba(255,255,255,.05); }
  .roster-board li .no { flex:0 0 3.2em; font-weight:800; color:#FFE39A;
    font-variant-numeric:tabular-nums; }
  .roster-board li .nm { font-weight:600; white-space:nowrap; }
  .roster-board li .d { color:rgba(190,215,255,.62); font-size:.85em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .roster-board li.drawn { opacity:.32; }
  .roster-board li.drawn .nm, .roster-board li.drawn .d { text-decoration:line-through; }
  .roster-board li.drawn .no { color:rgba(255,227,154,.5); }
  .roster-board.scroll ul { animation:rosterScroll var(--dur,60s) linear infinite; }
  .roster-board:hover ul { animation-play-state:paused; }
  @keyframes rosterScroll { to { transform:translateY(-50%); } }
  .rc-btn { margin-top:auto; padding:11px 18px; border-radius:999px;
    cursor:pointer; font-size:clamp(12px,1.15vw,16px); font-weight:600;
    color:rgba(220,236,255,.92); background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.22);
    transition:background .25s ease, border-color .25s ease; }
  .rc-btn:hover { background:rgba(30,111,208,.3);
    border-color:rgba(30,111,208,.6); color:#fff; }

  /* the form itself moves into a drawer the presenter opens when needed */
  .roster-drawer { position:fixed; inset:0; z-index:200; visibility:hidden; }
  .roster-drawer.open { visibility:visible; }
  .roster-drawer .scrim { position:absolute; inset:0; opacity:0;
    background:rgba(1,6,15,.72); -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px); transition:opacity .35s ease; }
  .roster-drawer.open .scrim { opacity:1; }
  .roster-drawer .sheet { position:absolute; left:0; top:0; bottom:0;
    width:min(440px,92vw); padding:26px 24px; overflow-y:auto;
    background:rgba(5,18,40,.97);
    border-right:1px solid rgba(255,255,255,.16);
    box-shadow:24px 0 60px rgba(0,0,0,.5);
    display:flex; flex-direction:column; gap:12px;
    transform:translateX(-100%);
    transition:transform .4s cubic-bezier(.22,1,.36,1); }
  .roster-drawer.open .sheet { transform:none; }
  .sheet-head { display:flex; align-items:center; justify-content:space-between; }
  .sheet-x { width:32px; height:32px; border-radius:50%; cursor:pointer;
    font-size:20px; line-height:1; color:#fff;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); }
  .sheet-x:hover { background:rgba(214,64,64,.3); border-color:rgba(214,64,64,.6); }
  .roster-drawer textarea { flex:1 1 auto; min-height:240px; resize:vertical;
    padding:10px 11px; border-radius:12px; font-size:13px; line-height:1.55;
    color:#fff; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.18); }
  .winners-panel .panel-title { font-size:clamp(14px,1.45vw,22px);
    letter-spacing:.18em; }
  .panel-title { font-size:clamp(10px,.95vw,13px); letter-spacing:.2em;
    text-transform:uppercase; font-weight:700; color:rgba(180,215,255,.9); }
  .panel-title span { color:#fff; }

  .panel-hint { font-size:11px; color:rgba(190,215,255,.5); letter-spacing:.02em; }
  .panel-hint b { color:rgba(220,236,255,.85); font-weight:700; }
  .col-map { display:flex; gap:8px; }
  .col-map label { flex:1 1 0; display:flex; align-items:center; gap:5px;
    font-size:11px; color:rgba(190,215,255,.7); }
  .col-map select { flex:1 1 0; min-width:0; padding:4px 6px; border-radius:8px;
    font-size:11px; color:#fff; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2); }
  .names-actions { display:flex; gap:8px; }
  .names-actions .apply-btn { flex:1 1 0; }
  .file-btn { flex:1 1 0; display:inline-flex; align-items:center;
    justify-content:center; padding:8px 12px; border-radius:999px;
    cursor:pointer; font-size:12px; font-weight:600;
    color:rgba(220,236,255,.9); background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.22); }
  .file-btn:hover { background:rgba(30,111,208,.3);
    border-color:rgba(30,111,208,.6); }
  .file-btn input { display:none; }
  .apply-btn { padding:8px 18px; border-radius:999px; cursor:pointer;
    font-size:12px; font-weight:700; color:#fff;
    background:rgba(30,111,208,.3); border:1px solid rgba(30,111,208,.65); }
  .apply-btn:hover { background:rgba(30,111,208,.48); }
  .opt { display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    font-size:clamp(10px,.95vw,13px); color:rgba(190,215,255,.75); }

  /* ----- the race board, sized to fill the middle column ----- */
  .drum-wrap { position:relative; width:100%; aspect-ratio:1; }
  .drum-wrap canvas { width:100%; height:100%; display:block; }
  /* Lucky Drop: a portrait board in the same column */
  .pinball { flex:0 0 auto; width:min(54vh,40vw); display:flex;
    flex-direction:column; align-items:center; gap:1.3vh; }
  .drum-wrap--pin { aspect-ratio:3/4; }
  /* a race runs fullscreen: the column becomes the screen and the board
     keeps its portrait shape inside it */
  .pinball:fullscreen, .pinball:-webkit-full-screen {
    width:100vw; height:100vh; background:#02070F; justify-content:center;
    gap:2vh; padding:2vh 0; }
  .pinball:fullscreen .drum-wrap--pin,
  .pinball:-webkit-full-screen .drum-wrap--pin { width:auto; height:86vh; }
  .pinball:fullscreen .winner, .pinball:-webkit-full-screen .winner { min-height:0; }
  .drum-wrap--pin .drum-glow { inset:2% 8% 6%; border-radius:18%; }
  .drum-wrap--pin .winner-big { top:52%; }
  /* the race board's name is only up for a moment, so it snaps in and out */
  .drum-wrap--pin .winner-big {
    transition:opacity .07s ease, transform .12s cubic-bezier(.2,1.5,.3,1); }
  /* the race board is a narrow portrait, so the finisher's name is sized to it */
  .drum-wrap--pin .wb-name { font-size:clamp(30px,4.6vw,86px); }
  .drum-wrap--pin .wb-dept { font-size:clamp(14px,1.5vw,26px); }
  /* the glow hugs the drum, which sits high-left of centre to leave room for the tube */
  .drum-glow { position:absolute; inset:5.5% 10.5% 15.5%; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(70,150,255,.34) 0%,
      rgba(70,150,255,.12) 46%, transparent 70%);
    filter:blur(20px); opacity:.6;
    transition:opacity .7s ease, transform .7s ease; }
  .drum-wrap.is-mixing .drum-glow { opacity:1; transform:scale(1.07); }
  /* the winner's name, ~5x the old size, laid over the dial so the dial
     itself keeps its full size */
  .winner-big { position:absolute; left:50%; top:45%; z-index:4;
    transform:translate(-50%,-50%) scale(.55);
    font-size:clamp(62px,9vw,170px); font-weight:800; line-height:1;
    letter-spacing:.01em; color:#fff; white-space:nowrap; text-align:center;
    text-shadow:0 0 40px rgba(30,136,255,.95), 0 0 110px rgba(30,136,255,.55),
                0 6px 26px rgba(0,0,0,.65);
    opacity:0; pointer-events:none;
    transition:opacity .35s ease, transform .55s cubic-bezier(.2,1.5,.3,1); }
  .wb-dept { margin-top:.12em; font-size:.26em; font-weight:600;
    letter-spacing:.06em; color:rgba(196,224,255,.9);
    text-shadow:0 0 22px rgba(30,136,255,.8), 0 3px 12px rgba(0,0,0,.6); }
  .winner-big::before { content:''; position:absolute; inset:-45% -22%; z-index:-1;
    background:radial-gradient(ellipse at center,
      rgba(2,8,20,.74) 0%, rgba(2,8,20,.45) 45%, transparent 72%); }
  .drum-wrap.show-name .winner-big { opacity:1;
    transform:translate(-50%,-50%) scale(1); }

  /* 축포 - two cannons firing from the lower corners */
  .confetti { position:fixed; inset:0; z-index:140; pointer-events:none;
    overflow:hidden; }
  .confetti i { position:absolute; display:block; border-radius:2px;
    will-change:transform, opacity;
    animation:shoot var(--dur) cubic-bezier(.16,.68,.36,1) forwards; }
  @keyframes shoot {
    0%   { transform:translate3d(0,0,0) rotate(0deg); opacity:1; }
    45%  { transform:translate3d(calc(var(--dx) * .6), var(--dy), 0)
                     rotate(calc(var(--rot) * .5)); opacity:1; }
    100% { transform:translate3d(var(--dx), 62vh, 0) rotate(var(--rot));
           opacity:0; }
  }

  .spin-btn { padding:12px 36px; border-radius:999px; cursor:pointer;
    font-size:clamp(14px,1.3vw,20px); font-weight:700; color:#fff;
    background:rgba(30,111,208,.3); border:1px solid rgba(30,111,208,.7);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    box-shadow:0 6px 26px rgba(3,11,26,.45), 0 0 24px 1px var(--accent-glow);
    transition:transform .25s ease, background .25s ease, box-shadow .25s ease; }
  .spin-btn:hover:not([disabled]) { transform:translateY(-2px);
    background:rgba(30,111,208,.45); box-shadow:0 10px 32px rgba(30,111,208,.5); }
  .spin-btn[disabled] { opacity:.45; cursor:default; }
  .drum-actions { display:flex; flex-direction:column; align-items:center; gap:10px; }
  /* the blower is the presenter's "show them it's mixed" control */
  .spin-btn--mix { padding:9px 28px; font-size:clamp(12px,1.1vw,17px); font-weight:600;
    background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.28);
    box-shadow:0 6px 22px rgba(3,11,26,.4); }
  .spin-btn--mix:hover:not([disabled]) { background:rgba(255,255,255,.14);
    box-shadow:0 10px 28px rgba(3,11,26,.5); }
  .spin-btn--mix.on { background:rgba(127,216,232,.22); border-color:rgba(127,216,232,.8);
    color:#EAFBFF; box-shadow:0 0 26px 2px rgba(127,216,232,.45); }
  .winner { min-height:1.4em; font-size:clamp(18px,2.2vw,34px); font-weight:800;
    letter-spacing:.02em; color:rgba(214,232,255,.75); }
  .winner b { color:#fff; text-shadow:0 0 26px rgba(30,136,255,.85),
    0 0 60px rgba(30,136,255,.4); }

  /* ----- winners, materialising in ----- */
  .winners-list { list-style:none; margin:0; padding:0; overflow-y:auto;
    flex:1 1 auto; min-height:24vh;
    display:flex; flex-direction:column; gap:10px; text-align:left; }
  .winners-list li { position:relative; display:flex; align-items:center; gap:14px;
    padding:15px 18px; border-radius:15px; background:rgba(30,111,208,.18);
    border:1px solid rgba(30,111,208,.42);
    font-size:clamp(18px,1.65vw,32px); font-weight:600; }
  .winners-list li .w-text { flex:1 1 auto; min-width:0; display:flex;
    flex-direction:column; gap:1px; }
  .winners-list li .w-name { font-weight:700; line-height:1.25;
    white-space:normal; overflow-wrap:anywhere; }
  .winners-list li .w-dept { font-size:.72em; font-weight:500; line-height:1.3;
    color:rgba(180,215,255,.76); white-space:normal; overflow-wrap:anywhere; }
  .winners-list li .no { flex:0 0 auto; width:1.35em; height:1.35em;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:.62em; font-weight:700; background:rgba(255,255,255,.16); }
  /* teleport: a flat beam of light that stretches open and settles */
  .winners-list li.teleport { animation:teleportIn .9s cubic-bezier(.2,.8,.2,1); }
  @keyframes teleportIn {
    0%   { opacity:0; transform:scaleY(.05) scaleX(1.3);
           filter:brightness(3.2) blur(3px);
           box-shadow:0 0 28px 9px rgba(150,205,255,.95); }
    18%  { opacity:1; transform:scaleY(.1) scaleX(1.16);
           filter:brightness(2.8) blur(1.8px); }
    34%  { transform:scaleY(1.2) scaleX(.95);
           filter:brightness(2) blur(.7px);
           box-shadow:0 0 22px 6px rgba(150,205,255,.8); }
    48%  { opacity:.45; transform:scaleY(.88) scaleX(1.04);
           filter:brightness(2.4) blur(1.1px); }
    62%  { opacity:1; transform:scaleY(1.08) scaleX(.99);
           filter:brightness(1.4) blur(0); }
    76%  { opacity:.75; transform:scaleY(.97); }
    100% { opacity:1; transform:none; filter:none;
           box-shadow:0 0 0 0 rgba(150,205,255,0); }
  }
  .winners-list li.teleport::after { content:''; position:absolute;
    left:0; right:0; top:50%; height:2px; pointer-events:none; opacity:0;
    background:linear-gradient(90deg, transparent, #EAF4FF, transparent);
    box-shadow:0 0 16px 5px rgba(150,205,255,.9);
    animation:teleBeam .9s ease-out; }
  @keyframes teleBeam { 0%{transform:scaleX(.15); opacity:1;}
    55%{opacity:.8;} 100%{transform:scaleX(1); opacity:0;} }
  /* the race column shows the finishing order; that is the result */
  .rank-list { min-height:0; gap:8px; }
  .rank-list li { padding:12px 16px; font-size:clamp(16px,1.45vw,26px); gap:12px; }
  .rank-list li .no { width:1.8em; height:1.8em; font-size:.8em; }
  .rank-list li.first { background:rgba(255,227,154,.16); border-color:rgba(255,227,154,.6); }
  .rank-list li.first .no { background:#FFE39A; color:#0A2440; }
  .rank-list .winners-empty { font-size:clamp(12px,1.1vw,16px); }
  .opt select { margin-left:4px; padding:3px 6px; border-radius:6px;
    background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.22); }
  .winners-empty { font-size:clamp(14px,1.4vw,21px); color:rgba(190,215,255,.4);
    padding:4px 2px; }
  .reset-btn { padding:12px 22px; border-radius:999px; cursor:pointer;
    font-size:clamp(13px,1.3vw,19px); font-weight:600;
    color:rgba(220,236,255,.9);
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.22);
    transition:background .25s ease, border-color .25s ease, color .25s ease; }
  .reset-btn:hover { background:rgba(214,64,64,.28);
    border-color:rgba(214,64,64,.6); color:#fff; }

  @media (max-width:1100px) {
    .draw-layout { flex-wrap:wrap; }
    .draw-side { flex:1 1 100%; justify-content:center; }
    .roster-card, .winners-panel { width:min(46vw,340px); max-width:none;
      max-height:34vh; }
    .drum-wrap { width:min(52vh,88vw); }
    .pinball { flex:1 1 100%; order:-1; width:auto; }

  .embed-wrap { width:100%; height:100%; margin:0; border:0; border-radius:0;
    overflow:hidden; box-shadow:none; background:#fff; }
  .embed-wrap iframe { width:100%; height:100%; border:0; display:block; }

  .embed-open { position:absolute; top:14px; right:14px; z-index:5;

    font-size:12px; font-weight:600; color:#fff;

    opacity:.3; transition:opacity .3s ease, background .3s ease; }
  .embed-open:hover { opacity:1; background:rgba(30,111,208,.55); }

  .vignette { transition:opacity .45s ease; }
  body.embed-mode .vignette { opacity:0; }
  /* ===== Closing video: full-bleed, one click to browser fullscreen ===== */
  .slide--video { padding:0; background:#000; cursor:pointer; }
  .slide--video video { position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; background:#000; }
  .video-play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);

    padding:26px 34px; border-radius:24px; cursor:pointer; color:#fff;

    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);

    transition:opacity .3s ease, transform .3s ease; }

  .video-play:hover { transform:translate(-50%,-50%) scale(1.05); }
  .slide--video.playing .video-play { opacity:0; pointer-events:none; }
  .slide--video:fullscreen video { object-fit:contain; }

  .link-btn { display:inline-flex; align-items:center; gap:12px; margin-top:4vh;
    padding:15px 32px; border-radius:999px; text-decoration:none;
    font-size:clamp(14px,1.35vw,20px); font-weight:600; color:#fff;

    box-shadow:0 10px 34px rgba(30,111,208,.45); }
  .link-btn .ext { font-size:1.1em; color:var(--accent-soft); }
  .link-btn--sm { margin-top:2vh; padding:10px 22px;
    font-size:clamp(12px,1.05vw,15px); }
  .link-note { margin-top:1.8vh; font-size:clamp(11px,.95vw,14px);
    color:rgba(190,215,255,.55); letter-spacing:.04em; }

  /* ===== Progress bar ===== */
  .progress { position:fixed; top:0; left:0; height:3px; width:0%; z-index:200;

    box-shadow:0 0 12px 1px var(--accent-glow); transition:width .5s ease; }

  /* ===== Presenter remote ===== */
  .remote-btn { position:fixed; right:18px; bottom:22px; z-index:130;

  .remote-btn:hover { background:rgba(30,111,208,.3); color:#fff; }
  body.remote-on .controls, body.remote-on .remote-btn { opacity:0; pointer-events:none; }
  .controls { transition:opacity .4s ease; }
  html.remote-mode body > :not(.remote-ui) { display:none !important; }
  html.remote-mode body { overflow:auto; background:#02070F; }

  .remote-big button:active { background:rgba(30,111,208,.6); }
  .remote-list { list-style:none; margin:0; padding:0; overflow-y:auto; flex:1 1 auto;
    display:flex; flex-direction:column; gap:6px; }
  .remote-list button { width:100%; text-align:left; padding:11px 14px; border-radius:12px;

  .remote-list .sub button { padding-left:30px; font-size:13px; color:rgba(190,215,255,.75); }

  .remote-hint { font-size:11px; color:rgba(190,215,255,.5); line-height:1.5; }
  .remote-hint.warn { color:#FFB3C7; }

  /* ===== Dot navigation ===== */
  /* prev + dots + next share one bar pinned to the bottom */
  .controls { position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    z-index:130; display:flex; align-items:center; gap:22px; }
  .nav-dots { display:flex; flex-direction:row; align-items:center; gap:14px; }
  .nav-dot { width:11px; height:11px; border-radius:50%;
    background:rgba(4,20,46,.38);
    border:1.5px solid rgba(255,255,255,.92); cursor:pointer; padding:0;
    position:relative; transition:all .35s ease;
    /* dual-tone ring: the white edge reads on dark slides, the dark halo
       around it reads on white pages such as the embedded MI deck */
    box-shadow:0 0 0 1.5px rgba(0,10,26,.55), 0 1px 4px rgba(0,0,0,.35); }
  .nav-dot--sub { width:7px; height:7px; }
  .nav-dot:hover { background:rgba(30,111,208,.65); border-color:#fff; }
  .nav-dot.active { background:var(--bright-blue); border-color:#fff;
    transform:scale(1.4);
    box-shadow:0 0 0 1.5px rgba(0,10,26,.6), 0 0 12px 2px var(--accent-glow); }
  .nav-dot::after { content:attr(data-label); position:absolute; bottom:24px; left:50%;
    transform:translateX(-50%); white-space:nowrap; font-size:12px; letter-spacing:.04em;
    color:rgba(220,236,255,.92); background:rgba(4,20,46,.78);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    padding:5px 11px; border-radius:8px; border:1px solid rgba(255,255,255,.12);
    opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .nav-dot:hover::after { opacity:1; }

  /* ===== Carousel arrows ===== */
  .nav-arrow { flex:0 0 auto;
    width:46px; height:46px; border-radius:50%; cursor:pointer; padding:0;
    background:rgba(4,20,46,.5); border:1px solid rgba(255,255,255,.45);

    box-shadow:0 0 0 1px rgba(0,10,26,.45), 0 4px 14px rgba(0,0,0,.3);
    color:#fff; font-size:26px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition:background .3s ease, border-color .3s ease, opacity .3s ease,

  .nav-arrow:hover:not([disabled]) { background:rgba(30,111,208,.26);
    border-color:rgba(30,111,208,.65); box-shadow:0 0 22px 2px var(--accent-glow); }
  .nav-arrow[disabled] { opacity:.2; cursor:default; }

  @media (max-width:780px) {
    .phrase { white-space:normal; }
    .controls { bottom:16px; gap:14px; }
    .nav-dots { gap:9px; }
    .nav-arrow { width:38px; height:38px; font-size:20px; }

  /* Respect reduced-motion for content entrances, but keep the ambient

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity:1 !important; transform:none !important; transition:none !important; }

    .timeline::before { transform:scaleY(1) !important; transition:none !important; }

  }
</style>
